<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Backlog</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Product Backlog</h1>
        <p class="page-subtitle">Epics, Features, and User Stories with MoSCoW prioritization</p>
      </div>
      <div class="page-actions">
        <div id="projectSelector"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="backlogStats" style="margin-bottom:24px;"></div>

    <!-- View Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchView('hierarchy', event)">Hierarchy View</button>
      <button class="tab" onclick="switchView('kanban', event)">Kanban Board</button>
      <button class="tab" onclick="switchView('table', event)">Table View</button>
      <button class="tab" onclick="switchView('approval', event)">Approval Flow</button>
    </div>

    <div id="view-hierarchy" class="tab-content active"></div>
    <div id="view-kanban" class="tab-content"></div>
    <div id="view-table" class="tab-content"></div>
    <div id="view-approval" class="tab-content"></div>
  </div>

  <div class="modal-overlay" id="architectureModal">
    <div class="modal" style="max-width:980px;">
      <div class="modal-header">
        <h3 class="modal-title" id="architectureTitle">Epic Architecture Panel</h3>
        <button class="modal-close" onclick="closeArchitecturePanel()">&times;</button>
      </div>
      <div class="modal-body" id="architectureBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeArchitecturePanel()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('backlog');
    let currentProjectId = createProjectSelector('projectSelector', renderBacklog);
    let currentBacklogSnapshot = [];
    const approvalState = {};
    const approvalTimers = {};

    function switchView(view, evt) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('view-' + view).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    function renderBacklog() {
      currentProjectId = getSelectedProject();
      const backlog = NexusStore.getBacklog(currentProjectId);
      currentBacklogSnapshot = backlog;
      initApprovalFlow(backlog);

      const epics = backlog.filter(b => b.type === 'EPIC');
      const features = backlog.filter(b => b.type === 'FEATURE');
      const stories = backlog.filter(b => b.type === 'USER_STORY');
      const totalPoints = stories.reduce((a, s) => a + (s.storyPoints || 0), 0);

      // Stats
      document.getElementById('backlogStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Epics</span><span class="stat-value">${epics.length}</span></div>
        <div class="stat-card"><span class="stat-label">Features</span><span class="stat-value">${features.length}</span></div>
        <div class="stat-card"><span class="stat-label">User Stories</span><span class="stat-value">${stories.length}</span></div>
        <div class="stat-card"><span class="stat-label">Total Story Points</span><span class="stat-value">${totalPoints}</span></div>
      `;

      renderHierarchy(backlog, epics, features, stories);
      renderKanban(backlog, stories);
      renderTable(stories);
      renderApprovalFlow(backlog);
    }

    function renderHierarchy(backlog, epics, features, stories) {
      document.getElementById('view-hierarchy').innerHTML = epics.map(epic => {
        const epicFeatures = features.filter(f => f.parentId === epic.id);
        return `
          <div class="card fade-in" style="border-left:3px solid var(--purple);">
            <div class="card-header">
              <div>
                <span style="font-size:11px; color:var(--purple); font-weight:600;">EPIC</span>
                <h3 class="card-title" style="cursor:pointer;" onclick="openArchitecturePanel('${epic.id}')">${escapeHtml(epic.title)}</h3>
                <span class="card-subtitle">${epic.id} · ${epic.module}</span>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-outline btn-sm" onclick="openArchitecturePanel('${epic.id}')">Architecture</button>
                ${priorityBadge(epic.priority)}
                ${statusBadge(epic.status)}
              </div>
            </div>
            <div style="padding-left:20px; border-left:2px solid var(--border); margin-left:8px;">
              ${epicFeatures.map(feat => {
                const featStories = stories.filter(s => s.parentId === feat.id);
                return `
                  <div style="margin-bottom:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:8px 12px; background:var(--bg-tertiary); border-radius:var(--radius);">
                      <div>
                        <span style="font-size:11px; color:var(--info); font-weight:600;">FEATURE</span>
                        <div style="font-size:13px; font-weight:600;">${escapeHtml(feat.title)}</div>
                        <span style="font-size:11px; color:var(--text-muted);">${feat.id}</span>
                      </div>
                      <div style="display:flex;gap:6px;">${priorityBadge(feat.priority)}${statusBadge(feat.status)}</div>
                    </div>
                    ${featStories.map(story => `
                      <div style="margin-left:20px; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                          <span style="font-size:11px; color:var(--success); font-weight:600;">USER STORY</span>
                          <div style="font-size:13px;">${escapeHtml(story.title)}</div>
                          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${story.id} · ${story.module} · ${story.storyPoints || 0} pts (${story.size || '?'})</div>
                          ${story.acceptanceCriteria ? `<div style="margin-top:6px;">${story.acceptanceCriteria.map(ac => `<span class="tag" style="margin:2px;">${escapeHtml(ac)}</span>`).join('')}</div>` : ''}
                        </div>
                        <div style="display:flex; gap:6px; flex-direction:column; align-items:flex-end;">
                          ${priorityBadge(story.priority)}
                          ${statusBadge(story.status)}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('') || '<div class="empty-state"><div class="empty-state-icon">📝</div><h3 class="empty-state-title">No Backlog Items</h3><p class="empty-state-text">Run the pipeline to generate backlog items</p></div>';
    }

    function renderKanban(backlog, stories) {
      const columns = ['SPECIFIED', 'IN_PROGRESS', 'DONE'];
      const labels = { SPECIFIED: 'To Do', IN_PROGRESS: 'In Progress', DONE: 'Done' };
      const colors = { SPECIFIED: 'var(--warning)', IN_PROGRESS: 'var(--info)', DONE: 'var(--success)' };

      document.getElementById('view-kanban').innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
          ${columns.map(col => `
            <div style="background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-size:14px; font-weight:600; color:${colors[col]}">${labels[col]}</h3>
                <span class="tag">${stories.filter(s => s.status === col).length}</span>
              </div>
              ${stories.filter(s => s.status === col).map(s => `
                <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:8px;">
                  <div style="font-size:12px; color:var(--accent); font-family:var(--mono);">${s.id}</div>
                  <div style="font-size:13px; font-weight:500; margin:4px 0;">${escapeHtml(s.title)}</div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                    <span class="tag">${s.module}</span>
                    <span style="font-size:11px; color:var(--text-muted)">${s.storyPoints || 0} pts</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTable(stories) {
      document.getElementById('view-table').innerHTML = `
        <div class="table-container">
          <table>
            <thead><tr><th>ID</th><th>Title</th><th>Module</th><th>Priority</th><th>Size</th><th>Points</th><th>Status</th></tr></thead>
            <tbody>
              ${stories.map(s => `
                <tr>
                  <td style="font-family:var(--mono); font-size:12px; color:var(--accent);">${s.id}</td>
                  <td>${escapeHtml(s.title)}</td>
                  <td><span class="tag">${s.module}</span></td>
                  <td>${priorityBadge(s.priority)}</td>
                  <td><span class="tag">${s.size || '?'}</span></td>
                  <td style="font-weight:600;">${s.storyPoints || 0}</td>
                  <td>${statusBadge(s.status)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function approvalKey(itemId) {
      return currentProjectId + ':' + itemId;
    }

    function initApprovalFlow(backlog) {
      backlog.forEach(item => {
        const key = approvalKey(item.id);
        if (!approvalState[key]) {
          approvalState[key] = {
            ba: {
              status: 'WORKING',
              action: 'Refining requirements',
              output: 'Updated description draft'
            },
            po: {
              status: 'WORKING',
              action: 'Validating acceptance',
              output: 'Acceptance review in progress'
            }
          };
        }
        if (!approvalTimers[key]) {
          approvalTimers[key] = true;
          scheduleAgentApproval(key, 'ba');
          scheduleAgentApproval(key, 'po');
        }
      });
    }

    function scheduleAgentApproval(key, agentType) {
      const completeDelay = 2000 + Math.floor(Math.random() * 2000);
      const approveDelay = completeDelay + 600 + Math.floor(Math.random() * 600);

      setTimeout(() => {
        updateApprovalState(key, agentType, 'COMPLETED');
      }, completeDelay);

      setTimeout(() => {
        updateApprovalState(key, agentType, 'APPROVED');
      }, approveDelay);
    }

    function updateApprovalState(key, agentType, stage) {
      const state = approvalState[key];
      if (!state || !state[agentType]) return;

      if (agentType === 'ba') {
        if (stage === 'COMPLETED') {
          state.ba.status = 'COMPLETED';
          state.ba.action = 'Requirements refined';
          state.ba.output = 'Updated description';
        } else if (stage === 'APPROVED') {
          state.ba.status = 'APPROVED';
          state.ba.action = 'Requirements approved';
          state.ba.output = 'Finalized requirement notes';
        }
      }

      if (agentType === 'po') {
        if (stage === 'COMPLETED') {
          state.po.status = 'COMPLETED';
          state.po.action = 'Acceptance validated';
          state.po.output = 'Approved criteria draft';
        } else if (stage === 'APPROVED') {
          state.po.status = 'APPROVED';
          state.po.action = 'Acceptance approved';
          state.po.output = 'Approved criteria';
        }
      }

      if (key.startsWith(currentProjectId + ':')) {
        renderApprovalFlow(currentBacklogSnapshot);
      }
    }

    function prettyApprovalStatus(status) {
      if (status === 'WORKING') return 'Working';
      if (status === 'COMPLETED') return 'Completed';
      if (status === 'APPROVED') return 'Approved';
      return status;
    }

    function approvalStatusBadge(status) {
      if (status === 'WORKING') return statusBadge('EXECUTING');
      return statusBadge(status);
    }

    function renderApprovalFlow(backlog) {
      const ordered = backlog
        .filter(i => i.type === 'EPIC')
        .concat(backlog.filter(i => i.type === 'FEATURE'))
        .concat(backlog.filter(i => i.type === 'USER_STORY'));

      document.getElementById('view-approval').innerHTML = ordered.map(item => {
        const state = approvalState[approvalKey(item.id)] || {
          ba: { status: 'WORKING', action: 'Refining requirements', output: 'Updated description draft' },
          po: { status: 'WORKING', action: 'Validating acceptance', output: 'Acceptance review in progress' }
        };
        const bothApproved = state.ba.status === 'APPROVED' && state.po.status === 'APPROVED';

        return `
          <div class="card" style="margin-bottom:12px;">
            <div class="card-header">
              <div>
                <span class="tag">${item.type.replace('_', ' ')}</span>
                <h3 class="card-title" style="margin-top:8px;">${escapeHtml(item.title)}</h3>
                <span class="card-subtitle">${item.id} · ${item.module || 'global'}</span>
              </div>
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                ${priorityBadge(item.priority)}
                ${statusBadge(item.status)}
                ${bothApproved ? statusBadge('APPROVED') : ''}
              </div>
            </div>

            <div class="approval-grid">
              <div class="approval-col">
                <h4>Business Analyst</h4>
                <div class="approval-row"><strong>Status:</strong> ${prettyApprovalStatus(state.ba.status)} ${approvalStatusBadge(state.ba.status)}</div>
                <div class="approval-row"><strong>Action:</strong> ${escapeHtml(state.ba.action)}</div>
                <div class="approval-row"><strong>Output:</strong> ${escapeHtml(state.ba.output)}</div>
              </div>
              <div class="approval-col">
                <h4>Product Owner</h4>
                <div class="approval-row"><strong>Status:</strong> ${prettyApprovalStatus(state.po.status)} ${approvalStatusBadge(state.po.status)}</div>
                <div class="approval-row"><strong>Action:</strong> ${escapeHtml(state.po.action)}</div>
                <div class="approval-row"><strong>Output:</strong> ${escapeHtml(state.po.output)}</div>
              </div>
            </div>

            ${bothApproved ? `
              <div class="approval-final">
                <strong>APPROVED BACKLOG ITEM</strong>
                <span class="tag" style="color:var(--success); border-color:var(--success);">APPROVED</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('') || '<div class="empty-state"><div class="empty-state-icon">✅</div><h3 class="empty-state-title">No Backlog Items to Approve</h3></div>';
    }

    function getEpicArchitectureBlueprint(moduleName) {
      const blueprints = {
        auth: {
          tables: [
            { table: 'users', purpose: 'Identity and profile', keyFields: 'id, email, password_hash, role' },
            { table: 'auth_sessions', purpose: 'Session and token rotation', keyFields: 'session_id, user_id, refresh_token, expires_at' },
            { table: 'auth_audit', purpose: 'Security and access logs', keyFields: 'event_id, user_id, ip, action, created_at' }
          ],
          modules: ['Auth', 'Session', 'Audit'],
          apis: ['POST /auth/login', 'POST /auth/register', 'POST /auth/refresh']
        },
        payments: {
          tables: [
            { table: 'payment_intents', purpose: 'Track initiation and lifecycle', keyFields: 'intent_id, order_id, amount, status' },
            { table: 'payment_events', purpose: 'Gateway webhook logs', keyFields: 'event_id, provider, payload_hash, received_at' }
          ],
          modules: ['Payments', 'Settlement', 'Reconciliation'],
          apis: ['POST /payments/initiate', 'POST /payments/confirm', 'POST /payments/webhook']
        },
        orders: {
          tables: [
            { table: 'orders', purpose: 'Order header and lifecycle', keyFields: 'order_id, user_id, total, status' },
            { table: 'order_items', purpose: 'Line items', keyFields: 'item_id, order_id, sku, qty, price' },
            { table: 'order_events', purpose: 'Status transitions', keyFields: 'event_id, order_id, from_status, to_status' }
          ],
          modules: ['Orders', 'Fulfillment', 'Tracking'],
          apis: ['POST /orders/create', 'PATCH /orders/:id/status', 'GET /orders/:id/track']
        }
      };

      return blueprints[moduleName] || {
        tables: [{ table: moduleName + '_entity', purpose: 'Core module data', keyFields: 'id, status, created_at' }],
        modules: [moduleName],
        apis: ['POST /' + moduleName + '/create']
      };
    }

    function openArchitecturePanel(epicId) {
      currentProjectId = getSelectedProject();
      const backlog = NexusStore.getBacklog(currentProjectId);
      const epic = backlog.find(i => i.type === 'EPIC' && i.id === epicId);
      if (!epic) return;

      const features = backlog.filter(i => i.type === 'FEATURE' && i.parentId === epic.id);
      const stories = backlog.filter(i => i.type === 'USER_STORY' && features.some(f => f.id === i.parentId));
      const blueprint = getEpicArchitectureBlueprint(epic.module);

      document.getElementById('architectureTitle').textContent = epic.id + ' — Architecture Panel';
      document.getElementById('architectureBody').innerHTML = `
        <div class="grid grid-2">
          <div class="card" style="margin-bottom:0;">
            <div class="card-header">
              <div>
                <h3 class="card-title">Epics Input</h3>
                <span class="card-subtitle">Backlog context selected from Product Backlog</span>
              </div>
              ${statusBadge(epic.status)}
            </div>
            <div style="font-size:13px; margin-bottom:8px;"><strong>${epic.id}</strong> · ${escapeHtml(epic.title)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Module: ${epic.module}</div>
            <div style="margin-bottom:10px;">
              <span class="form-label" style="margin-bottom:4px;">Feature Inputs</span>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">${features.map(f => `<span class="tag">${f.id}</span>`).join('') || '<span class="tag">No features</span>'}</div>
            </div>
            <div>
              <span class="form-label" style="margin-bottom:4px;">Story Inputs</span>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">${stories.map(s => `<span class="tag">${s.id}</span>`).join('') || '<span class="tag">No stories</span>'}</div>
            </div>
          </div>

          <div class="card" style="margin-bottom:0; border-left:3px solid var(--accent);">
            <div class="card-header">
              <div>
                <h3 class="card-title">Chief Architect Output</h3>
                <span class="card-subtitle">Architecture synthesis from approved backlog</span>
              </div>
              ${statusBadge('APPROVED')}
            </div>

            <div style="margin-bottom:10px;">
              <span class="form-label" style="margin-bottom:4px;">DB Schema</span>
              <div class="table-container">
                <table>
                  <thead><tr><th>Table</th><th>Purpose</th><th>Key Fields</th></tr></thead>
                  <tbody>
                    ${blueprint.tables.map(t => `<tr><td>${t.table}</td><td>${t.purpose}</td><td>${t.keyFields}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <span class="form-label" style="margin-bottom:4px;">Modules</span>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">${blueprint.modules.map(m => `<span class="tag">${m}</span>`).join('')}</div>
            </div>

            <div>
              <span class="form-label" style="margin-bottom:4px;">APIs</span>
              <div style="display:flex; flex-direction:column; gap:6px;">
                ${blueprint.apis.map(api => `<span class="tag" style="font-family:var(--mono); width:max-content;">${api}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('architectureModal').classList.add('show');
    }

    function closeArchitecturePanel() {
      document.getElementById('architectureModal').classList.remove('show');
    }

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    renderBacklog();
  </script>
</body>
</html>
