<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Pipeline</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">AI Processing Pipeline</h1>
        <p class="page-subtitle">13-stage requirement processing and backlog generation</p>
      </div>
      <div class="page-actions">
        <div id="projectSelector"></div>
        <button class="btn btn-primary" id="runBtn" onclick="runNextStage()">▶ Run Next Stage</button>
        <button class="btn btn-success" id="runAllBtn" onclick="runAllStages()">⚡ Run All</button>
      </div>
    </div>

    <!-- Pipeline Progress -->
    <div class="card" style="margin-bottom:24px;">
      <div class="card-header">
        <h3 class="card-title" id="pipelineTitle">Pipeline Status</h3>
        <div id="pipelineStatus"></div>
      </div>
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:13px; color:var(--text-secondary)" id="progressLabel">0 / 13 stages</span>
          <span style="font-size:13px; font-weight:600; color:var(--text-primary)" id="progressPct">0%</span>
        </div>
        <div class="progress-bar" style="height:12px;">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Stages -->
    <div id="stagesContainer"></div>

    <!-- Pipeline Log -->
    <div class="card" style="margin-top:24px;">
      <div class="card-header">
        <h3 class="card-title">Pipeline Execution Log</h3>
        <button class="btn btn-outline btn-sm" onclick="clearLog()">Clear</button>
      </div>
      <div id="pipelineLog" class="code-block" style="max-height:300px; overflow-y:auto; font-size:12px;"></div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/orchestration-runtime.js"></script>
  <script>
    seedNexusData();
    createNavigation('pipeline');
    createProjectSelector('projectSelector', () => {});
    
    let pipelineLog = [];
    let liveTicker = null;

    function formatTimer(seconds) {
      const safe = Math.max(0, Math.floor(seconds || 0));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderPipeline() {
      const snapshot = NexusOrchestration.getSnapshot();
      const phases = NexusOrchestration.getPhases();
      const currentPhase = phases[snapshot.phaseIndex];

      // Auto Redirect if not in ai_pipeline phase (and not waiting for BA to finish)
      if (currentPhase && currentPhase.id !== 'ai_pipeline' && currentPhase.id !== 'business_analyst') {
        window.location.href = 'system-flow.html';
        return;
      }

      const tasks = snapshot.aiPipelineTasks || [];
      const completed = tasks.filter(t => t.status === 'COMPLETED').length;
      const pct = Math.round((completed / 13) * 100);

      document.getElementById('pipelineStatus').innerHTML = statusBadge(currentPhase.id === 'ai_pipeline' ? 'IN_PROGRESS' : 'PENDING');
      document.getElementById('progressLabel').textContent = `${completed} / 13 stages`;
      document.getElementById('progressPct').textContent = pct + '%';
      document.getElementById('progressFill').style.width = pct + '%';

      if (completed === 13) {
        document.getElementById('pipelineTitle').textContent = 'Pipeline Complete';
      }

      document.getElementById('stagesContainer').innerHTML = tasks.map((task, idx) => {
        const stageNum = idx + 1;
        const statusClass = task.status === 'COMPLETED' ? 'completed' : (task.status === 'EXECUTING' || task.status === 'SPECIFIED') ? 'in-progress' : 'pending';
        const statusIcon = task.status === 'COMPLETED' ? '✓' : (task.status === 'EXECUTING' || task.status === 'SPECIFIED') ? '◉' : stageNum;
        
        return `
          <div class="pipeline-stage ${statusClass} fade-in" style="animation-delay:${stageNum * 0.05}s">
            <div class="pipeline-stage-number">${statusIcon}</div>
            <div class="pipeline-stage-info">
              <div class="pipeline-stage-name">Stage ${stageNum}: ${task.name}</div>
              <div class="pipeline-stage-logs">
                <div style="margin:2px 0;">• Status: ${task.status}</div>
                <div style="margin:2px 0;">• Timer: ${formatTimer(task.timerSec)} / 00:05</div>
                <div style="margin:2px 0;">• Tokens used: ${task.tokens}</div>
              </div>
            </div>
            <div class="pipeline-stage-time">
              ${statusBadge(task.status)}
            </div>
          </div>
        `;
      }).join('');
      
      // Update Log
      const logEl = document.getElementById('pipelineLog');
      logEl.innerHTML = snapshot.events.filter(e => e.type === 'STAGE_CHANGE' || e.type === 'TASK_START' || e.type === 'TASK_COMPLETE')
        .map(e => `[${formatTime(e.timestamp)}] ${escapeHtml(e.message)}`)
        .join('<br>');
      logEl.scrollTop = logEl.scrollHeight;
    }

    function startRuntimeTicker() {
      if (!liveTicker) {
        liveTicker = setInterval(() => {
          const project = NexusStore.getProject(getSelectedProject());
          if (project && project.isRunning === false) {
            clearInterval(liveTicker);
            liveTicker = null;
            renderPipeline();
            return;
          }
          renderPipeline();
        }, 1000);
      }
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'nexus_orchestration_runtime_v1') {
        renderPipeline();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (liveTicker) clearInterval(liveTicker);
    });

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    // Hide manual run buttons since orchestration is automatic
    document.getElementById('runBtn').style.display = 'none';
    document.getElementById('runAllBtn').style.display = 'none';

    renderPipeline();
    startRuntimeTicker();
  </script>
</body>
</html>
