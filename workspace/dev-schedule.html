<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Developer Schedule</title>
  <link rel="stylesheet" href="../css/common.css">
  <script>try{const theme=localStorage.getItem("theme");if(theme==="light"||theme==="dark"){document.documentElement.dataset.theme=theme;}}catch(e){}</script>

  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="main-content" id="app">
    <div id="devPageChrome"></div>
    <div id="devPageContent"></div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/dev-data.js"></script>
  <script src="../js/dev-render.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await DevRender.bootstrapPage({
        activeTab: 'schedule',
        section: 'schedule',
        pageTitle: 'Developer Schedule',
        pageSubtitle: 'Development milestones, delays, reasons, mitigation, and progress tracking',
        renderMethod: 'renderSchedule'
      });
    });
  </script>
  <script src="../js/theme.js"></script>
</body>
</html>
