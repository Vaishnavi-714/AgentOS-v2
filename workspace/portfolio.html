<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Project Portfolio</title>
  <meta name="description" content="NEXUS Project Portfolio — Control Tower for Product Management">
  <link rel="stylesheet" href="../css/common.css">
  <script>try{const theme=localStorage.getItem("theme");if(theme==="light"||theme==="dark"){document.documentElement.dataset.theme=theme;}}catch(e){}</script>

  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">🏢 Project Portfolio</h1>
        <p class="page-subtitle">Control Tower — Select a project to open its decision dashboard</p>
      </div>
      <div class="page-actions">
        <div class="phase-switcher" id="filterPhase">
          <button class="phase-btn active" onclick="filterProjects('all')">All</button>
          <button class="phase-btn" onclick="filterProjects('idea')">🟣 Idea</button>
          <button class="phase-btn" onclick="filterProjects('execution')">🟡 Execution</button>
          <button class="phase-btn" onclick="filterProjects('post-launch')">🟢 Post-Launch</button>
        </div>
      </div>
    </div>

    <!-- Portfolio Summary Stats -->
    <div class="portfolio-stats" id="portfolioStats"></div>

    <!-- Project Cards Grid -->
    <div class="portfolio-grid" id="portfolioGrid"></div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/pm-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const _role = localStorage.getItem("role");
    if (_role !== "tenant") { window.location.href = "../index.html"; }
    seedNexusData();
    createNavigation('portfolio');

    if (TenantState.isTenantUser()) {
      injectTenantInfoCard();
    }

    // Store PM role
    localStorage.setItem('nexus_pm_role', 'product_manager');

    let currentFilter = 'all';

    function filterProjects(phase) {
      currentFilter = phase;
      document.querySelectorAll('#filterPhase .phase-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderPortfolio();
    }

    function getHealthColor(h) {
      return { green: '#10b981', yellow: '#f59e0b', red: '#ef4444' }[h] || '#6b7280';
    }

    function renderPortfolio() {
      const projects = currentFilter === 'all'
        ? PMData.projects
        : PMData.projects.filter(p => p.phase === currentFilter);

      // Stats
      const totalProjects = PMData.projects.length;
      const atRisk = PMData.projects.filter(p => p.health === 'red').length;
      const avgHealth = Math.round(PMData.projects.reduce((s, p) => s + p.healthScore, 0) / totalProjects);
      const activeProjects = PMData.projects.filter(p => p.phase === 'execution').length;

      document.getElementById('portfolioStats').innerHTML = `
        <div class="portfolio-stat">
          <div class="portfolio-stat-value">${totalProjects}</div>
          <div class="portfolio-stat-label">Total Projects</div>
        </div>
        <div class="portfolio-stat">
          <div class="portfolio-stat-value">${activeProjects}</div>
          <div class="portfolio-stat-label">In Execution</div>
        </div>
        <div class="portfolio-stat">
          <div class="portfolio-stat-value" style="color: ${avgHealth >= 70 ? '#10b981' : avgHealth >= 50 ? '#f59e0b' : '#ef4444'}">${avgHealth}%</div>
          <div class="portfolio-stat-label">Avg Health</div>
        </div>
        <div class="portfolio-stat">
          <div class="portfolio-stat-value" style="color: ${atRisk > 0 ? '#ef4444' : '#10b981'}">${atRisk}</div>
          <div class="portfolio-stat-label">At Risk</div>
        </div>
      `;

      // Cards
      document.getElementById('portfolioGrid').innerHTML = projects.map(p => {
        const hc = getHealthColor(p.health);
        const phaseColor = PMData.getPhaseColor(p.phase);
        const budgetPct = Math.round((p.budget.spent / p.budget.allocated) * 100);
        return `
          <div class="portfolio-card fade-in" style="--card-accent: ${phaseColor}" onclick="openProject('${p.id}')">
            <div class="portfolio-card-header">
              <div>
                <div class="portfolio-card-title">${p.name}</div>
                <div class="portfolio-card-domain">${p.domain}</div>
              </div>
              <span class="phase-badge ${p.phase}">${PMData.getPhaseIcon(p.phase)} ${PMData.getPhaseLabel(p.phase)}</span>
            </div>

            <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
              <span class="health-dot ${p.health}"></span>
              <span style="font-size:13px; font-weight:600; color:${hc}">${p.healthScore}% Health</span>
              <span style="margin-left:auto; font-size:12px; color:var(--text-muted)">Owner: ${p.owner}</span>
            </div>

            <div style="margin-bottom:14px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-size:11px; color:var(--text-muted)">Progress</span>
                <span style="font-size:11px; font-weight:600; color:var(--text-primary)">${p.progress}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${p.progress}%; background: linear-gradient(90deg, ${phaseColor}, ${hc})"></div>
              </div>
            </div>

            <div class="portfolio-card-meta">
              <div class="portfolio-meta-item">
                <div class="portfolio-meta-label">Status</div>
                <div class="portfolio-meta-value">${PMData.getStatusIcon(p.status)} ${p.status}</div>
              </div>
              <div class="portfolio-meta-item">
                <div class="portfolio-meta-label">Budget Used</div>
                <div class="portfolio-meta-value" style="color:${budgetPct > 80 ? '#ef4444' : budgetPct > 60 ? '#f59e0b' : '#10b981'}">${budgetPct}%</div>
              </div>
              <div class="portfolio-meta-item">
                <div class="portfolio-meta-label">Team Size</div>
                <div class="portfolio-meta-value">👥 ${p.team}</div>
              </div>
              <div class="portfolio-meta-item">
                <div class="portfolio-meta-label">Target</div>
                <div class="portfolio-meta-value">${new Date(p.targetDate).toLocaleDateString('en-US', {month:'short', year:'numeric'})}</div>
              </div>
            </div>

            ${(p.redFlags && p.redFlags.length > 0) ? `
              <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
                <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--danger); font-weight:600;">
                  🚨 ${p.redFlags.filter(f => f.severity === 'critical').length} Critical Alert${p.redFlags.filter(f => f.severity === 'critical').length !== 1 ? 's' : ''}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function openProject(id) {
      sessionStorage.setItem('pm_selected_project', id);
      window.location.href = 'pm-dashboard.html';
    }

    renderPortfolio();
  </script>
  <script src="../js/theme.js"></script>
</body>
</html>
