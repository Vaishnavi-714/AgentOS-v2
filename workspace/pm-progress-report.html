<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Project Progress Report</title>
  <link rel="stylesheet" href="../css/common.css">

  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="main-content" id="app">
    <div id="pmPageChrome"></div>
    <div id="pmPageContent"></div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/pm-data.js"></script>
  <script src="../js/pm-render.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await PMRender.bootstrapPage({
        activeTab: 'progress-report',
        section: 'progressReport',
        pageTitle: 'Project Progress Report',
        pageSubtitle: 'Decision-ready product progress across status, scope, roadmap, timeline, cost, quality, risks, impact, and next decisions',
        renderMethod: 'renderProgressReport'
      });
    });
  </script>
  <script src="../js/theme.js"></script>
</body>
</html>
