<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Integrations</title>
  <link rel="stylesheet" href="../css/common.css">

  <link rel="stylesheet" href="../css/theme.css">
  <style>
    .integration-card {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .integration-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.22);
    }

    .integration-card-footer {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .integration-add-btn {
      padding: 9px 14px;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(99,102,241,0.18);
      transform: translateY(0);
    }

    .integration-add-btn:hover,
    .integration-add-btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(99,102,241,0.28);
    }

    .integration-add-btn .arrow-icon {
      font-size: 15px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    .integration-summary {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
    }

    .integration-summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .integration-summary-row strong {
      color: var(--text-secondary);
      font-family: var(--mono);
      font-weight: 600;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .integration-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .integration-form-grid .full {
      grid-column: 1 / -1;
    }

    .field-error {
      color: var(--danger);
      font-size: 11px;
      margin-top: 5px;
      min-height: 14px;
    }

    .setup-description {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    @media (max-width: 720px) {
      .integration-form-grid { grid-template-columns: 1fr; }
      .modal.integration-setup-modal {
        width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
      }
    }
  </style>
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">Integrations</h1>
        <p class="page-subtitle">Connect external tools — GitHub, Jira, Slack, CI/CD, enterprise systems</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="integrationStats" style="margin-bottom:24px"></div>

    <!-- Integration Categories -->
    <div id="integrationGrid"></div>

    <!-- Integration Detail Modal -->
    <div class="modal-overlay" id="integDetailModal" style="display:none">
      <div class="modal" style="max-width:700px;">
        <div class="modal-header">
          <h3 class="modal-title" id="integDetailTitle">Integration</h3>
          <button class="modal-close" onclick="closeModal('integDetailModal')">&times;</button>
        </div>
        <div class="modal-body" id="integDetailBody"></div>
        <div class="modal-footer" id="integDetailFooter"></div>
      </div>
    </div>

    <!-- Integration Setup Modal -->
    <div class="modal-overlay" id="integSetupModal" style="display:none">
      <div class="modal integration-setup-modal" style="max-width:760px;">
        <div class="modal-header">
          <h3 class="modal-title" id="integSetupTitle">Add Integration</h3>
          <button class="modal-close" onclick="closeModal('integSetupModal')" aria-label="Close setup">&times;</button>
        </div>
        <div class="modal-body" id="integSetupBody"></div>
        <div class="modal-footer" id="integSetupFooter"></div>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/event-bus.js"></script>
  <script src="../js/nav.js"></script>

        ],
        fields: [

          { key: 'workflowAlerts', label: 'Enable workflow alerts', type: 'toggle' }
        ]
      }
    };

    const baselineIntegrations = [
        { id: 'INT-001', name: 'GitHub', icon: '🐙', category: 'Developer Tools', status: 'CONNECTED', description: 'Source code, PRs, issues, and webhooks', connected_at: new Date(Date.now() - 86400000*30).toISOString(), config: { org: 'nexus-platform', repos: 3, webhooks: ['push','pull_request','release'], api_calls_today: 1245 }, features: ['PR auto-review on push', 'Issue sync to backlog', 'Release auto-tagging', 'Branch protection rules'], health: 'HEALTHY', last_sync: new Date(Date.now() - 300000).toISOString() },
        { id: 'INT-002', name: 'Jira', icon: '📋', category: 'Developer Tools', status: 'CONNECTED', description: 'Project management, sprints, and issue tracking', connected_at: new Date(Date.now() - 86400000*25).toISOString(), config: { project: 'NEX', board: 'Scrum Board', issues_synced: 156, sprints_active: 2 }, features: ['Bi-directional issue sync', 'Sprint auto-planning', 'Story point estimation', 'Burndown chart data'], health: 'HEALTHY', last_sync: new Date(Date.now() - 600000).toISOString() },
        { id: 'INT-003', name: 'Slack', icon: '💬', category: 'Communication', status: 'CONNECTED', description: 'Team notifications, alerts, and bot commands', connected_at: new Date(Date.now() - 86400000*20).toISOString(), config: { workspace: 'nexus-team', channels: ['#deployments','#alerts','#code-review','#general'], messages_sent: 892 }, features: ['Deployment notifications', 'Escalation alerts', 'Build failure alerts', 'Slash commands (/nexus deploy)'], health: 'HEALTHY', last_sync: new Date(Date.now() - 60000).toISOString() },
        { id: 'INT-004', name: 'Confluence', icon: '📖', category: 'Developer Tools', status: 'CONNECTED', description: 'Documentation, architecture decisions, and knowledge base', connected_at: new Date(Date.now() - 86400000*15).toISOString(), config: { space: 'NEXUS', pages_synced: 45 }, features: ['Auto-publish decision records', 'Architecture doc generation', 'Release notes publishing', 'Meeting notes sync'], health: 'HEALTHY', last_sync: new Date(Date.now() - 1800000).toISOString() },
        { id: 'INT-005', name: 'Microsoft Teams', icon: '🟦', category: 'Communication', status: 'DISCONNECTED', description: 'Enterprise communication and collaboration', connected_at: null, config: {}, features: ['Channel notifications', 'Approval workflows via adaptive cards', 'Meeting scheduling', 'Bot interactions'], health: 'N/A', last_sync: null },
        { id: 'INT-006', name: 'AWS', icon: '☁️', category: 'Cloud & Infrastructure', status: 'CONNECTED', description: 'Cloud infrastructure, deployment, and monitoring', connected_at: new Date(Date.now() - 86400000*40).toISOString(), config: { region: 'us-east-1', services: ['ECS','RDS','S3','CloudWatch','IAM'], account: '****1234' }, features: ['Auto-deployment to ECS', 'RDS provisioning', 'CloudWatch metrics', 'Cost monitoring'], health: 'HEALTHY', last_sync: new Date(Date.now() - 120000).toISOString() },
        { id: 'INT-007', name: 'Datadog', icon: '🐕', category: 'Monitoring', status: 'CONNECTED', description: 'APM, infrastructure monitoring, and log management', connected_at: new Date(Date.now() - 86400000*10).toISOString(), config: { dashboards: 8, monitors: 24, api_key: '****abcd' }, features: ['APM traces integration', 'Custom metrics from agents', 'Alert forwarding to incidents', 'SLO tracking'], health: 'HEALTHY', last_sync: new Date(Date.now() - 30000).toISOString() },
        { id: 'INT-008', name: 'SonarQube', icon: '🔍', category: 'Developer Tools', status: 'CONNECTED', description: 'Code quality, security analysis, and technical debt tracking', connected_at: new Date(Date.now() - 86400000*8).toISOString(), config: { projects: 3, quality_gate: 'Nexus Standard', issues_open: 12 }, features: ['Quality gate checks in CI/CD', 'Security hotspot detection', 'Code smell analysis', 'Coverage tracking'], health: 'DEGRADED', last_sync: new Date(Date.now() - 7200000).toISOString() },
        { id: 'INT-009', name: 'ServiceNow', icon: '🎫', category: 'Enterprise', status: 'DISCONNECTED', description: 'IT service management and incident tracking', connected_at: null, config: {}, features: ['Incident auto-creation', 'Change request workflows', 'CMDB sync', 'SLA monitoring'], health: 'N/A', last_sync: null },
        { id: 'INT-010', name: 'PagerDuty', icon: '📟', category: 'Monitoring', status: 'CONNECTED', description: 'On-call management and incident response', connected_at: new Date(Date.now() - 86400000*5).toISOString(), config: { services: 4, on_call_teams: 2, incidents_managed: 12 }, features: ['Auto-escalation to on-call', 'Incident acknowledgment sync', 'Schedule management', 'Postmortem integration'], health: 'HEALTHY', last_sync: new Date(Date.now() - 180000).toISOString() },
        { id: 'INT-011', name: 'Vault (HashiCorp)', icon: '🔐', category: 'Security', status: 'CONNECTED', description: 'Secrets management and encryption', connected_at: new Date(Date.now() - 86400000*35).toISOString(), config: { secrets_managed: 45, engines: ['kv','transit','pki'] }, features: ['Dynamic secrets rotation', 'Encryption as a service', 'PKI certificate management', 'Audit logging'], health: 'HEALTHY', last_sync: new Date(Date.now() - 60000).toISOString() },
        { id: 'INT-012', name: 'Salesforce', icon: '☁️', category: 'Enterprise', status: 'DISCONNECTED', description: 'CRM integration for customer data and analytics', connected_at: null, config: {}, features: ['Customer data sync', 'Support ticket integration', 'Usage analytics', 'License management'], health: 'N/A', last_sync: null },
        { id: 'INT-013', name: 'CI/CD', icon: '🚀', category: 'DevOps', status: 'DISCONNECTED', description: 'Build pipelines, deployment tracking, and rollback alerts', connected_at: null, config: {}, features: ['Build status sync', 'Deployment tracking', 'Rollback alerts', 'Environment promotion checks'], health: 'N/A', last_sync: null }
    ];

    function seedIntegrations() {
      if (NexusStore.getIntegrations().length > 0) return;
      NexusStore.setIntegrations(baselineIntegrations);
    }

    function ensureBaselineIntegrations() {
      const integrations = NexusStore.getIntegrations();
      let changed = false;
      baselineIntegrations.forEach(base => {
        if (!integrations.some(i => i.id === base.id || i.name === base.name)) {
          integrations.push(base);
          changed = true;
        }
      });
      if (changed) NexusStore.setIntegrations(integrations);
    }

    seedIntegrations();
    ensureBaselineIntegrations();

    function render() {
      const integrations = NexusStore.getIntegrations();
      const connected = integrations.filter(i => i.status === 'CONNECTED').length;
      const healthy = integrations.filter(i => i.health === 'HEALTHY').length;
      const degraded = integrations.filter(i => i.health === 'DEGRADED').length;

      document.getElementById('integrationStats').innerHTML = `
        <div class="card stat-card"><div class="stat-value">${integrations.length}</div><div class="stat-label">Total Integrations</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:#10b981">${connected}</div><div class="stat-label">Connected</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:#10b981">${healthy}</div><div class="stat-label">Healthy</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:${degraded > 0 ? '#f59e0b' : '#10b981'}">${degraded}</div><div class="stat-label">Degraded</div></div>
      `;

      // Group by category
      const categories = {};
      integrations.forEach(i => { (categories[i.category] = categories[i.category] || []).push(i); });

      document.getElementById('integrationGrid').innerHTML = Object.entries(categories).map(([cat, items]) => `
        <div style="margin-bottom:24px;">
          <h3 style="font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">${cat}</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;">
            ${items.map(i => {
              const statusColor = i.status === 'CONNECTED' ? '#10b981' : '#6b7280';
              const healthColor = { HEALTHY: '#10b981', DEGRADED: '#f59e0b', DOWN: '#ef4444', 'N/A': '#6b7280' }[i.health];
              return `
              <div class="card integration-card" onclick="openIntegDetail('${i.id}')" tabindex="0" onkeydown="handleCardKey(event, '${i.id}')">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                  <span style="font-size:28px;">${i.icon}</span>
                  <div style="flex:1;">
                    <div style="font-weight:700;font-size:15px;">${i.name}</div>
                    <div style="font-size:11px;color:var(--text-muted);">${i.description}</div>
                  </div>
                  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                    <span style="width:8px;height:8px;border-radius:50%;background:${statusColor};${i.status==='CONNECTED'?'':''}"></span>
                    <span style="font-size:10px;color:${statusColor}">${i.status}</span>
                  </div>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${i.features.slice(0,2).map(f => `<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg-tertiary);color:var(--text-muted);">${f}</span>`).join('')}
                  ${i.features.length > 2 ? `<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg-tertiary);color:var(--text-muted);">+${i.features.length-2} more</span>` : ''}
                </div>
                ${renderIntegrationSummary(i)}
                ${i.last_sync ? `<div style="font-size:10px;color:var(--text-muted);margin-top:8px;">Last sync: ${formatTime(i.last_sync)}</div>` : ''}
                <div class="integration-card-footer">
                  <button type="button" class="btn btn-primary btn-sm integration-add-btn" onclick="openIntegrationSetup(event, '${i.id}')" aria-label="Add ${i.name} integration">
                    <span>Add Integration</span><span class="arrow-icon" aria-hidden="true">→</span>
                  </button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function openIntegDetail(integId) {
      const integrations = NexusStore.getIntegrations();
      const integ = integrations.find(i => i.id === integId);
      if (!integ) return;

      document.getElementById('integDetailTitle').textContent = `${integ.icon} ${integ.name}`;

      const statusColor = integ.status === 'CONNECTED' ? '#10b981' : '#6b7280';
      const healthColor = { HEALTHY: '#10b981', DEGRADED: '#f59e0b', DOWN: '#ef4444', 'N/A': '#6b7280' }[integ.health];

      document.getElementById('integDetailBody').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div>
            <div style="font-size:13px;color:var(--text-muted);">${integ.description}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Category: ${integ.category}</div>
          </div>
          <div style="text-align:right;">
            ${statusBadge(integ.status)}
            <div style="display:flex;align-items:center;gap:4px;margin-top:4px;justify-content:flex-end;">
              <span style="width:6px;height:6px;border-radius:50%;background:${healthColor}"></span>
              <span style="font-size:11px;color:${healthColor}">${integ.health}</span>
            </div>
          </div>
        </div>

        ${integ.connected_at ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Connected since: ${formatTime(integ.connected_at)}</div>` : ''}

        <!-- Config -->
        ${Object.keys(integ.config).length > 0 ? `
        <div style="background:var(--bg-secondary);border-radius:8px;padding:12px;margin-bottom:16px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Configuration</div>
          ${Object.entries(integ.config).filter(([key]) => !isSecretKey(key)).map(([key, val]) => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);font-size:12px;">
              <span style="color:var(--text-muted);">${esc(key.replace(/_/g,' '))}</span>
              <span style="font-weight:600;font-family:var(--mono);">${esc(Array.isArray(val) ? val.join(', ') : val)}</span>
            </div>
          `).join('')}
        </div>
        ` : ''}

        <!-- Features -->
        <div style="margin-bottom:16px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Features</div>
          ${integ.features.map(f => `
            <div style="display:flex;align-items:center;gap:8px;padding:4px 0;">
              <span style="color:${integ.status === 'CONNECTED' ? '#10b981' : '#6b7280'}">${integ.status === 'CONNECTED' ? '✅' : '⬜'}</span>
              <span style="font-size:13px;">${f}</span>
            </div>
          `).join('')}
        </div>

        ${integ.status === 'CONNECTED' ? `
        <!-- Webhook Test -->
        <div style="background:var(--bg-secondary);border-radius:8px;padding:12px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Quick Actions</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-sm btn-outline" onclick="testWebhook('${integ.id}')">🔔 Test Webhook</button>
            <button class="btn btn-sm btn-outline" onclick="syncIntegration('${integ.id}')">🔄 Force Sync</button>
            <button class="btn btn-sm btn-outline" onclick="viewLogs('${integ.id}')">📋 View Logs</button>
          </div>
        </div>
        ` : ''}
      `;

      document.getElementById('integDetailFooter').innerHTML = `
        <div style="display:flex;gap:8px;width:100%;justify-content:flex-end;">
          ${integ.status === 'DISCONNECTED' ? `
            <button class="btn btn-primary" onclick="openIntegrationSetup(null, '${integ.id}')">Add Integration <span aria-hidden="true">→</span></button>
          ` : `
            <button class="btn btn-outline" onclick="disconnectIntegration('${integ.id}')">Disconnect</button>
            <button class="btn btn-primary" onclick="syncIntegration('${integ.id}')">🔄 Sync Now</button>
          `}
        </div>
      `;

      showModal('integDetailModal');
    }

    function showModal(id) {
      const modal = document.getElementById(id);
      modal.style.display = 'flex';
      requestAnimationFrame(() => modal.classList.add('show'));
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('show');
      setTimeout(() => { modal.style.display = 'none'; }, 160);
    }

    function handleCardKey(event, integId) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openIntegDetail(integId);
      }
    }

    function openIntegrationSetup(event, integId) {
      if (event) event.stopPropagation();
      const integration = NexusStore.getIntegrations().find(i => i.id === integId);
      if (!integration) return;
      const schema = getIntegrationSchema(integration);
      document.getElementById('integSetupTitle').textContent = `Add ${integration.name} Integration`;
      document.getElementById('integSetupBody').innerHTML = `
        <p class="setup-description">${schema.description}</p>
        <form id="integrationSetupForm" class="integration-form-grid" novalidate>
          ${schema.fields.map(field => renderSetupField(field, integration)).join('')}
        </form>
      `;
      document.getElementById('integSetupFooter').innerHTML = `
        <button class="btn btn-outline" type="button" onclick="closeModal('integSetupModal')">Cancel</button>
        <button class="btn btn-primary" type="button" onclick="saveIntegrationSetup('${integration.id}')">Save / Connect</button>
      `;
      closeModal('integDetailModal');
      showModal('integSetupModal');
      const firstInput = document.querySelector('#integrationSetupForm input:not([readonly]), #integrationSetupForm select');
      if (firstInput) setTimeout(() => firstInput.focus(), 180);
    }

    function renderSetupField(field, integration) {
      const config = integration.config || {};
      const rawDefault = typeof field.defaultValue === 'function' ? field.defaultValue(integration) : field.defaultValue;
      const storedValue = config[field.key] ?? rawDefault ?? '';
      const value = field.type === 'password' ? '' : storedValue;
      const required = field.required ? 'required' : '';
      const readonly = field.readonly ? 'readonly' : '';
      const common = `id="setup_${field.key}" name="${field.key}" ${required} ${readonly}`;
      const label = `${field.label}${field.required ? ' *' : ''}`;
      if (field.type === 'toggle') {
        return `
          <div class="toggle-row ${field.full ? 'full' : ''}" style="margin-bottom:0;">
            <div>
              <div class="toggle-row-label">${field.label}</div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" ${common} ${value ? 'checked' : ''}>
              <span class="toggle-slider"></span>
            </label>
          </div>
        `;
      }
      if (field.type === 'select') {
        return `
          <div class="form-group ${field.full ? 'full' : ''}">
            <label class="form-label" for="setup_${field.key}">${label}</label>
            <select class="form-select" ${common}>
              ${(field.options || []).map(option => `<option value="${esc(option)}" ${option === value ? 'selected' : ''}>${esc(option)}</option>`).join('')}
            </select>
            <div class="field-error" id="error_${field.key}"></div>
          </div>
        `;
      }
      return `
        <div class="form-group ${field.full ? 'full' : ''}">
          <label class="form-label" for="setup_${field.key}">${label}</label>
          <input class="form-input" type="${field.type || 'text'}" ${common} value="${esc(value)}" placeholder="${esc(field.type === 'password' && storedValue ? 'Stored securely - enter to replace' : field.placeholder || '')}">
          <div class="field-error" id="error_${field.key}"></div>
        </div>
      `;
    }

    function saveIntegrationSetup(integId) {
      const integrations = NexusStore.getIntegrations();
      const integ = integrations.find(i => i.id === integId);
      if (!integ) return;
      const schema = getIntegrationSchema(integ);
      const form = document.getElementById('integrationSetupForm');
      let valid = true;
      const nextConfig = { ...(integ.config || {}) };

      schema.fields.forEach(field => {
        const input = form.querySelector(`[name="${field.key}"]`);
        const error = document.getElementById(`error_${field.key}`);
        if (error) error.textContent = '';
        const value = field.type === 'toggle' ? input.checked : input.value.trim();
        const hasStoredSecret = field.type === 'password' && Boolean(nextConfig[field.key]);
        if (field.required && !value && !hasStoredSecret) {
          valid = false;
          if (error) error.textContent = `${field.label} is required.`;
          input.setAttribute('aria-invalid', 'true');
        } else {
          input.removeAttribute('aria-invalid');
        }
        if (field.type !== 'password' || value) nextConfig[field.key] = value;
      });

      if (!valid) {
        showToast('Please complete the required fields', 'warning');
        return;
      }

      const now = new Date().toISOString();
      integ.status = 'CONNECTED';
      integ.health = 'HEALTHY';
      integ.connected_at = integ.connected_at || now;
      integ.last_sync = now;
      integ.config = nextConfig;
      NexusStore.setIntegrations(integrations);
      NexusEventBus.notify('integration', 'Integration Connected', `${integ.name} successfully connected`, {});
      closeModal('integSetupModal');
      render();
      showToast(`${integ.name} integration saved`, 'success');
    }

    function getIntegrationSchema(integration) {
      const normalized = integration.name.toLowerCase();
      if (normalized.includes('github')) return integrationSchemas.github;
      if (normalized.includes('jira')) return integrationSchemas.jira;
      if (normalized.includes('confluence')) return integrationSchemas.confluence;
      if (normalized.includes('sonarqube')) return integrationSchemas.sonarqube;
      if (normalized.includes('slack')) return integrationSchemas.slack;
      if (normalized.includes('microsoft teams')) return integrationSchemas.teams;
      if (normalized.includes('ci/cd') || normalized.includes('cicd')) return integrationSchemas.cicd;
      if (integration.category === 'Cloud & Infrastructure') return integrationSchemas.cloud;
      if (integration.category === 'Enterprise') return integrationSchemas.enterprise;
      return integrationSchemas.generic;
    }

    function renderIntegrationSummary(integration) {
      const schema = getIntegrationSchema(integration);
      const rows = (schema.summary || [])
        .map(item => {
          const raw = integration.config?.[item.key];
          const value = item.formatter ? item.formatter(raw) : raw;
          if (!value || isSecretKey(item.key)) return '';
          return `<div class="integration-summary-row"><span>${item.label}</span><strong title="${esc(value)}">${esc(value)}</strong></div>`;
        })
        .filter(Boolean);
      return rows.length ? `<div class="integration-summary">${rows.join('')}</div>` : '';
    }

    function isSecretKey(key) {
      return secretFieldNames.some(secret => key.toLowerCase().includes(secret.toLowerCase()));
    }

    function repoName(value) {
      if (!value) return '';
      return value.replace(/\/$/, '').split('/').slice(-2).join('/');
    }

    function esc(value) {
      if (value === null || value === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function connectIntegration(integId) {
      openIntegrationSetup(null, integId);
    }

    function disconnectIntegration(integId) {
      if (!confirm('Disconnect this integration? Webhooks and syncs will stop.')) return;
      const integrations = NexusStore.getIntegrations();
      const integ = integrations.find(i => i.id === integId);
      if (integ) {
        integ.status = 'DISCONNECTED';
        integ.health = 'N/A';
        NexusStore.setIntegrations(integrations);
      }
      closeModal('integDetailModal');
      render();
      showToast(`${integ?.name} disconnected`, 'warning');
    }

    function syncIntegration(integId) {
      showLoading('Syncing...');
      setTimeout(() => {
        const integrations = NexusStore.getIntegrations();
        const integ = integrations.find(i => i.id === integId);
        if (integ) { integ.last_sync = new Date().toISOString(); integ.health = 'HEALTHY'; NexusStore.setIntegrations(integrations); }
        hideLoading();
        render();
        showToast(`${integ?.name} synced`, 'success');
      }, 1500);
    }

    function testWebhook(integId) {
      showToast('Webhook test sent — check target system', 'info');
    }

    function viewLogs(integId) {
      showToast('Integration logs available in Observability module', 'info');
    }

    render();
  </script>
  <script src="../js/theme.js"></script>
</body>
</html>
