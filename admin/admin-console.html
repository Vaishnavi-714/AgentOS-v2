<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Admin Console</title>
  <link rel="stylesheet" href="../css/common.css">

  <link rel="stylesheet" href="../css/theme.css">
  <style>
    /* ===== ADMIN CONSOLE LAYOUT ===== */
    body { display: block; background: var(--bg-primary); }
    .ac-wrap { display: flex; min-height: 100vh; }

    /* --- Sidebar --- */
    .ac-sidebar {
      width: 260px; min-height: 100vh; background: var(--bg-secondary);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 200; overflow-y: auto;
      transition: transform 0.3s;
    }
    .ac-sidebar-brand {
      padding: 24px 20px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .ac-sidebar-brand-icon { font-size: 28px; }
    .ac-sidebar-brand-text { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
    .ac-sidebar-brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .ac-sidebar-section {
      padding: 16px 14px 4px; font-size: 10px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px;
    }
    .ac-sidebar-nav { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .ac-nav-item {
      display: flex; align-items: center; gap: 11px; padding: 10px 14px;
      border-radius: var(--radius); cursor: pointer; font-size: 13px;
      font-weight: 500; color: var(--text-secondary); transition: all 0.2s;
      text-decoration: none; position: relative; user-select: none;
    }
    .ac-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .ac-nav-item.active { background: var(--accent-bg); color: var(--accent); border-left: 3px solid var(--accent); }
    .ac-nav-item .nav-icon { font-size: 16px; width: 22px; text-align: center; }
    .ac-nav-badge {
      margin-left: auto; background: var(--danger); color: #fff; font-size: 10px;
      font-weight: 700; padding: 2px 7px; border-radius: 10px; min-width: 18px; text-align: center;
    }
    .ac-sidebar-footer {
      padding: 16px; border-top: 1px solid var(--border);
    }
    .ac-sidebar-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ac-sidebar-user-avatar { font-size: 28px; }
    .ac-sidebar-user-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .ac-sidebar-user-role { font-size: 11px; color: var(--text-muted); }
    .ac-sidebar-logout {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius);
      background: transparent; color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .ac-sidebar-logout:hover { background: var(--danger); color: white; border-color: var(--danger); }

    /* --- Topbar --- */
    .ac-main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .ac-topbar {
      height: 60px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky;
      top: 0; z-index: 100;
    }
    .ac-topbar-title { font-size: 16px; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .ac-topbar-search {
      flex: 1; max-width: 420px; position: relative; margin-left: 24px;
    }
    .ac-topbar-search input {
      width: 100%; padding: 8px 14px 8px 36px; border: 1px solid var(--border);
      border-radius: 20px; background: var(--bg-tertiary); color: var(--text-primary);
      font-size: 13px; font-family: var(--font); transition: border-color 0.2s;
    }
    .ac-topbar-search input:focus { outline: none; border-color: var(--accent); }
    .ac-topbar-search::before {
      content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 13px; pointer-events: none;
    }
    .ac-topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .ac-topbar-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: all 0.2s; position: relative;
    }
    .ac-topbar-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .ac-topbar-btn .notif-dot {
      position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
      background: var(--danger); border-radius: 50%; border: 2px solid var(--bg-secondary);
    }
    .ac-topbar-profile {
      display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px;
      border-radius: 20px; border: 1px solid var(--border); background: var(--bg-tertiary);
      cursor: pointer; transition: all 0.2s;
    }
    .ac-topbar-profile:hover { border-color: var(--accent); }
    .ac-topbar-profile-avatar { font-size: 22px; }
    .ac-topbar-profile-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }

    /* --- Content Area --- */
    .ac-content { flex: 1; padding: 28px 32px; overflow-y: auto; }
    .ac-content > div { display: none; }
    .ac-content > div.active { display: block; animation: acFadeIn 0.3s ease; }
    @keyframes acFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* --- KPI Cards --- */
    .ac-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .ac-kpi {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 22px 20px; position: relative; overflow: hidden; transition: border-color 0.2s, transform 0.2s;
    }
    .ac-kpi:hover { border-color: var(--border-light); transform: translateY(-2px); }
    .ac-kpi-icon { font-size: 28px; margin-bottom: 8px; }
    .ac-kpi-value { font-size: 32px; font-weight: 800; color: var(--text-primary); line-height: 1; }
    .ac-kpi-label { font-size: 12px; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .ac-kpi-change { font-size: 11px; font-weight: 600; margin-top: 8px; }
    .ac-kpi-change.up { color: var(--success); }
    .ac-kpi-change.down { color: var(--danger); }
    .ac-kpi-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: var(--border);
    }
    .ac-kpi-bar-fill { height: 100%; border-radius: 0 0 0 var(--radius-lg); transition: width 1s ease; }

    /* --- Section Headers --- */
    .ac-section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .ac-section-title { font-size: 20px; font-weight: 700; color: var(--text-primary); }
    .ac-section-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* --- Toolbar --- */
    .ac-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 16px;
    }
    .ac-toolbar .form-input, .ac-toolbar .form-select {
      max-width: 200px; padding: 8px 12px; font-size: 12px;
    }
    .ac-toolbar-search {
      flex: 1; min-width: 180px; max-width: 300px; position: relative;
    }
    .ac-toolbar-search input {
      width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-primary);
      font-size: 12px; font-family: var(--font);
    }
    .ac-toolbar-search input:focus { outline: none; border-color: var(--accent); }
    .ac-toolbar-search::before {
      content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 11px; pointer-events: none;
    }
    .ac-toolbar-spacer { flex: 1; }

    /* --- Detail View --- */
    .ac-detail-split { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    .ac-detail-back {
      display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted);
      font-size: 13px; cursor: pointer; margin-bottom: 16px; transition: color 0.2s;
      text-decoration: none;
    }
    .ac-detail-back:hover { color: var(--accent); }
    .ac-detail-sidebar .card { position: sticky; top: 88px; }
    .ac-detail-metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .ac-detail-metric:last-child { border-bottom: none; }
    .ac-detail-metric-label { font-size: 12px; color: var(--text-muted); }
    .ac-detail-metric-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

    /* --- Activity Log --- */
    .ac-activity-item {
      display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .ac-activity-item:last-child { border-bottom: none; }
    .ac-activity-dot {
      width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
    }
    .ac-activity-text { font-size: 13px; color: var(--text-secondary); }
    .ac-activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* --- System Health Bar --- */
    .ac-health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .ac-health-item {
      padding: 16px; background: var(--bg-tertiary); border: 1px solid var(--border);
      border-radius: var(--radius); text-align: center;
    }
    .ac-health-value { font-size: 24px; font-weight: 700; }
    .ac-health-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }

    /* --- Create Form --- */
    .ac-form-section { margin-bottom: 24px; }
    .ac-form-section-title {
      font-size: 14px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .ac-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* --- Responsive --- */
    @media (max-width: 1200px) {
      .ac-kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .ac-detail-split { grid-template-columns: 1fr; }
      .ac-health-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .ac-sidebar { transform: translateX(-100%); }
      .ac-sidebar.open { transform: translateX(0); }
      .ac-main { margin-left: 0; }
      .ac-kpi-grid { grid-template-columns: 1fr; }
      .ac-form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="ac-wrap">
    <!-- ===== SIDEBAR ===== -->
    <aside class="ac-sidebar" id="acSidebar">
      <div class="ac-sidebar-brand">
        <div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="ac-sidebar-brand-icon">🧠</span>
            <span class="ac-sidebar-brand-text">NEXUS</span>
          </div>
          <div class="ac-sidebar-brand-sub">Admin Console</div>
        </div>
      </div>
      <nav class="ac-sidebar-nav" id="acSidebarNav"></nav>
      <div class="ac-sidebar-footer">
        <div class="ac-sidebar-user">
          <span class="ac-sidebar-user-avatar">🛡️</span>
          <div>
            <div class="ac-sidebar-user-name" id="acUserName">System Admin</div>
            <div class="ac-sidebar-user-role">SYSTEM_ADMIN</div>
          </div>
        </div>
        <button class="ac-sidebar-logout" onclick="acLogout()">Sign Out</button>
      </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="ac-main">
      <!-- Topbar -->
      <header class="ac-topbar">
        <button class="ac-topbar-btn" onclick="document.getElementById('acSidebar').classList.toggle('open')" style="display:none" id="acMenuBtn">☰</button>
        <span class="ac-topbar-title" id="acTopbarTitle">Dashboard</span>
        <div class="ac-topbar-search">
          <input type="text" placeholder="Search tenants, users, settings..." id="acGlobalSearch" oninput="acFilterGlobal(this.value)">
        </div>
        <div class="ac-topbar-actions">
          <div class="ac-topbar-btn" onclick="acToggleNotifPanel()" title="Notifications">
            🔔<span class="notif-dot" id="acNotifDot"></span>
          </div>
          <div class="ac-topbar-btn" onclick="window.location.href='../workspace/dashboard.html'" title="Back to Workspace">
            🖥️
          </div>
          <div class="ac-topbar-profile" onclick="acNav('settings')">
            <span class="ac-topbar-profile-avatar">🛡️</span>
            <span class="ac-topbar-profile-name" id="acTopbarUser">Admin</span>
          </div>
        </div>
      </header>

      <!-- Content Panels -->
      <div class="ac-content" id="acContent">
        <div id="ac-dashboard"></div>
        <div id="ac-tenants"></div>
        <div id="ac-tenant-detail"></div>
        <div id="ac-create-tenant"></div>
        <div id="ac-users"></div>
        <div id="ac-roles"></div>
        <div id="ac-billing"></div>
        <div id="ac-audit"></div>
        <div id="ac-settings"></div>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/state.js"></script>
  <script>
    // ========== AUTH GUARD ==========
    const role = localStorage.getItem("role");
    if (role !== "admin") {
      window.location.href = '../index.html';
    }
    seedNexusData();

    const user = NexusStore.getUser();
    if (user) {
      document.getElementById('acUserName').textContent = user.name || 'System Admin';
      document.getElementById('acTopbarUser').textContent = user.name || 'Admin';
    }

    // ========== NAVIGATION ==========
    const AC_NAV = [
      { section: 'Overview' },
      { id: 'dashboard', label: 'Dashboard', icon: '📊' },
      { section: 'Management' },
      { id: 'tenants', label: 'Tenants', icon: '🏢' },
      { id: 'users', label: 'Users', icon: '👥' },
      { id: 'roles', label: 'Roles & Permissions', icon: '🔐' },
      { id: 'billing', label: 'Billing & Plans', icon: '💳' },
      { section: 'Operations' },
      { id: 'audit', label: 'Audit Logs', icon: '📋' },
      { id: 'settings', label: 'Settings', icon: '⚙️' },
    ];

    function buildSidebar() {
      const active = getCurrentView();
      document.getElementById('acSidebarNav').innerHTML = AC_NAV.map(item => {
        if (item.section) return `<div class="ac-sidebar-section">${item.section}</div>`;
        const isActive = active === item.id || (active === 'tenant-detail' && item.id === 'tenants') || (active === 'create-tenant' && item.id === 'tenants');
        return `<a class="ac-nav-item ${isActive ? 'active' : ''}" onclick="acNav('${item.id}')">
          <span class="nav-icon">${item.icon}</span> ${item.label}
        </a>`;
      }).join('');
    }

    function getCurrentView() {
      return (location.hash.replace('#', '') || 'dashboard');
    }

    function acNav(view) {
      location.hash = view;
    }

    function acLogout() {
      NexusStore.addLog({ type: 'AUTH', message: 'System Admin logged out', agent: 'system' });
      NexusStore.logout();
      TenantState.logoutSession();
      localStorage.removeItem("role");
      window.location.href = '../index.html';
    }

    function acFilterGlobal(q) {
      // Simple: if on tenants page, filter that table
      if (getCurrentView() === 'tenants') renderTenants(q);
    }

    function acToggleNotifPanel() {
      showToast('No new notifications', 'info');
    }

    // ========== ROUTER ==========
    function route() {
      const view = getCurrentView();
      document.querySelectorAll('.ac-content > div').forEach(d => d.classList.remove('active'));
      const panel = document.getElementById('ac-' + view);
      if (panel) panel.classList.add('active');
      else { document.getElementById('ac-dashboard').classList.add('active'); }

      const titles = { dashboard: 'Dashboard', tenants: 'Tenant Management', 'tenant-detail': 'Tenant Details', 'create-tenant': 'Create Tenant', users: 'User Management', roles: 'Roles & Permissions', billing: 'Billing & Plans', audit: 'Audit Logs', settings: 'Platform Settings' };
      document.getElementById('acTopbarTitle').textContent = titles[view] || 'Dashboard';

      buildSidebar();
      renderView(view);
    }

    function renderView(view) {
      switch (view) {
        case 'dashboard': renderDashboard(); break;
        case 'tenants': renderTenants(); break;
        case 'tenant-detail': renderTenantDetail(); break;
        case 'create-tenant': renderCreateTenant(); break;
        case 'users': renderUsers(); break;
        case 'roles': renderRoles(); break;
        case 'billing': renderBilling(); break;
        case 'audit': renderAudit(); break;
        case 'settings': renderSettings(); break;
        default: renderDashboard();
      }
    }

    window.addEventListener('hashchange', route);

    // ========== HELPERS ==========
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtDate(ts) { if (!ts) return '—'; return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
    function fmtTime(ts) { if (!ts) return '—'; const d = new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }
    function statusColor(s) {
      const m = { ACTIVE: '#10b981', SUSPENDED: '#ef4444', REGISTERED: '#f59e0b', PROVISIONING: '#3b82f6', INACTIVE: '#6b7280' };
      return m[s] || '#6b7280';
    }
    function badge(text, color) {
      return `<span class="status-badge" style="background:${color}20;color:${color};border:1px solid ${color}40">${text}</span>`;
    }
    function planBadge(plan) {
      const l = TenantState.getSubscriptionLimits(plan);
      return `<span class="status-badge" style="background:${l.color}20;color:${l.color};border:1px solid ${l.color}40">${l.icon} ${l.label}</span>`;
    }
    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    function pctBar(pct, color) {
      const lvl = pct >= 90 ? 'var(--danger)' : pct >= 70 ? 'var(--warning)' : (color || 'var(--accent)');
      return `<div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px">
        <div style="width:${Math.min(pct,100)}%;height:100%;background:${lvl};border-radius:3px;transition:width 0.8s ease"></div>
      </div>`;
    }

    // ========== SIMULATED REAL-TIME DATA ==========
    function simVal(base, variance) { return base + Math.floor(Math.random() * variance * 2 - variance); }
    function simActivity() {
      const actions = [
        { text: 'Tenant TNT-001 API usage spike detected', color: 'var(--warning)' },
        { text: 'New user registered in TCS workspace', color: 'var(--info)' },
        { text: 'Backup completed for all tenants', color: 'var(--success)' },
        { text: 'Subscription upgrade request from Wipro', color: 'var(--purple)' },
        { text: 'Security scan completed — no issues', color: 'var(--success)' },
        { text: 'Rate limit triggered for TNT-002', color: 'var(--danger)' },
        { text: 'System health check passed', color: 'var(--success)' },
        { text: 'New deployment pipeline activated', color: 'var(--info)' },
      ];
      return actions.sort(() => Math.random() - 0.5).slice(0, 5).map((a, i) => ({
        ...a, time: new Date(Date.now() - i * 300000 - Math.random() * 600000).toISOString()
      }));
    }

    // ========== DASHBOARD ==========
    function renderDashboard() {
      const tenants = TenantState.getTenants();
      const allUsers = TenantState.getAllTenantUsers();
      const totalUsers = Object.values(allUsers).reduce((s, arr) => s + arr.length, 0);
      const activeTenants = tenants.filter(t => t.status === 'ACTIVE').length;
      const totalAgents = tenants.reduce((s, t) => s + (t.agents || 0), 0);
      const totalApi = tenants.reduce((s, t) => s + (t.api_usage || 0), 0);
      const totalStorage = tenants.reduce((s, t) => s + (t.storage_used || 0), 0);
      const revenue = tenants.reduce((s, t) => {
        const prices = { PREMIUM: 299, STANDARD: 99, BASIC: 29 };
        return s + (prices[t.subscription] || 0);
      }, 0);

      const activities = simActivity();
      const uptime = (99 + Math.random() * 0.99).toFixed(2);
      const latency = simVal(45, 15);
      const errorRate = (Math.random() * 0.5).toFixed(2);

      document.getElementById('ac-dashboard').innerHTML = `
        <div class="ac-section-header">
          <div>
            <div class="ac-section-title">Platform Overview</div>
            <div class="ac-section-sub">Real-time system metrics and tenant analytics</div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline btn-sm" onclick="renderDashboard()">↻ Refresh</button>
            <a href="dashboard.html" class="btn btn-outline btn-sm">🖥️ Workspace</a>
          </div>
        </div>

        <div class="ac-kpi-grid">
          <div class="ac-kpi">
            <div class="ac-kpi-icon">🏢</div>
            <div class="ac-kpi-value">${tenants.length}</div>
            <div class="ac-kpi-label">Total Tenants</div>
            <div class="ac-kpi-change up">↑ ${activeTenants} active</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:${(activeTenants/Math.max(tenants.length,1))*100}%;background:var(--success)"></div></div>
          </div>
          <div class="ac-kpi">
            <div class="ac-kpi-icon">👥</div>
            <div class="ac-kpi-value">${totalUsers}</div>
            <div class="ac-kpi-label">Total Users</div>
            <div class="ac-kpi-change up">↑ across ${tenants.length} tenants</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:65%;background:var(--info)"></div></div>
          </div>
          <div class="ac-kpi">
            <div class="ac-kpi-icon">🤖</div>
            <div class="ac-kpi-value">${totalAgents}</div>
            <div class="ac-kpi-label">Active Agents</div>
            <div class="ac-kpi-change up">↑ all tenants combined</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:55%;background:var(--purple)"></div></div>
          </div>
          <div class="ac-kpi">
            <div class="ac-kpi-icon">💰</div>

    function acSubmitCreateTenant() {
      const name = document.getElementById('ctName').value.trim();
      const domain = document.getElementById('ctDomain').value.trim();
      if (!name || !domain) { showToast('Name and domain are required', 'error'); return; }
      if (TenantState.getTenants().some(t => t.domain === domain)) { showToast('Domain already registered', 'error'); return; }

      const tenant = {
        tenant_id: TenantState.generateTenantId(),
        name, domain,
        status: document.getElementById('ctStatus').value,
        subscription: document.getElementById('ctPlan').value,
        users: 1, projects: 0, agents: 0, storage_used: 0, api_usage: 0, escalations: 0,
        region: document.getElementById('ctRegion').value,
        created_at: new Date().toISOString(),
        admin_name: document.getElementById('ctAdminName').value.trim(),
        admin_email: document.getElementById('ctAdminEmail').value.trim(),
        tenant_type: document.getElementById('ctType').value
      };
      TenantState.addTenant(tenant);
      // Add admin user
      if (tenant.admin_name && tenant.admin_email) {
        TenantState.addTenantUser(tenant.tenant_id, {
          id: TenantState.generateUserId(), name: tenant.admin_name,
          email: tenant.admin_email, role: 'Admin', status: 'ACTIVE',
          last_login: new Date().toISOString()
        });
      }
      NexusStore.addLog({ type: 'SYSTEM', message: `Tenant ${tenant.name} (${tenant.tenant_id}) created`, agent: 'system' });
      showToast(`Tenant "${name}" created successfully`, 'success');
      acNav('tenants');
    }

            <div class="ac-section-title">Users</div>
            <div class="ac-section-sub">All users across all tenants</div>
          </div>
        </div>

        <div class="ac-toolbar">
          <div class="ac-toolbar-search">
            <input type="text" placeholder="Search users..." value="${esc(_userSearch)}" oninput="_userSearch=this.value;renderUsers()">
          </div>
          <select class="form-select" onchange="_userTenantFilter=this.value;renderUsers()" style="max-width:160px;padding:8px 12px;font-size:12px">
            <option value="">All Tenants</option>
            ${tenants.map(t => `<option value="${t.tenant_id}" ${_userTenantFilter===t.tenant_id?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
          <select class="form-select" onchange="_userRoleFilter=this.value;renderUsers()" style="max-width:140px;padding:8px 12px;font-size:12px">
            <option value="">All Roles</option>
            <option value="Admin" ${_userRoleFilter==='Admin'?'selected':''}>Admin</option>
            <option value="Developer" ${_userRoleFilter==='Developer'?'selected':''}>Developer</option>
            <option value="Operator" ${_userRoleFilter==='Operator'?'selected':''}>Operator</option>
            <option value="Viewer" ${_userRoleFilter==='Viewer'?'selected':''}>Viewer</option>
          </select>
          <div class="ac-toolbar-spacer"></div>
          <span style="font-size:12px;color:var(--text-muted)">${rows.length} users</span>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div class="table-container" style="border:none">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Tenant</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
              <tbody>
                ${rows.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px">No users found</td></tr>` :
                rows.map(u => `<tr>
                  <td style="font-weight:600;color:var(--text-primary)">${esc(u.name)}</td>
                  <td style="font-size:12px;color:var(--text-muted)">${esc(u.email)}</td>
                  <td style="font-size:12px">${esc(u.tenant_name)}</td>
                  <td>${badge(u.role, {Admin:'#a855f7',Developer:'#3b82f6',Operator:'#f59e0b',Viewer:'#6b7280'}[u.role]||'#6b7280')}</td>
                  <td>${badge(u.status, statusColor(u.status))}</td>
                  <td style="font-size:12px;color:var(--text-muted)">${fmtTime(u.last_login)}</td>
                  <td>
                    <button class="btn btn-outline btn-sm" onclick="acRemoveUser('${u.tenant_id}','${u.id}')">Remove</button>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function acRemoveUser(tenantId, userId) {
      if (!confirm('Remove this user?')) return;
      TenantState.removeTenantUser(tenantId, userId);
      const t = TenantState.getTenants().find(x => x.tenant_id === tenantId);
      if (t) TenantState.updateTenant(tenantId, { users: Math.max(0, t.users - 1) });
      NexusStore.addLog({ type: 'SYSTEM', message: `User ${userId} removed from ${tenantId}`, agent: 'system' });
      showToast('User removed', 'info');
      renderUsers();
    }

    // ========== ROLES ==========
    function renderRoles() {
      const roles = [
        { role: 'Admin', desc: 'Full platform access, tenant & user management, billing', color: '#a855f7', perms: ['Dashboard','Tenants','Users','Billing','Settings','Audit Logs','All Modules'] },
        { role: 'Developer', desc: 'Project access, code review, pipeline, agents, backlog', color: '#3b82f6', perms: ['Dashboard','Pipeline','Agents','Code Review','Backlog','Test Cases'] },
        { role: 'Operator', desc: 'Monitoring, deployments, incident response, DevOps', color: '#f59e0b', perms: ['Dashboard','Monitoring','DevOps','Incidents','Deployments'] },
        { role: 'Viewer', desc: 'Read-only access to dashboards and reports', color: '#6b7280', perms: ['Dashboard','Monitoring','Decisions'] },
      ];

      document.getElementById('ac-roles').innerHTML = `
        <div class="ac-section-header">
          <div>
            <div class="ac-section-title">Roles & Permissions</div>
            <div class="ac-section-sub">Manage role-based access control across the platform</div>
          </div>
        </div>
        <div class="grid grid-2">
          ${roles.map(r => `
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">${badge(r.role, r.color)} ${r.role}</h3>
              </div>
              <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">${r.desc}</p>
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-weight:600">Accessible Modules</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${r.perms.map(p => `<span style="padding:4px 10px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--text-secondary)">${p}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ========== BILLING ==========
    function renderBilling() {
      const tenants = TenantState.getTenants();
      const prices = { PREMIUM: 299, STANDARD: 99, BASIC: 29 };
      const totalMRR = tenants.reduce((s, t) => s + (prices[t.subscription] || 0), 0);
      const planCounts = { PREMIUM: 0, STANDARD: 0, BASIC: 0 };
      tenants.forEach(t => { if (planCounts[t.subscription] !== undefined) planCounts[t.subscription]++; });

      document.getElementById('ac-billing').innerHTML = `
        <div class="ac-section-header">
          <div>
            <div class="ac-section-title">Billing & Plans</div>
            <div class="ac-section-sub">Revenue overview and subscription management</div>
          </div>
        </div>

        <div class="ac-kpi-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="ac-kpi">
            <div class="ac-kpi-icon">💰</div>
            <div class="ac-kpi-value">$${totalMRR.toLocaleString()}</div>
            <div class="ac-kpi-label">Monthly Recurring Revenue</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:78%;background:var(--success)"></div></div>
          </div>
          <div class="ac-kpi">
            <div class="ac-kpi-icon">📈</div>
            <div class="ac-kpi-value">$${(totalMRR * 12).toLocaleString()}</div>
            <div class="ac-kpi-label">Annual Run Rate</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:78%;background:var(--info)"></div></div>
          </div>
          <div class="ac-kpi">
            <div class="ac-kpi-icon">🏢</div>
            <div class="ac-kpi-value">${tenants.length}</div>
            <div class="ac-kpi-label">Paying Tenants</div>
            <div class="ac-kpi-bar"><div class="ac-kpi-bar-fill" style="width:100%;background:var(--purple)"></div></div>
          </div>
        </div>

        <div class="grid grid-3" style="margin-bottom:24px">
          ${['PREMIUM','STANDARD','BASIC'].map(plan => {
            const l = TenantState.getSubscriptionLimits(plan);
            return `<div class="card" style="text-align:center">
              <span style="font-size:32px">${l.icon}</span>
              <div style="font-size:18px;font-weight:700;margin:8px 0">${l.label}</div>
              <div style="font-size:24px;font-weight:800;color:var(--accent)">$${prices[plan]}<span style="font-size:12px;color:var(--text-muted)">/mo</span></div>
              <div style="font-size:13px;color:var(--text-muted);margin:8px 0">${planCounts[plan]} tenant${planCounts[plan]!==1?'s':''}</div>
              <div style="font-size:11px;color:var(--text-muted)">👥 ${l.users} users · 🤖 ${l.agents} agents · 🔌 ${l.api.toLocaleString()} API</div>
            </div>`;
          }).join('')}
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">💳 Tenant Subscriptions</h3></div>
          <div class="table-container">
            <table>
              <thead><tr><th>Tenant</th><th>Plan</th><th>Cost</th><th>Status</th><th>Since</th><th>Actions</th></tr></thead>
              <tbody>
                ${tenants.map(t => `<tr>
                  <td style="font-weight:600;color:var(--text-primary)">${esc(t.name)}</td>
                  <td>${planBadge(t.subscription)}</td>
                  <td style="font-weight:600">$${prices[t.subscription]||0}/mo</td>
                  <td>${badge(t.status, statusColor(t.status))}</td>
                  <td style="font-size:12px;color:var(--text-muted)">${fmtDate(t.created_at)}</td>
                  <td><button class="btn btn-outline btn-sm" onclick="acViewTenant('${t.tenant_id}')">Manage</button></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== AUDIT LOGS ==========
    function renderAudit() {
      const logs = NexusStore.getLogs().slice(0, 50);
      const typeColors = { SYSTEM: 'var(--info)', AUTH: 'var(--purple)', PROJECT: 'var(--success)', PIPELINE: 'var(--accent)', AGENT: 'var(--warning)', TASK: 'var(--info)', GATE: 'var(--success)', ESCALATION: 'var(--orange)', DECISION: 'var(--purple)', REQUIREMENTS: 'var(--info)' };

      document.getElementById('ac-audit').innerHTML = `
        <div class="ac-section-header">
          <div>
            <div class="ac-section-title">Audit Logs</div>
            <div class="ac-section-sub">System-wide activity and change history</div>
          </div>
          <span style="font-size:12px;color:var(--text-muted)">${logs.length} entries</span>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="table-container" style="border:none">
            <table>
              <thead><tr><th>Timestamp</th><th>Type</th><th>Message</th><th>Agent</th></tr></thead>
              <tbody>
                ${logs.length === 0 ? `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:40px">No audit logs yet</td></tr>` :
                logs.map(l => `<tr>
                  <td style="font-size:12px;color:var(--text-muted);white-space:nowrap">${fmtTime(l.timestamp)}</td>
                  <td><span style="font-size:11px;font-weight:600;color:${typeColors[l.type]||'var(--text-muted)'};text-transform:uppercase">${l.type||'—'}</span></td>
                  <td style="font-size:13px;color:var(--text-secondary)">${esc(l.message)}</td>
                  <td style="font-size:12px;color:var(--text-muted)">${esc(l.agent||'—')}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ========== SETTINGS ==========
    function renderSettings() {
      document.getElementById('ac-settings').innerHTML = `
        <div class="ac-section-header">
          <div>
            <div class="ac-section-title">Platform Settings</div>
            <div class="ac-section-sub">Global configuration for the NEXUS platform</div>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="card">
            <div class="card-header"><h3 class="card-title">🌐 General</h3></div>
            <div class="form-group"><label class="form-label">Platform Name</label><input type="text" class="form-input" value="NEXUS Agent-OS" id="acSetPlatformName"></div>
            <div class="form-group"><label class="form-label">Support Email</label><input type="email" class="form-input" value="support@nexus.com" id="acSetSupportEmail"></div>
            <div class="form-group"><label class="form-label">Default Region</label>
              <select class="form-select" id="acSetRegion">
                <option value="AP-SOUTH-1" selected>AP-SOUTH-1 (Mumbai)</option>
                <option value="US-EAST-1">US-EAST-1 (Virginia)</option>
                <option value="EU-WEST-1">EU-WEST-1 (Ireland)</option>
              </select>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">🔒 Security</h3></div>
            <div class="toggle-row"><div><div class="toggle-row-label">Enforce MFA for all tenants</div><div class="toggle-row-sub">Require multi-factor authentication</div></div>
              <label class="toggle-switch"><input type="checkbox" checked id="acSetMFA"><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row"><div><div class="toggle-row-label">IP Allowlist</div><div class="toggle-row-sub">Restrict admin access by IP</div></div>
              <label class="toggle-switch"><input type="checkbox" id="acSetIPAllow"><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row"><div><div class="toggle-row-label">Session Timeout</div><div class="toggle-row-sub">Auto-logout after inactivity</div></div>
              <label class="toggle-switch"><input type="checkbox" checked id="acSetSessionTimeout"><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">📧 Notifications</h3></div>
            <div class="toggle-row"><div><div class="toggle-row-label">Email alerts for new tenants</div></div>
              <label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row"><div><div class="toggle-row-label">Slack integration alerts</div></div>
              <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row"><div><div class="toggle-row-label">Usage threshold warnings</div></div>
              <label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">🗄️ Data & Maintenance</h3></div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <button class="btn btn-outline" style="justify-content:center" onclick="TenantState.resetTenantData();showToast('Tenant data reset','info');renderDashboard();acNav('dashboard')">↻ Reset Tenant Data</button>
              <button class="btn btn-outline" style="justify-content:center" onclick="showToast('Backup initiated — this is a simulation','info')">💾 Backup All Data</button>
              <button class="btn btn-outline" style="justify-content:center" onclick="showToast('Cache cleared','success')">🧹 Clear Platform Cache</button>
            </div>
          </div>
        </div>
        <div style="margin-top:16px;display:flex;justify-content:flex-end">
          <button class="btn btn-primary" onclick="showToast('Platform settings saved','success')">💾 Save Settings</button>
        </div>
      `;
    }

    // ========== REAL-TIME SIMULATION ==========
    setInterval(() => {
      if (getCurrentView() === 'dashboard') {
        // Update notification dot randomly
        document.getElementById('acNotifDot').style.display = Math.random() > 0.5 ? 'block' : 'none';
      }
    }, 8000);

    // ========== INIT ==========
    if (!location.hash) location.hash = 'dashboard';
    route();
  </script>
  <script src="../js/theme.js"></script>
</body>
</html>
