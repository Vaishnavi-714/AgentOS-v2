<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — LLM Execution Bridge</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .bridge-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    .terminal-panel {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      grid-row: 1 / 3;
    }
    .terminal-header {
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .terminal-body {
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      color: #c9d1d9;
      flex: 1;
      overflow-y: auto;
      line-height: 1.5;
    }
    .terminal-log { margin-bottom: 4px; }
    .terminal-log.system { color: #8b949e; }
    .terminal-log.error { color: #ff7b72; }
    .terminal-log.success { color: #3fb950; }
    
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .session-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .session-item:hover, .session-item.active {
      border-color: var(--primary);
      background: var(--primary)10;
    }
    .session-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .status-active { color: var(--success); }
    .status-escalated { color: var(--danger); }
    .status-completed { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">LLM Execution Bridge</h1>
        <p class="page-subtitle">Real-time terminal visibility and context tracking for AI Agents</p>
      </div>
      <div class="page-actions">
        <div id="projectSelector"></div>
      </div>
    </div>

    <div class="bridge-layout">
      <!-- TERMINAL (LEFT) -->
      <div class="terminal-panel">
        <div class="terminal-header">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="display:flex; gap:6px;">
              <div style="width:12px; height:12px; border-radius:50%; background:#ff5f56;"></div>
              <div style="width:12px; height:12px; border-radius:50%; background:#ffbd2e;"></div>
              <div style="width:12px; height:12px; border-radius:50%; background:#27c93f;"></div>
            </div>
            <span id="termTitle" style="font-family:var(--mono); font-size:13px; font-weight:600;">Select a session...</span>
          </div>
          <div id="termModel" class="tag" style="background:#30363d; color:#fff; border:none;">Model</div>
        </div>
        <div class="terminal-body" id="termBody">
          <div class="terminal-log system">Awaiting active LLM session connection...</div>
        </div>
      </div>

      <!-- SESSIONS (RIGHT TOP) -->
      <div class="panel">
        <div class="panel-header">
          <span>Active Sessions</span>
        </div>
        <div class="panel-body" id="sessionsList">
          <!-- Dynamic -->
        </div>
      </div>

      <!-- ESCALATIONS / CONTEXT (RIGHT BOTTOM) -->
      <div class="panel">
        <div class="panel-header">
          <span>Context & Escalations</span>
        </div>
        <div class="panel-body" id="contextPanel">
          <!-- Dynamic -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/orchestration-runtime.js"></script>
  <script src="js/nav.js"></script>
  <script>
    createNavigation('llm_bridge');
    let currentProjectId = createProjectSelector('projectSelector', renderBridge);
    let selectedSessionId = null;

    function renderBridge() {
      currentProjectId = getSelectedProject();
      const sessions = NexusStore.getLlmSessions(currentProjectId) || [];
      const project = NexusStore.getProject(currentProjectId);
      const escalations = project?.escalations || [];

      // Auto-select active session if none selected
      if (!selectedSessionId) {
        const active = sessions.find(s => s.status === 'ACTIVE');
        if (active) selectedSessionId = active.id;
        else if (sessions.length > 0) selectedSessionId = sessions[sessions.length - 1].id;
      }

      // Render Sessions
      const sessionsHtml = sessions.slice().reverse().map(s => `
        <div class="session-item ${s.id === selectedSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
          <div class="session-meta">
            <span>${s.id}</span>
            <span class="${s.status === 'ACTIVE' ? 'status-active' : s.status === 'ESCALATED' ? 'status-escalated' : 'status-completed'}">${s.status}</span>
          </div>
          <div style="font-weight:600; font-size:14px;">${s.agent}</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Task: ${s.taskId} | Model: ${s.model}</div>
        </div>
      `).join('');
      document.getElementById('sessionsList').innerHTML = sessionsHtml || '<div class="empty-state">No LLM sessions yet.</div>';

      // Render Terminal
      const selected = sessions.find(s => s.id === selectedSessionId);
      if (selected) {
        document.getElementById('termTitle').textContent = `[${selected.id}] ${selected.agent}`;
        document.getElementById('termModel').textContent = selected.model;
        
        const termBody = document.getElementById('termBody');
        const logsHtml = selected.logs.map(l => {
          let cls = '';
          if (l.includes('⚠️') || l.includes('Error')) cls = 'error';
          else if (l.includes('successfully')) cls = 'success';
          else if (l.startsWith('Initializing') || l.startsWith('Session')) cls = 'system';
          return `<div class="terminal-log ${cls}">${escapeHtml(l)}</div>`;
        }).join('');
        
        termBody.innerHTML = logsHtml;
        termBody.scrollTop = termBody.scrollHeight; // auto scroll
      }

      // Render Context Panel
      const contextHtml = `
        <div style="margin-bottom: 16px;">
          <h4 style="font-size:12px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase;">Task Context</h4>
          <div style="font-size:13px; line-height:1.5;">
            ${selected ? `Currently working on ${selected.module} module.<br>Targeting Task: ${selected.taskId}` : 'No session selected.'}
          </div>
        </div>
        <div>
          <h4 style="font-size:12px; color:var(--danger); margin-bottom:8px; text-transform:uppercase;">Active Escalations</h4>
          ${escalations.length === 0 ? '<div style="font-size:13px; color:var(--text-muted);">No open escalations.</div>' : ''}
          ${escalations.map(e => `
            <div style="padding:8px; border:1px solid var(--danger)40; background:var(--danger)10; border-radius:var(--radius); margin-bottom:8px;">
              <div style="font-size:12px; font-family:var(--mono); color:var(--danger);">${e.id} [${e.status}]</div>
              <div style="font-size:13px; margin:4px 0;">${escapeHtml(e.issue)}</div>
              <div style="font-size:12px; color:var(--text-muted);">Assigned to: ${e.assignedTo}</div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('contextPanel').innerHTML = contextHtml;
    }

    function selectSession(id) {
      selectedSessionId = id;
      renderBridge();
    }

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    setInterval(renderBridge, 1000);
    renderBridge();
  </script>
</body>
</html>
