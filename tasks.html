<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Tasks</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Task Management</h1>
        <p class="page-subtitle">Governed task lifecycle tracking and state transitions</p>
      </div>
      <div class="page-actions">
        <div id="projectSelector"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="taskStats" style="margin-bottom:24px;"></div>

    <!-- State Machine Visualization -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><h3 class="card-title">Task State Machine</h3></div>
      <div style="display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; padding:10px;">
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">SPECIFIED</div>
        <div style="font-size:16px; color:var(--text-muted);">→</div>
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">AGENT_ASSIGNED</div>
        <div style="font-size:16px; color:var(--text-muted);">→</div>
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">EXECUTING</div>
        <div style="font-size:16px; color:var(--text-muted);">→</div>
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">ESCALATED</div>
        <div style="font-size:16px; color:var(--text-muted);">→</div>
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">GATE_REVIEW</div>
        <div style="font-size:16px; color:var(--text-muted);">→</div>
        <div style="padding:8px 16px; border-radius:8px; border:1px solid var(--border); font-size:12px; font-weight:600; background:var(--bg-tertiary);">DONE</div>
      </div>
      <div style="text-align:center; font-size:11px; color:var(--text-muted); padding-bottom:8px;">
        BLOCKED ← ceiling violation / failed gate (branches from EXECUTING)
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <select class="form-select" id="filterStatus" onchange="renderTasks()">
        <option value="">All Statuses</option>
        <option value="SPECIFIED">Specified</option>
        <option value="AGENT_ASSIGNED">Assigned</option>
        <option value="EXECUTING">Executing</option>
        <option value="ESCALATED">Escalated</option>
        <option value="BLOCKED">Blocked</option>
        <option value="GATE_REVIEW">Review</option>
        <option value="DONE">Done</option>
      </select>
      <select class="form-select" id="filterRisk" onchange="renderTasks()">
        <option value="">All Risks</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
        <option value="CRITICAL">Critical</option>
      </select>
      <select class="form-select" id="filterModule" onchange="renderTasks()">
        <option value="">All Modules</option>
      </select>
    </div>

    <div class="tabs" style="margin-top:8px;">
      <button class="tab active" onclick="switchTaskView('list', event)">List View</button>
      <button class="tab" onclick="switchTaskView('kanban', event)">Kanban Board</button>
      <button class="tab" onclick="switchTaskView('flow', event)">Flow View</button>
    </div>

    <div id="task-view-list" class="tab-content active">
      <div id="taskList"></div>
    </div>
    <div id="task-view-kanban" class="tab-content"></div>
    <div id="task-view-flow" class="tab-content"></div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h3 class="modal-title" id="taskModalTitle">Task Details</h3>
        <button class="modal-close" onclick="closeModal('taskModal')">&times;</button>
      </div>
      <div class="modal-body" id="taskModalBody"></div>
      <div class="modal-footer" id="taskModalFooter"></div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('tasks');
    let currentProjectId = createProjectSelector('projectSelector', () => { populateModules(); renderTasks(); });
    let draggingTaskId = null;
    let taskTicker = null;
    const taskRuntime = {};

    const KANBAN_COLUMNS = [
      { id: 'SPECIFIED', label: 'SPECIFIED', color: 'var(--warning)' },
      { id: 'AGENT_ASSIGNED', label: 'ASSIGNED', color: 'var(--accent)' },
      { id: 'EXECUTING', label: 'EXECUTING', color: 'var(--info)' },
      { id: 'ESCALATED', label: 'ESCALATED', color: 'var(--orange)' },
      { id: 'BLOCKED', label: 'BLOCKED', color: 'var(--danger)' },
      { id: 'GATE_REVIEW', label: 'REVIEW', color: 'var(--purple)' },
      { id: 'DONE', label: 'DONE', color: 'var(--success)' }
    ];

    function switchTaskView(view, evt) {
      document.querySelectorAll('#task-view-list, #task-view-kanban, #task-view-flow').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      document.getElementById('task-view-' + view).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    function populateModules() {
      currentProjectId = getSelectedProject();
      const project = NexusStore.getProject(currentProjectId);
      const sel = document.getElementById('filterModule');
      sel.innerHTML = '<option value="">All Modules</option>';
      (project?.modules || []).forEach(m => sel.innerHTML += `<option value="${m}">${m}</option>`);
    }

    function getFilteredTasks() {
      currentProjectId = getSelectedProject();
      let tasks = NexusStore.getTasks(currentProjectId);
      const filterStatus = document.getElementById('filterStatus').value;
      const filterRisk = document.getElementById('filterRisk').value;
      const filterModule = document.getElementById('filterModule').value;

      if (filterStatus) tasks = tasks.filter(t => t.status === filterStatus);
      if (filterRisk) tasks = tasks.filter(t => t.risk === filterRisk);
      if (filterModule) tasks = tasks.filter(t => t.module === filterModule);
      return tasks;
    }

    function ensureTaskRuntime(tasks) {
      tasks.forEach(task => {
        if (!taskRuntime[task.task_id]) {
          const base = task.tokensUsed || (task.task_id === 'TASK-AUTH-101' ? 1200 : task.task_id === 'TASK-AUTH-102' ? 1500 : 900 + Math.floor(Math.random() * 400));
          taskRuntime[task.task_id] = {
            tokens: base,
            milestones: [1200, 1500, 2100],
            milestoneIndex: base >= 2100 ? 2 : base >= 1500 ? 1 : 0
          };
        }
      });
    }

    function getTaskTokens(task) {
      ensureTaskRuntime([task]);
      return taskRuntime[task.task_id].tokens;
    }

    function startTaskSimulation() {
      if (!taskTicker) {
        taskTicker = setInterval(() => {
          const project = NexusStore.getProject(getSelectedProject());
          if (project && project.isRunning === false) {
            clearInterval(taskTicker);
            taskTicker = null;
            return;
          }
          stepTaskSimulation();
        }, 2000);
      }
    }

    function stepTaskSimulation() {
      currentProjectId = getSelectedProject();
      const tasks = NexusStore.getTasks(currentProjectId);
      ensureTaskRuntime(tasks);
      let changed = false;

      tasks.forEach(task => {
        const runtime = taskRuntime[task.task_id];
        if (!runtime) return;
        if (!['AGENT_ASSIGNED', 'EXECUTING', 'ESCALATED', 'BLOCKED', 'GATE_REVIEW'].includes(task.status)) return;

        if (runtime.milestoneIndex < runtime.milestones.length - 1) {
          runtime.milestoneIndex += 1;
          runtime.tokens = runtime.milestones[runtime.milestoneIndex];
        } else {
          runtime.tokens += 40 + Math.floor(Math.random() * 90);
        }
        task.tokensUsed = runtime.tokens;
        changed = true;
      });

      if (changed) {
        NexusStore.setTasks(currentProjectId, tasks);
        renderTasks();
      }
    }

    function renderTasks() {
      currentProjectId = getSelectedProject();
      const allTasks = NexusStore.getTasks(currentProjectId);
      const filteredTasks = getFilteredTasks();
      ensureTaskRuntime(allTasks);
      startTaskSimulation();

      const done = allTasks.filter(t => t.status === 'DONE').length;
      const executing = allTasks.filter(t => t.status === 'EXECUTING').length;
      const escalated = allTasks.filter(t => t.status === 'ESCALATED' || t.status === 'BLOCKED').length;

      document.getElementById('taskStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Total Tasks</span><span class="stat-value">${allTasks.length}</span></div>
        <div class="stat-card"><span class="stat-label">Completed</span><span class="stat-value" style="color:var(--success)">${done}</span></div>
        <div class="stat-card"><span class="stat-label">Executing</span><span class="stat-value" style="color:var(--info)">${executing}</span></div>
        <div class="stat-card"><span class="stat-label">Blocked / Escalated</span><span class="stat-value" style="color:var(--danger)">${escalated}</span></div>
      `;

      renderListView(filteredTasks);
      renderKanbanView(filteredTasks);
      renderFlowView(filteredTasks);
    }

    function renderListView(tasks) {
      if (tasks.length === 0) {
        document.getElementById('taskList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><h3 class="empty-state-title">Waiting for pipeline completion</h3></div>';
        return;
      }

      const parentTasks = tasks.filter(t => t.level === "MODULE" || !t.level);

      document.getElementById('taskList').innerHTML = `
        <div class="table-container">
          <table>
            <thead><tr><th>Task ID / Title</th><th>Module</th><th>Assignment Chain</th><th>Risk / Gate</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${parentTasks.map(parent => {
                const pAgent = NexusStore.getAgent(parent.assignedTo);
                let rows = `
                  <tr class="parent-row" style="background:var(--bg-tertiary);">
                    <td>
                      <div style="font-family:var(--mono); font-size:11px; color:var(--accent);">${parent.task_id}</div>
                      <div style="font-weight:600;">▶ ${escapeHtml(parent.title)}</div>
                    </td>
                    <td><span class="tag">${parent.module}</span></td>
                    <td style="font-size:12px;">
                      <span style="color:var(--text-muted);">${escapeHtml(parent.assignedBy || 'system')}</span> → 
                      <strong>${pAgent ? escapeHtml(pAgent.agent_name) : parent.assignedTo}</strong>
                    </td>
                    <td>${riskBadge(parent.risk)}</td>
                    <td>${statusBadge(parent.status)}</td>
                    <td>
                      <button class="btn btn-outline btn-sm" onclick="showTask('${parent.task_id}')">Details</button>
                    </td>
                  </tr>
                `;

                if (parent.children && parent.children.length > 0) {
                  const childrenHtml = parent.children.map(child => {
                    const cAgent = NexusStore.getAgent(child.assignedTo);
                    // Match against actual task in store for real-time status if available
                    const realChild = tasks.find(t => t.task_id === child.task_id) || child;
                    return `
                      <tr class="child-row">
                        <td style="padding-left:30px;">
                          <div style="font-family:var(--mono); font-size:11px; color:var(--text-muted);">${realChild.task_id}</div>
                          <div style="font-weight:500;">↳ ${escapeHtml(realChild.title)}</div>
                        </td>
                        <td><span class="tag">${realChild.module}</span></td>
                        <td style="font-size:12px;">
                          <span style="color:var(--text-muted);">${escapeHtml(realChild.assignedBy || parent.assignedTo)}</span> → 
                          <strong>${cAgent ? escapeHtml(cAgent.agent_name) : realChild.assignedTo}</strong>
                        </td>
                        <td><span class="tag">${realChild.gateLevel || 'CODE_REVIEW'} ${realChild.gateStatus === 'PASS' ? '✓' : realChild.gateStatus === 'FAIL' ? '✗' : '⏳'}</span></td>
                        <td>${statusBadge(realChild.status)}</td>
                        <td>
                          <button class="btn btn-outline btn-sm" onclick="showTask('${realChild.task_id}')">Details</button>
                        </td>
                      </tr>
                    `;
                  }).join('');
                  rows += childrenHtml;
                }
                return rows;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderKanbanView(tasks) {
      if (tasks.length === 0) {
        document.getElementById('task-view-kanban').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧩</div><h3 class="empty-state-title">Waiting for pipeline completion</h3></div>';
        return;
      }

      document.getElementById('task-view-kanban').innerHTML = `
        <div class="kanban-grid">
          ${KANBAN_COLUMNS.map(col => {
            const colTasks = tasks.filter(t => t.status === col.id);
            return `
              <div class="kanban-col">
                <div class="kanban-col-header">
                  <span class="kanban-col-title" style="color:${col.color}">${col.label}</span>
                  <span class="tag">${colTasks.length}</span>
                </div>
                <div class="kanban-dropzone" ondragover="onTaskDragOver(event)" ondragleave="onTaskDragLeave(event)" ondrop="onTaskDrop(event, '${col.id}')">
                  ${colTasks.map(task => renderKanbanCard(task)).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderKanbanCard(task) {
      const agent = NexusStore.getAgent(task.assignedTo);
      return `
        <div class="kanban-task" draggable="true" ondragstart="onTaskDragStart(event, '${task.task_id}')" ondragend="onTaskDragEnd(event)" onclick="showTask('${task.task_id}')">
          <div style="font-family:var(--mono); font-size:11px; color:var(--accent);">${task.task_id}</div>
          <div class="kanban-task-title">${escapeHtml(task.title)}</div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">${agent ? escapeHtml(agent.agent_name) : task.assignedTo}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            ${riskBadge(task.risk)}
            <span class="tag">${getTaskTokens(task)}</span>
          </div>
          <div>${statusBadge(task.status)}</div>
        </div>
      `;
    }

    function onTaskDragStart(evt, taskId) {
      draggingTaskId = taskId;
      evt.dataTransfer.setData('text/plain', taskId);
      evt.currentTarget.classList.add('dragging');
    }

    function onTaskDragEnd(evt) {
      evt.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-dropzone').forEach(z => z.classList.remove('drag-over'));
    }

    function onTaskDragOver(evt) {
      evt.preventDefault();
      evt.currentTarget.classList.add('drag-over');
    }

    function onTaskDragLeave(evt) {
      evt.currentTarget.classList.remove('drag-over');
    }

    function onTaskDrop(evt, targetStatus) {
      evt.preventDefault();
      evt.currentTarget.classList.remove('drag-over');

      const taskId = evt.dataTransfer.getData('text/plain') || draggingTaskId;
      if (!taskId) return;

      const tasks = NexusStore.getTasks(currentProjectId);
      const task = tasks.find(t => t.task_id === taskId);
      if (!task) return;
      if (task.status === targetStatus) return;

      const oldStatus = task.status;
      task.status = targetStatus;
      task.logs = task.logs || [];
      task.logs.push(`Moved via Kanban: ${oldStatus} → ${targetStatus}`);
      if (targetStatus === 'DONE') task.completedAt = new Date().toISOString();
      if (targetStatus !== 'DONE') task.completedAt = null;

      NexusStore.setTasks(currentProjectId, tasks);
      showToast(`Task ${taskId} moved to ${targetStatus}`, 'success');
      renderTasks();
    }

    function renderFlowView(tasks) {
      const priorityTasks = tasks
        .slice()
        .sort((a, b) => {
          if (a.task_id === 'TASK-AUTH-101') return -1;
          if (b.task_id === 'TASK-AUTH-101') return 1;
          if (a.task_id === 'TASK-AUTH-102') return -1;
          if (b.task_id === 'TASK-AUTH-102') return 1;
          return a.task_id.localeCompare(b.task_id);
        })
        .slice(0, 6);

      if (priorityTasks.length === 0) {
        document.getElementById('task-view-flow').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔁</div><h3 class="empty-state-title">Waiting for pipeline completion</h3></div>';
        return;
      }

      document.getElementById('task-view-flow').innerHTML = `
        <div class="flow-stack">
          ${priorityTasks.map(task => `
            <div class="flow-card">
              <div class="card-header" style="margin-bottom:8px;">
                <div>
                  <h3 class="card-title">${task.task_id} — ${escapeHtml(task.title)}</h3>
                  <span class="card-subtitle">${task.module} module · Tokens ${getTaskTokens(task)}</span>
                </div>
                ${statusBadge(task.status)}
              </div>

              <div style="display:grid; grid-template-columns:repeat(4, minmax(180px, 1fr)); gap:10px;">
                ${renderTaskFlowStage(task, 'Chief Architect', 'Approved backlog + Epic', 'Architecture specification', 1)}
                ${renderTaskFlowStage(task, 'Module Architect', 'Architecture specification', 'Module design + assignment', 2)}
                ${renderTaskFlowStage(task, 'Developer', 'Assigned implementation task', 'Code + tests', 3)}
                ${renderTaskFlowStage(task, 'QA', 'Code + acceptance criteria', 'Test result + gate decision', 4)}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTaskFlowStage(task, stageName, input, output, stageIndex) {
      const stageStatus = resolveTaskStageStatus(task.status, stageIndex);
      return `
        <div class="flow-io-box">
          <div class="flow-io-title">${stageName}</div>
          <div style="font-size:12px; margin-bottom:6px;"><strong>Input:</strong> ${input}</div>
          <div style="font-size:12px; margin-bottom:8px;"><strong>Output:</strong> ${output}</div>
          ${statusBadge(stageStatus)}
        </div>
      `;
    }

    function resolveTaskStageStatus(taskStatus, stageIndex) {
      if (taskStatus === 'DONE') return 'COMPLETED';
      if (taskStatus === 'SPECIFIED') return stageIndex === 1 ? 'EXECUTING' : 'IDLE';
      if (taskStatus === 'AGENT_ASSIGNED') {
        if (stageIndex === 1) return 'COMPLETED';
        return stageIndex === 2 ? 'EXECUTING' : 'IDLE';
      }
      if (taskStatus === 'EXECUTING') {
        if (stageIndex <= 2) return 'COMPLETED';
        return stageIndex === 3 ? 'EXECUTING' : 'IDLE';
      }
      if (taskStatus === 'ESCALATED') return stageIndex === 3 ? 'ESCALATED' : stageIndex < 3 ? 'COMPLETED' : 'IDLE';
      if (taskStatus === 'BLOCKED') return stageIndex === 3 ? 'BLOCKED' : stageIndex < 3 ? 'COMPLETED' : 'IDLE';
      if (taskStatus === 'GATE_REVIEW') return stageIndex < 4 ? 'COMPLETED' : 'EXECUTING';
      return 'IDLE';
    }

    function showTask(taskId) {
      currentProjectId = getSelectedProject();
      const task = NexusStore.getTasks(currentProjectId).find(t => t.task_id === taskId);
      if (!task) return;
      const agent = NexusStore.getAgent(task.assignedTo);

      document.getElementById('taskModalTitle').textContent = task.task_id + ' — ' + task.title;
      document.getElementById('taskModalBody').innerHTML = `
        <div class="grid grid-2" style="margin-bottom:16px;">
          <div><span class="form-label">Module</span><div><span class="tag">${task.module}</span></div></div>
          <div><span class="form-label">Risk</span><div>${riskBadge(task.risk)}</div></div>
          <div><span class="form-label">Assigned To</span><div style="font-size:13px;">${agent ? escapeHtml(agent.agent_name) : task.assignedTo}</div></div>
          <div><span class="form-label">Story Reference</span><div style="font-size:13px; font-family:var(--mono);">${task.storyRef || 'N/A'}</div></div>
          <div><span class="form-label">Gate Level</span><div><span class="tag">${task.gateLevel}</span></div></div>
          <div><span class="form-label">Gate Status</span><div>${statusBadge(task.gateStatus)}</div></div>
          <div><span class="form-label">Tokens Used</span><div><span class="tag">${getTaskTokens(task)}</span></div></div>
          <div><span class="form-label">Created</span><div style="font-size:13px;">${formatTime(task.createdAt)}</div></div>
          <div><span class="form-label">Completed</span><div style="font-size:13px;">${task.completedAt ? formatTime(task.completedAt) : '—'}</div></div>
        </div>

        <div class="form-label">Status</div>
        <div style="margin-bottom:16px;">${statusBadge(task.status)}</div>

        <div class="form-label">Execution Log</div>
        <div class="timeline" style="max-height:200px; overflow-y:auto;">
          ${(task.logs || []).map(l => `<div class="timeline-item completed"><p style="font-size:13px; color:var(--text-secondary)">${escapeHtml(l)}</p></div>`).join('')}
        </div>
      `;

      let actions = '<button class="btn btn-outline" onclick="closeModal(\'taskModal\')">Close</button>';
      if (task.status === 'EXECUTING') {
        actions = `
          <button class="btn btn-success btn-sm" onclick="submitForGate('${task.task_id}', '${task.gateLevel}')">Submit to Gate Review</button>
          <button class="btn btn-warning btn-sm" onclick="escalateTask('${task.task_id}')">Escalate</button>
          ${actions}
        `;
      } else if (task.status === 'SPECIFIED') {
        actions = `<button class="btn btn-primary btn-sm" onclick="transitionTask('${task.task_id}', 'AGENT_ASSIGNED', 'Assigned to delivery agent')">Assign Agent</button>${actions}`;
      } else if (task.status === 'AGENT_ASSIGNED') {
        actions = `<button class="btn btn-primary btn-sm" onclick="transitionTask('${task.task_id}', 'EXECUTING', 'Execution started')">Start Execution</button>${actions}`;
      } else if (task.status === 'BLOCKED' || task.status === 'ESCALATED') {
        actions = `<button class="btn btn-primary btn-sm" onclick="transitionTask('${task.task_id}', 'EXECUTING', 'Unblocked, resuming execution')">Resume</button>${actions}`;
      }
      document.getElementById('taskModalFooter').innerHTML = actions;
      document.getElementById('taskModal').classList.add('show');
    }

    async function transitionTask(taskId, newStatus, note) {
      showLoading('Updating task...');
      await MockAPI.updateTaskStatus(currentProjectId, taskId, newStatus, note);
      hideLoading();
      closeModal('taskModal');
      showToast(`Task ${taskId} → ${newStatus}`, 'success');
      renderTasks();
    }

    async function submitForGate(taskId, level) {
      const tasks = NexusStore.getTasks(currentProjectId);
      const task = tasks.find(t => t.task_id === taskId);
      if (task) {
        task.status = 'GATE_REVIEW';
        task.logs = task.logs || [];
        task.logs.push(`Submitted to ${level} gate review`);
        NexusStore.setTasks(currentProjectId, tasks);
      }

      showLoading('Running quality gate review...');
      const result = await MockAPI.submitGateReview(currentProjectId, taskId, level);
      hideLoading();
      closeModal('taskModal');
      if (result.success) {
        showToast(`Gate ${level}: ${result.gate.status}`, result.gate.status === 'PASS' ? 'success' : 'warning');
      }
      renderTasks();
    }

    async function escalateTask(taskId) {
      showLoading('Raising escalation...');
      const task = NexusStore.getTasks(currentProjectId).find(t => t.task_id === taskId);
      await MockAPI.raiseEscalation({
        raised_by: task.assignedTo,
        raised_by_name: NexusStore.getAgent(task.assignedTo)?.agent_name || task.assignedTo,
        ceiling_violated: 'task_blocked',
        context: `Task ${taskId}: ${task.title} — requires escalation`,
        reasoning: 'Agent cannot proceed within current ceiling constraints',
        impact_analysis: `Affects ${task.module} module`,
        options: [{ option: 'Approve with conditions', risk: 'MEDIUM' }, { option: 'Defer task', risk: 'LOW' }],
        recommended_action: 'Approve with conditions',
        escalated_to: 'agent_chief_arch_001',
        escalated_to_name: 'Chief / Solution Architect',
        projectId: currentProjectId,
        taskRef: taskId
      });
      await MockAPI.updateTaskStatus(currentProjectId, taskId, 'ESCALATED', 'Escalation raised');
      hideLoading();
      closeModal('taskModal');
      showToast('Escalation raised', 'warning');
      renderTasks();
    }

    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    window.addEventListener('beforeunload', () => {
      if (taskTicker) clearInterval(taskTicker);
    });

    populateModules();
    renderTasks();
  </script>
</body>
</html>
