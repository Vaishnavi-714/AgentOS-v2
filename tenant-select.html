<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Select Workspace</title>
  <link rel="stylesheet" href="css/common.css">
  <script>try{const theme=localStorage.getItem("theme");if(theme==="light"||theme==="dark"){document.documentElement.dataset.theme=theme;}}catch(e){}</script>

  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="landing-page">
    <div class="landing-hero fade-in" style="padding-bottom: 20px;">
      <span class="landing-hero-icon">🏢</span>
      <h1>Select Your Workspace</h1>
      <p>Choose a tenant workspace to log into NEXUS Agent-OS</p>
    </div>

    <div class="landing-tenants" style="margin-top: 20px;">
      <div class="landing-tenant-grid" id="tenantGrid"></div>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
      <a href="landing.html" style="color: var(--text-muted); text-decoration: none; font-size: 13px;">← Back to Home</a>
    </div>

    <div class="landing-footer">
      <p>NEXUS Agent-OS &copy; 2026 — Multi-Tenant Governed AI Development Platform</p>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script>
    // Tenant selection is no longer needed — tenant is auto-detected from login email
    window.location.href = 'index.html';
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
