<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Compliance</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">Security &amp; Compliance</h1>
        <p class="page-subtitle">SOC2, GDPR, ISO 27001 controls — audit readiness, evidence tracking &amp; secrets management</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="runComplianceAudit()">🔍 Run Audit</button>
      </div>
    </div>

    <!-- Compliance Score -->
    <div class="card" style="margin-bottom:16px;padding:16px;">
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div style="text-align:center;">
          <div id="complianceScore" style="width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;border:3px solid"></div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Overall</div>
        </div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;" id="frameworkScores"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="compStats" style="margin-bottom:24px"></div>

    <!-- Tabs -->
    <div class="tabs" style="margin-bottom:20px;">
      <button class="tab active" onclick="switchTab('controls')">🛡️ Controls</button>
      <button class="tab" onclick="switchTab('secrets')">🔐 Secrets</button>
      <button class="tab" onclick="switchTab('audit')">📋 Audit Trail</button>
      <button class="tab" onclick="switchTab('drp')">🔄 DR &amp; Backup</button>
    </div>

    <div id="tabContent"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/event-bus.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('compliance');
    NexusPermissions.enforcePageAccess('compliance');
    injectTenantInfoCard();

    let currentTab = 'controls';

    // Compliance controls data
    function seedCompliance() {
      if (NexusStore.getComplianceControls().length > 0) return;
      NexusStore.setComplianceControls([
        { id: 'CC-001', framework: 'SOC2', category: 'Access Control', control: 'Multi-factor authentication for all admin accounts', status: 'COMPLIANT', evidence: 'MFA enabled for 100% admin users', last_reviewed: new Date(Date.now() - 86400000*5).toISOString(), owner: 'Security Agent', risk: 'LOW' },
        { id: 'CC-002', framework: 'SOC2', category: 'Access Control', control: 'Role-based access control enforcement', status: 'COMPLIANT', evidence: 'RBAC matrix configured in permissions.js', last_reviewed: new Date(Date.now() - 86400000*3).toISOString(), owner: 'Security Agent', risk: 'LOW' },
        { id: 'CC-003', framework: 'SOC2', category: 'Monitoring', control: 'Continuous system monitoring and alerting', status: 'COMPLIANT', evidence: 'Datadog + PagerDuty integration active', last_reviewed: new Date(Date.now() - 86400000*2).toISOString(), owner: 'DevOps Agent', risk: 'LOW' },
        { id: 'CC-004', framework: 'SOC2', category: 'Incident Response', control: 'Documented incident response procedures', status: 'PARTIAL', evidence: 'Auto-triage configured, runbooks pending for 2 services', last_reviewed: new Date(Date.now() - 86400000*7).toISOString(), owner: 'Support Agent', risk: 'MEDIUM' },
        { id: 'CC-005', framework: 'SOC2', category: 'Change Management', control: 'All changes reviewed before production deployment', status: 'COMPLIANT', evidence: 'PR review mandatory, quality gates L1-L4 enforced', last_reviewed: new Date(Date.now() - 86400000*1).toISOString(), owner: 'Reviewer Agent', risk: 'LOW' },
        { id: 'CC-006', framework: 'GDPR', category: 'Data Protection', control: 'Personal data encryption at rest and in transit', status: 'COMPLIANT', evidence: 'AES-256 at rest, TLS 1.3 in transit', last_reviewed: new Date(Date.now() - 86400000*4).toISOString(), owner: 'Security Agent', risk: 'LOW' },
        { id: 'CC-007', framework: 'GDPR', category: 'Data Protection', control: 'Data subject access request (DSAR) workflow', status: 'NON_COMPLIANT', evidence: 'DSAR workflow not yet implemented', last_reviewed: new Date(Date.now() - 86400000*10).toISOString(), owner: 'BA Agent', risk: 'HIGH' },
        { id: 'CC-008', framework: 'GDPR', category: 'Data Retention', control: 'Data retention policy enforcement', status: 'PARTIAL', evidence: 'Log retention configured (90 days), user data retention pending', last_reviewed: new Date(Date.now() - 86400000*6).toISOString(), owner: 'DevOps Agent', risk: 'MEDIUM' },
        { id: 'CC-009', framework: 'GDPR', category: 'Consent', control: 'User consent management for data processing', status: 'PARTIAL', evidence: 'Consent banner implemented, granular consent controls WIP', last_reviewed: new Date(Date.now() - 86400000*8).toISOString(), owner: 'Developer Agent', risk: 'MEDIUM' },
        { id: 'CC-010', framework: 'ISO27001', category: 'Asset Management', control: 'Information asset inventory and classification', status: 'COMPLIANT', evidence: 'Asset registry maintained in CMDB', last_reviewed: new Date(Date.now() - 86400000*3).toISOString(), owner: 'Security Agent', risk: 'LOW' },
        { id: 'CC-011', framework: 'ISO27001', category: 'Cryptography', control: 'Encryption key management and rotation', status: 'COMPLIANT', evidence: 'HashiCorp Vault managing 45 secrets with auto-rotation', last_reviewed: new Date(Date.now() - 86400000*2).toISOString(), owner: 'DevOps Agent', risk: 'LOW' },
        { id: 'CC-012', framework: 'ISO27001', category: 'Business Continuity', control: 'Disaster recovery plan and testing', status: 'PARTIAL', evidence: 'DR plan documented, last DR test 45 days ago (target: 30 days)', last_reviewed: new Date(Date.now() - 86400000*15).toISOString(), owner: 'DevOps Agent', risk: 'MEDIUM' },
        { id: 'CC-013', framework: 'ISO27001', category: 'Supplier Management', control: 'Third-party vendor security assessment', status: 'NON_COMPLIANT', evidence: 'No formal vendor assessment process in place', last_reviewed: new Date(Date.now() - 86400000*20).toISOString(), owner: 'Security Agent', risk: 'HIGH' },
        { id: 'CC-014', framework: 'SOC2', category: 'Data Privacy', control: 'PII data masking in non-production environments', status: 'COMPLIANT', evidence: 'AI Safety masking rules active for 8 PII patterns', last_reviewed: new Date(Date.now() - 86400000*1).toISOString(), owner: 'Security Agent', risk: 'LOW' }
      ]);
    }

    seedCompliance();

    // Secrets data
    const secrets = [
      { name: 'DATABASE_URL', engine: 'kv', last_rotated: new Date(Date.now() - 86400000*7).toISOString(), rotation_policy: '30 days', status: 'VALID', accessed_by: 3, environment: 'all' },
      { name: 'STRIPE_SECRET_KEY', engine: 'kv', last_rotated: new Date(Date.now() - 86400000*14).toISOString(), rotation_policy: '90 days', status: 'VALID', accessed_by: 1, environment: 'production' },
      { name: 'JWT_SECRET', engine: 'transit', last_rotated: new Date(Date.now() - 86400000*2).toISOString(), rotation_policy: '7 days', status: 'VALID', accessed_by: 2, environment: 'all' },
      { name: 'AWS_ACCESS_KEY_ID', engine: 'aws', last_rotated: new Date(Date.now() - 3600000*4).toISOString(), rotation_policy: '24 hours (dynamic)', status: 'VALID', accessed_by: 4, environment: 'all' },
      { name: 'GITHUB_TOKEN', engine: 'kv', last_rotated: new Date(Date.now() - 86400000*45).toISOString(), rotation_policy: '90 days', status: 'ROTATION_DUE', accessed_by: 2, environment: 'ci-cd' },
      { name: 'SMTP_PASSWORD', engine: 'kv', last_rotated: new Date(Date.now() - 86400000*120).toISOString(), rotation_policy: '90 days', status: 'EXPIRED', accessed_by: 1, environment: 'production' },
      { name: 'REDIS_AUTH_TOKEN', engine: 'kv', last_rotated: new Date(Date.now() - 86400000*10).toISOString(), rotation_policy: '30 days', status: 'VALID', accessed_by: 3, environment: 'all' },
      { name: 'TLS_CERTIFICATE', engine: 'pki', last_rotated: new Date(Date.now() - 86400000*60).toISOString(), rotation_policy: '365 days', status: 'VALID', accessed_by: 8, environment: 'production' }
    ];

    // DR data
    const drStatus = {
      primary_region: 'AP-SOUTH-1 (Mumbai)',
      dr_region: 'US-EAST-1 (Virginia)',
      replication_lag: '2.3s',
      last_backup: new Date(Date.now() - 3600000*6).toISOString(),
      backup_size: '142 GB',
      last_dr_test: new Date(Date.now() - 86400000*45).toISOString(),
      dr_test_result: 'PASS',
      rpo: '< 5 minutes',
      rto: '< 30 minutes',
      backups: [
        { id: 'BKP-001', type: 'Full', size: '142 GB', created: new Date(Date.now() - 3600000*6).toISOString(), status: 'COMPLETED', retention: '30 days' },
        { id: 'BKP-002', type: 'Incremental', size: '3.2 GB', created: new Date(Date.now() - 3600000*12).toISOString(), status: 'COMPLETED', retention: '7 days' },
        { id: 'BKP-003', type: 'Full', size: '140 GB', created: new Date(Date.now() - 86400000*1).toISOString(), status: 'COMPLETED', retention: '30 days' },
        { id: 'BKP-004', type: 'Incremental', size: '2.8 GB', created: new Date(Date.now() - 86400000*1.5).toISOString(), status: 'COMPLETED', retention: '7 days' }
      ]
    };

    function render() {
      const controls = NexusStore.getComplianceControls();
      const compliant = controls.filter(c => c.status === 'COMPLIANT').length;
      const partial = controls.filter(c => c.status === 'PARTIAL').length;
      const nonCompliant = controls.filter(c => c.status === 'NON_COMPLIANT').length;
      const overallScore = Math.round(compliant / controls.length * 100);

      const scoreEl = document.getElementById('complianceScore');
      const scoreColor = overallScore >= 80 ? '#10b981' : overallScore >= 60 ? '#f59e0b' : '#ef4444';
      scoreEl.textContent = overallScore + '%';
      scoreEl.style.color = scoreColor;
      scoreEl.style.borderColor = scoreColor;
      scoreEl.style.background = scoreColor + '15';

      const frameworks = ['SOC2', 'GDPR', 'ISO27001'];
      document.getElementById('frameworkScores').innerHTML = frameworks.map(fw => {
        const fwControls = controls.filter(c => c.framework === fw);
        const fwCompliant = fwControls.filter(c => c.status === 'COMPLIANT').length;
        const fwScore = fwControls.length > 0 ? Math.round(fwCompliant / fwControls.length * 100) : 0;
        const c = fwScore >= 80 ? '#10b981' : fwScore >= 60 ? '#f59e0b' : '#ef4444';
        return `<div style="text-align:center;">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;">${fw}</div>
          <div style="font-size:28px;font-weight:800;color:${c}">${fwScore}%</div>
          <div style="height:4px;background:var(--bg-tertiary);border-radius:2px;margin-top:4px;overflow:hidden;">
            <div style="height:100%;width:${fwScore}%;background:${c};border-radius:2px;"></div>
          </div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${fwCompliant}/${fwControls.length} controls</div>
        </div>`;
      }).join('');

      document.getElementById('compStats').innerHTML = `
        <div class="card stat-card"><div class="stat-value">${controls.length}</div><div class="stat-label">Total Controls</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:#10b981">${compliant}</div><div class="stat-label">Compliant</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:#f59e0b">${partial}</div><div class="stat-label">Partial</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:#ef4444">${nonCompliant}</div><div class="stat-label">Non-Compliant</div></div>
      `;

      renderTab();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderTab();
    }

    function renderTab() {
      const c = document.getElementById('tabContent');
      switch(currentTab) {
        case 'controls': renderControls(c); break;
        case 'secrets': renderSecrets(c); break;
        case 'audit': renderAudit(c); break;
        case 'drp': renderDR(c); break;
      }
    }

    function renderControls(container) {
      const controls = NexusStore.getComplianceControls();
      const statusColors = { COMPLIANT: '#10b981', PARTIAL: '#f59e0b', NON_COMPLIANT: '#ef4444' };
      const statusIcons = { COMPLIANT: '✅', PARTIAL: '⚠️', NON_COMPLIANT: '❌' };

      const frameworks = ['SOC2', 'GDPR', 'ISO27001'];
      container.innerHTML = frameworks.map(fw => {
        const fwControls = controls.filter(c => c.framework === fw);
        return `
        <div style="margin-bottom:24px;">
          <h3 style="font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">${fw}</h3>
          ${fwControls.map(ctrl => `
            <div class="card" style="margin-bottom:8px;border-left:3px solid ${statusColors[ctrl.status]}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                    <span style="font-size:14px;">${statusIcons[ctrl.status]}</span>
                    <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">${ctrl.id}</span>
                    <span style="font-size:11px;padding:1px 6px;border-radius:8px;background:var(--bg-tertiary);color:var(--text-muted);">${ctrl.category}</span>
                  </div>
                  <div style="font-weight:600;font-size:14px;margin-bottom:4px;">${ctrl.control}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">📋 ${ctrl.evidence}</div>
                  <div style="font-size:11px;color:var(--text-muted);display:flex;gap:12px;">
                    <span>Owner: ${ctrl.owner}</span>
                    <span>Reviewed: ${formatTime(ctrl.last_reviewed)}</span>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                  ${statusBadge(ctrl.status)}
                  ${riskBadge(ctrl.risk)}
                  ${ctrl.status !== 'COMPLIANT' ? `<button class="btn btn-sm btn-outline" onclick="updateControl('${ctrl.id}','COMPLIANT')">Mark Compliant</button>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>`;
      }).join('');
    }

    function renderSecrets(container) {
      const statusColors = { VALID: '#10b981', ROTATION_DUE: '#f59e0b', EXPIRED: '#ef4444' };
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🔐 Secrets Vault</h3>
            <div style="font-size:12px;color:var(--text-muted);">Managed via HashiCorp Vault integration</div>
          </div>
          <div style="overflow-x:auto;">
            <table class="table">
              <thead><tr><th>Secret</th><th>Engine</th><th>Last Rotated</th><th>Policy</th><th>Status</th><th>Env</th><th>Actions</th></tr></thead>
              <tbody>
                ${secrets.map(s => `
                  <tr>
                    <td style="font-family:var(--font-mono);font-weight:600;font-size:12px;">${s.name}</td>
                    <td>${s.engine}</td>
                    <td style="font-size:12px;">${formatTime(s.last_rotated)}</td>
                    <td style="font-size:12px;">${s.rotation_policy}</td>
                    <td><span style="background:${statusColors[s.status]}20;color:${statusColors[s.status]};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${s.status}</span></td>
                    <td style="font-size:12px;">${s.environment}</td>
                    <td><button class="btn btn-sm btn-outline" onclick="rotateSecret('${s.name}')">🔄 Rotate</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderAudit(container) {
      const logs = NexusStore.getLogs().slice(0, 30);
      container.innerHTML = `
        <div class="card">
          <div class="card-header"><h3 class="card-title">📋 System Audit Log</h3></div>
          <div style="max-height:600px;overflow-y:auto;">
            ${logs.map(l => `
              <div style="padding:8px 16px;border-bottom:1px solid var(--border-color);display:flex;gap:12px;align-items:center;">
                <span style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);min-width:140px;">${formatTime(l.timestamp)}</span>
                <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:var(--bg-tertiary);color:var(--accent);min-width:80px;text-align:center;">${l.type}</span>
                <span style="font-size:12px;color:var(--text-secondary);flex:1;">${l.message}</span>
                <span style="font-size:11px;color:var(--text-muted);">${l.agent || 'system'}</span>
              </div>
            `).join('')}
            ${logs.length === 0 ? '<div style="padding:20px;text-align:center;color:var(--text-muted);">No audit logs yet</div>' : ''}
          </div>
        </div>
      `;
    }

    function renderDR(container) {
      container.innerHTML = `
        <!-- DR Overview -->
        <div class="grid grid-2" style="margin-bottom:16px;">
          <div class="card">
            <h4 style="margin-bottom:12px;">🏗️ Infrastructure</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div><div style="font-size:11px;color:var(--text-muted);">Primary Region</div><div style="font-weight:600;font-size:13px;">${drStatus.primary_region}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">DR Region</div><div style="font-weight:600;font-size:13px;">${drStatus.dr_region}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">Replication Lag</div><div style="font-weight:600;font-size:13px;color:${parseFloat(drStatus.replication_lag) < 5 ? '#10b981' : '#f59e0b'}">${drStatus.replication_lag}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">RPO / RTO</div><div style="font-weight:600;font-size:13px;">${drStatus.rpo} / ${drStatus.rto}</div></div>
            </div>
          </div>
          <div class="card">
            <h4 style="margin-bottom:12px;">🧪 DR Testing</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div><div style="font-size:11px;color:var(--text-muted);">Last DR Test</div><div style="font-weight:600;font-size:13px;">${formatTime(drStatus.last_dr_test)}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">Result</div><div style="font-weight:600;font-size:13px;">${statusBadge(drStatus.dr_test_result === 'PASS' ? 'PASS' : 'FAIL')}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">Last Backup</div><div style="font-weight:600;font-size:13px;">${formatTime(drStatus.last_backup)}</div></div>
              <div><div style="font-size:11px;color:var(--text-muted);">Backup Size</div><div style="font-weight:600;font-size:13px;">${drStatus.backup_size}</div></div>
            </div>
            <button class="btn btn-sm btn-outline" style="margin-top:12px;" onclick="triggerDRTest()">🧪 Trigger DR Test</button>
          </div>
        </div>

        <!-- Backup History -->
        <div class="card">
          <div class="card-header"><h3 class="card-title">📦 Backup History</h3></div>
          <div style="overflow-x:auto;">
            <table class="table">
              <thead><tr><th>ID</th><th>Type</th><th>Size</th><th>Created</th><th>Status</th><th>Retention</th><th>Actions</th></tr></thead>
              <tbody>
                ${drStatus.backups.map(b => `
                  <tr>
                    <td style="font-family:var(--font-mono);font-size:12px;">${b.id}</td>
                    <td>${b.type}</td>
                    <td>${b.size}</td>
                    <td style="font-size:12px;">${formatTime(b.created)}</td>
                    <td>${statusBadge(b.status)}</td>
                    <td>${b.retention}</td>
                    <td><button class="btn btn-sm btn-outline" onclick="showToast('Restore initiated from ${b.id}','info')">↩ Restore</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateControl(ctrlId, newStatus) {
      const controls = NexusStore.getComplianceControls();
      const ctrl = controls.find(c => c.id === ctrlId);
      if (ctrl) {
        ctrl.status = newStatus;
        ctrl.last_reviewed = new Date().toISOString();
        ctrl.evidence += ' [Updated by operator]';
        NexusStore.setComplianceControls(controls);
        render();
        showToast(`Control ${ctrlId} marked as ${newStatus}`, 'success');
      }
    }

    function rotateSecret(name) {
      showLoading(`Rotating ${name}...`);
      setTimeout(() => {
        const s = secrets.find(x => x.name === name);
        if (s) { s.last_rotated = new Date().toISOString(); s.status = 'VALID'; }
        hideLoading();
        render();
        showToast(`${name} rotated successfully`, 'success');
      }, 1500);
    }

    function runComplianceAudit() {
      showLoading('Running compliance audit...');
      setTimeout(() => {
        hideLoading();
        render();
        showToast('Compliance audit complete — see updated scores', 'success');
      }, 2500);
    }

    function triggerDRTest() {
      showLoading('Running disaster recovery test...');
      setTimeout(() => {
        drStatus.last_dr_test = new Date().toISOString();
        drStatus.dr_test_result = 'PASS';
        hideLoading();
        render();
        showToast('DR test completed — PASS', 'success');
      }, 3000);
    }

    render();
  </script>
</body>
</html>
