<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Subscription</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">Subscription Management</h1>
        <p class="page-subtitle">Manage plan, limits, and billing</p>
      </div>
    </div>
    <div class="card" id="currentPlanCard" style="margin-bottom: 24px;"></div>
    <div class="subscription-grid" id="planGrid"></div>
    <div class="card" style="margin-top: 24px;">
      <div class="card-header"><h3 class="card-title">Usage vs Limits</h3></div>
      <div id="usageLimits"></div>
    </div>
  </div>
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmTitle">Change Plan</h3>
        <button class="modal-close" onclick="document.getElementById('confirmModal').classList.remove('show')">&times;</button>
      </div>
      <div class="modal-body" id="confirmBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('confirmModal').classList.remove('show')">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn" onclick="confirmPlanChange()">Confirm</button>
      </div>
    </div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData(); createNavigation('subscription');

    // SYSTEM_ADMIN only page
    if (!TenantState.isSystemAdmin()) {
      document.getElementById('app').innerHTML = `
        <div class="empty-state" style="margin-top:80px">
          <div class="empty-state-icon">🔒</div>
          <h3 class="empty-state-title">Access Denied</h3>
          <p class="empty-state-text">Subscription management is only available to System Admins.</p>
          <a href="dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        </div>`;
    } else {

    let pendingPlan = null;
    const planOrder = ['BASIC','STANDARD','PREMIUM'];
    const prices = {BASIC:'$29/mo',STANDARD:'$99/mo',PREMIUM:'$299/mo'};

    // Admin picks which tenant to manage
    function getActiveTenant() {
      const sel = document.getElementById('adminSubTenantSelect')?.value;
      if (sel) return TenantState.getTenants().find(t => t.tenant_id === sel) || TenantState.getTenants()[0];
      return TenantState.getTenants()[0];
    }

    function render() {
      // Inject tenant picker for admin
      let picker = document.getElementById('adminSubPicker');
      if (!picker) {
        picker = document.createElement('div');
        picker.id = 'adminSubPicker';
        picker.style.cssText = 'margin-bottom:16px;display:flex;align-items:center;gap:12px';
        const appEl = document.getElementById('app');
        appEl.insertBefore(picker, appEl.querySelector('.card, #currentPlanCard')?.parentNode || appEl.children[1]);
      }
      const allTenants = TenantState.getTenants();
      const curT = getActiveTenant();
      picker.innerHTML = `
        <label style="font-size:13px;font-weight:600;color:var(--text-secondary)">Manage tenant:</label>
        <select id="adminSubTenantSelect" class="form-select" style="max-width:220px;padding:6px 10px;font-size:13px" onchange="render()">
          ${allTenants.map(at => `<option value="${at.tenant_id}" ${at.tenant_id === curT.tenant_id ? 'selected' : ''}>${at.name}</option>`).join('')}
        </select>
        <span class="status-badge" style="background:#a855f720;color:#a855f7;border:1px solid #a855f740">Admin View</span>
      `;

      const t = curT; if(!t) return;
      const cl = TenantState.getSubscriptionLimits(t.subscription);
      document.getElementById('currentPlanCard').innerHTML = `
        <div class="card-header"><h3 class="card-title">${cl.icon} Current: ${cl.label}</h3>
        <span class="status-badge" style="background:${cl.color}20;color:${cl.color};border:1px solid ${cl.color}40">${t.subscription}</span></div>
        <div class="grid grid-4">
          <div><span style="font-size:12px;color:var(--text-muted);display:block">Tenant</span><span style="font-size:15px;font-weight:600">${t.name}</span></div>
          <div><span style="font-size:12px;color:var(--text-muted);display:block">Region</span><span style="font-size:15px;font-weight:600">🌍 ${t.region}</span></div>
          <div><span style="font-size:12px;color:var(--text-muted);display:block">Users</span><span style="font-size:15px;font-weight:600">${t.users}/${cl.users}</span></div>
          <div><span style="font-size:12px;color:var(--text-muted);display:block">API</span><span style="font-size:15px;font-weight:600">${t.api_usage.toLocaleString()}/${cl.api.toLocaleString()}</span></div>
        </div>`;

      document.getElementById('planGrid').innerHTML = planOrder.map(plan => {
        const l = TenantState.getSubscriptionLimits(plan); const cur = t.subscription===plan;
        const isUp = planOrder.indexOf(plan) > planOrder.indexOf(t.subscription);
        return `<div class="subscription-card ${cur?'current':''}">
          <span class="subscription-card-icon">${l.icon}</span>
          <div class="subscription-card-name">${l.label}</div>
          <div class="subscription-card-price">${prices[plan]}</div>
          <ul class="subscription-card-features">
            <li>👥 ${l.users.toLocaleString()} users</li><li>📁 ${l.projects} projects</li>
            <li>🤖 ${l.agents} agents</li><li>💾 ${l.storage} GB</li><li>🔌 ${l.api.toLocaleString()} API/mo</li>
          </ul>
          ${cur?'<button class="btn btn-outline" disabled style="width:100%;justify-content:center">Current</button>'
            :`<button class="btn ${isUp?'btn-primary':'btn-warning'}" style="width:100%;justify-content:center" onclick="requestChange('${plan}')">${isUp?'⬆ Upgrade':'⬇ Downgrade'}</button>`}
        </div>`;
      }).join('');

      const items = [
        {label:'Users',used:t.users,limit:cl.users,icon:'👥'},{label:'Projects',used:t.projects,limit:cl.projects,icon:'📁'},
        {label:'Agents',used:t.agents,limit:cl.agents,icon:'🤖'},{label:'Storage (GB)',used:t.storage_used,limit:cl.storage,icon:'💾'},
        {label:'API Calls',used:t.api_usage,limit:cl.api,icon:'🔌'}
      ];
      document.getElementById('usageLimits').innerHTML = items.map(i => {
        const pct = Math.min((i.used/i.limit)*100,100);
        const lv = pct>=90?'critical':pct>=70?'high':pct>=50?'medium':'low';
        return `<div class="resource-gauge"><div class="resource-gauge-header">
          <span class="resource-gauge-label">${i.icon} ${i.label}</span>
          <span class="resource-gauge-value">${i.used.toLocaleString()}/${i.limit.toLocaleString()}</span></div>
          <div class="resource-gauge-bar"><div class="resource-gauge-fill ${lv}" style="width:${pct}%"></div></div></div>`;
      }).join('');
    }

    function requestChange(plan) {
      const t = getActiveTenant(); pendingPlan = plan;
      const nl = TenantState.getSubscriptionLimits(plan);
      const isUp = planOrder.indexOf(plan) > planOrder.indexOf(t.subscription);
      document.getElementById('confirmTitle').textContent = isUp ? '⬆ Upgrade' : '⬇ Downgrade';
      document.getElementById('confirmBody').innerHTML = `<p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">
        ${isUp?'Upgrade':'Downgrade'} <strong>${t.name}</strong> to <strong>${nl.label}</strong>?</p>
        <div style="background:var(--bg-tertiary);padding:14px;border-radius:var(--radius);border:1px solid var(--border)">
        <p style="font-size:13px;color:var(--text-secondary)">👥 ${nl.users.toLocaleString()} users · 📁 ${nl.projects} projects · 🤖 ${nl.agents} agents · 💾 ${nl.storage}GB · 🔌 ${nl.api.toLocaleString()} API</p></div>`;
      document.getElementById('confirmModal').classList.add('show');
    }

    function confirmPlanChange() {
      if(!pendingPlan) return;
      TenantState.updateTenant(getActiveTenant().tenant_id, {subscription:pendingPlan});
      document.getElementById('confirmModal').classList.remove('show');
      showToast('Plan updated to '+TenantState.getSubscriptionLimits(pendingPlan).label,'success');
      pendingPlan=null; render();
    }
    render();
    } // end admin else
  </script>
</body>
</html>
