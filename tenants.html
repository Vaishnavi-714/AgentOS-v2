<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Tenants Admin</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">Tenant Administration</h1>
        <p class="page-subtitle">Manage all registered tenants</p>
      </div>
      <div class="page-actions">
        <a href="register-tenant.html" class="btn btn-primary">+ Register Tenant</a>
        <button class="btn btn-outline btn-sm" onclick="resetTenants()">Reset Data</button>
      </div>
    </div>
    <div class="grid grid-4" id="tenantStats" style="margin-bottom:24px"></div>
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">All Tenants</h3>
        <select id="statusFilter" class="form-select" style="max-width:160px;padding:6px 10px;font-size:12px" onchange="render()">
          <option value="">All Status</option>
          <option value="ACTIVE">Active</option>
          <option value="SUSPENDED">Suspended</option>
          <option value="REGISTERED">Registered</option>
        </select>
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>Tenant</th><th>Domain</th><th>Status</th><th>Plan</th><th>Users</th><th>Region</th><th>Actions</th></tr></thead>
          <tbody id="tenantsTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="viewModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="viewTitle">Tenant Details</h3>
        <button class="modal-close" onclick="document.getElementById('viewModal').classList.remove('show')">&times;</button>
      </div>
      <div class="modal-body" id="viewBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('viewModal').classList.remove('show')">Close</button>
      </div>
    </div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData(); createNavigation('tenants');

    // SYSTEM_ADMIN only page
    if (!TenantState.isSystemAdmin()) {
      document.getElementById('app').innerHTML = `
        <div class="empty-state" style="margin-top:80px">
          <div class="empty-state-icon">🔒</div>
          <h3 class="empty-state-title">Access Denied</h3>
          <p class="empty-state-text">Tenant administration is only available to System Admins.</p>
          <a href="dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        </div>`;
      return;
    }

    function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

    function render() {
      const tenants = TenantState.getTenants();
      const filter = document.getElementById('statusFilter')?.value || '';
      const filtered = filter ? tenants.filter(t=>t.status===filter) : tenants;
      const active = tenants.filter(t=>t.status==='ACTIVE').length;
      const totalUsers = tenants.reduce((s,t)=>s+(t.users||0),0);

      document.getElementById('tenantStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Total Tenants</span><span class="stat-value">${tenants.length}</span></div>
        <div class="stat-card"><span class="stat-label">Active</span><span class="stat-value" style="color:var(--success)">${active}</span></div>
        <div class="stat-card"><span class="stat-label">Total Users</span><span class="stat-value">${totalUsers}</span></div>
        <div class="stat-card"><span class="stat-label">Suspended</span><span class="stat-value" style="color:var(--danger)">${tenants.filter(t=>t.status==='SUSPENDED').length}</span></div>`;

      document.getElementById('tenantsTable').innerHTML = filtered.map(t => {
        const sc = {ACTIVE:'#10b981',SUSPENDED:'#ef4444',REGISTERED:'#f59e0b',PROVISIONING:'#3b82f6'};
        const c = sc[t.status]||'#6b7280';
        const pl = TenantState.getSubscriptionLimits(t.subscription);
        return `<tr>
          <td style="font-weight:600;color:var(--text-primary)">${esc(t.name)}</td>
          <td style="font-size:12px">${esc(t.domain)}</td>
          <td><span class="status-badge" style="background:${c}20;color:${c};border:1px solid ${c}40">${t.status}</span></td>
          <td><span class="status-badge" style="background:${pl.color}20;color:${pl.color};border:1px solid ${pl.color}40">${pl.icon} ${pl.label}</span></td>
          <td>${t.users}</td>
          <td style="font-size:12px">🌍 ${t.region}</td>
          <td style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-outline btn-sm" onclick="viewTenant('${t.tenant_id}')">View</button>
            ${t.status==='ACTIVE'?`<button class="btn btn-danger btn-sm" onclick="suspendTenant('${t.tenant_id}')">Suspend</button>`:''}
            ${t.status==='SUSPENDED'?`<button class="btn btn-success btn-sm" onclick="activateTenant('${t.tenant_id}')">Activate</button>`:''}
            ${t.status==='REGISTERED'?`<button class="btn btn-primary btn-sm" onclick="provisionTenant('${t.tenant_id}')">Provision</button>`:''}
          </td>
        </tr>`;
      }).join('');
    }

    function viewTenant(id) {
      const t = TenantState.getTenants().find(x=>x.tenant_id===id); if(!t) return;
      const pl = TenantState.getSubscriptionLimits(t.subscription);
      const users = TenantState.getTenantUsers(id);
      document.getElementById('viewTitle').textContent = t.name + ' — Details';
      document.getElementById('viewBody').innerHTML = `
        <div class="grid grid-2" style="gap:16px;margin-bottom:20px">
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Tenant ID</span><span style="font-size:14px;font-weight:600">${t.tenant_id}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Domain</span><span style="font-size:14px;font-weight:600">${t.domain}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Type</span><span style="font-size:14px;font-weight:600">${t.tenant_type||'N/A'}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Region</span><span style="font-size:14px;font-weight:600">🌍 ${t.region}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Admin</span><span style="font-size:14px;font-weight:600">${t.admin_name||'N/A'}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Admin Email</span><span style="font-size:14px;font-weight:600">${t.admin_email||'N/A'}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Plan</span><span style="font-size:14px;font-weight:600">${pl.icon} ${pl.label}</span></div>
          <div><span style="font-size:11px;color:var(--text-muted);display:block">Created</span><span style="font-size:14px;font-weight:600">${t.created_at?new Date(t.created_at).toLocaleDateString():'N/A'}</span></div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:16px">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:600">RESOURCE USAGE</p>
          <div class="grid grid-3" style="gap:12px">
            <div style="text-align:center;padding:12px;background:var(--bg-tertiary);border-radius:var(--radius)"><span style="font-size:20px;font-weight:700;display:block">${t.users}</span><span style="font-size:11px;color:var(--text-muted)">Users</span></div>
            <div style="text-align:center;padding:12px;background:var(--bg-tertiary);border-radius:var(--radius)"><span style="font-size:20px;font-weight:700;display:block">${t.projects}</span><span style="font-size:11px;color:var(--text-muted)">Projects</span></div>
            <div style="text-align:center;padding:12px;background:var(--bg-tertiary);border-radius:var(--radius)"><span style="font-size:20px;font-weight:700;display:block">${t.agents}</span><span style="font-size:11px;color:var(--text-muted)">Agents</span></div>
          </div>
        </div>
        ${users.length>0?`<div style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:600">USERS (${users.length})</p>
          ${users.slice(0,5).map(u=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
            <span style="color:var(--text-primary)">${esc(u.name)}</span><span style="color:var(--text-muted)">${u.role}</span></div>`).join('')}
        </div>`:''}`;
      document.getElementById('viewModal').classList.add('show');
    }

    function suspendTenant(id) {
      if(!confirm('Suspend this tenant? Users will lose access.'))return;
      TenantState.updateTenant(id,{status:'SUSPENDED'});
      showToast('Tenant suspended','warning'); render();
    }
    function activateTenant(id) {
      TenantState.updateTenant(id,{status:'ACTIVE'});
      showToast('Tenant activated','success'); render();
    }
    function provisionTenant(id) {
      sessionStorage.setItem('nexus_provisioning_tenant',id);
      window.location.href='tenant-provisioning.html';
    }
    function resetTenants() {
      if(!confirm('Reset all tenant data?'))return;
      TenantState.resetTenantData(); showToast('Tenant data reset','info'); render();
    }
    render();
  </script>
</body>
</html>
