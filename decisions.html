<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Decision Ledger</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Decision Ledger</h1>
        <p class="page-subtitle">Immutable, append-only governance audit trail</p>
      </div>
      <div class="page-actions">
        <span class="chip" style="color:var(--success); border-color:var(--success)40;">🔒 Append-Only · Immutable</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="decStats" style="margin-bottom:24px;"></div>

    <!-- Filter -->
    <div class="filter-bar">
      <select class="form-select" id="filterType" onchange="renderDecisions()">
        <option value="">All Types</option>
        <option value="ARCHITECTURE">Architecture</option>
        <option value="SECURITY">Security</option>
        <option value="DATA_MODEL">Data Model</option>
        <option value="OPERATIONAL">Operational</option>
      </select>
      <select class="form-select" id="filterHuman" onchange="renderDecisions()">
        <option value="">All Reviews</option>
        <option value="true">Human Reviewed</option>
        <option value="false">Agent Only</option>
      </select>
    </div>

    <!-- Decision List -->
    <div id="decisionList"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('decisions');

    function renderDecisions() {
      let decisions = NexusStore.getDecisions();
      const filterType = document.getElementById('filterType').value;
      const filterHuman = document.getElementById('filterHuman').value;

      if (filterType) decisions = decisions.filter(d => d.type === filterType);
      if (filterHuman === 'true') decisions = decisions.filter(d => d.human_reviewed);
      if (filterHuman === 'false') decisions = decisions.filter(d => !d.human_reviewed);

      const all = NexusStore.getDecisions();
      const typeCount = {};
      all.forEach(d => { typeCount[d.type] = (typeCount[d.type] || 0) + 1; });

      document.getElementById('decStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Total Decisions</span><span class="stat-value">${all.length}</span></div>
        <div class="stat-card"><span class="stat-label">Human Reviewed</span><span class="stat-value">${all.filter(d=>d.human_reviewed).length}</span><span class="stat-change">${all.length ? Math.round(all.filter(d=>d.human_reviewed).length/all.length*100) : 0}%</span></div>
        <div class="stat-card"><span class="stat-label">Architecture</span><span class="stat-value">${typeCount['ARCHITECTURE']||0}</span></div>
        <div class="stat-card"><span class="stat-label">Security</span><span class="stat-value">${typeCount['SECURITY']||0}</span></div>
      `;

      if (decisions.length === 0) {
        document.getElementById('decisionList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📜</div><h3 class="empty-state-title">No Decisions Found</h3></div>';
        return;
      }

      // Sort by timestamp descending
      decisions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      document.getElementById('decisionList').innerHTML = decisions.map(dec => {
        const typeColors = { ARCHITECTURE: 'var(--accent)', SECURITY: 'var(--danger)', DATA_MODEL: 'var(--warning)', OPERATIONAL: 'var(--info)' };
        const color = typeColors[dec.type] || 'var(--text-muted)';
        return `
          <div class="card fade-in" style="border-left:3px solid ${color};">
            <div class="card-header">
              <div>
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                  <span style="font-family:var(--mono); font-size:14px; color:var(--accent); font-weight:700;">${dec.decision_id}</span>
                  <span class="tag" style="color:${color}; border-color:${color}40; background:${color}10;">${dec.type}</span>
                  ${dec.human_reviewed ? '<span class="chip" style="color:var(--success); border-color:var(--success)40;">👤 Human Reviewed</span>' : '<span class="chip">🤖 Agent Decision</span>'}
                  <span class="chip" style="color:var(--text-muted);">🔒 Immutable</span>
                </div>
              </div>
              <span style="font-size:12px; color:var(--text-muted)">${formatTime(dec.timestamp)}</span>
            </div>

            <div style="margin-bottom:12px;">
              <span class="form-label">Context</span>
              <p style="font-size:14px; color:var(--text-primary); font-weight:500;">${escapeHtml(dec.context)}</p>
            </div>

            <div style="margin-bottom:12px;">
              <span class="form-label">Options Considered</span>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                ${dec.options_considered.map(o => `
                  <span class="chip" style="${o === dec.final_choice ? 'color:var(--success); border-color:var(--success); background:var(--success)15;' : ''}">${o === dec.final_choice ? '✓ ' : ''}${escapeHtml(o)}</span>
                `).join('')}
              </div>
            </div>

            <div style="padding:12px; background:var(--bg-tertiary); border-radius:var(--radius); margin-bottom:12px;">
              <span class="form-label" style="color:var(--success)">Final Decision</span>
              <p style="font-size:14px; font-weight:600; color:var(--text-primary);">${escapeHtml(dec.final_choice)}</p>
            </div>

            <div style="margin-bottom:12px;">
              <span class="form-label">Reasoning</span>
              <p style="font-size:13px; color:var(--text-secondary)">${escapeHtml(dec.reasoning)}</p>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <span class="form-label">Decided By</span>
                <span style="font-size:13px;">${escapeHtml(dec.decided_by_name || dec.decided_by)}</span>
              </div>
              ${dec.references && dec.references.length > 0 ? `
                <div>
                  <span class="form-label">References</span>
                  <div style="display:flex; gap:4px;">
                    ${dec.references.map(r => `<span class="tag" style="font-family:var(--mono); font-size:11px;">${r}</span>`).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    renderDecisions();
  </script>
</body>
</html>
