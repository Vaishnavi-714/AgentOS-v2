<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — System Flow</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .stage-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      padding: 12px;
      margin-top: 12px;
    }

    .task-title-live {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .task-action-live {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .execution-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .execution-cell {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 8px;
    }

    .execution-cell-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .execution-cell-value {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .stage-output {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .arch-split-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .module-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
    }

    .dev-stage-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .dev-module-group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      padding: 10px;
    }

    .dev-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .dev-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
    }

    .assignment-lines {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .subtle-empty {
      border: 1px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      background: var(--bg-tertiary);
    }

    .phase-running {
      border-left: 3px solid var(--info);
      box-shadow: 0 0 0 1px var(--info)25;
    }

    .phase-completed {
      border-left: 3px solid var(--success);
    }

    .phase-pending {
      border-left: 3px solid var(--border);
    }

    .handoff-strip {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .handoff-arrow {
      color: var(--accent);
      font-weight: 700;
    }

    .runtime-agent.active {
      border-color: var(--success)70;
      box-shadow: 0 0 0 1px var(--success)35, 0 0 18px var(--success)20;
    }

    .runtime-agent.inactive {
      opacity: 0.78;
      border-style: dashed;
    }

    .ai-task-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .ai-task-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
    }

    .ai-task-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .ai-task-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .scrum-dashboard {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
    }

    .scrum-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .scrum-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      padding: 8px;
      min-height: 130px;
    }

    .scrum-card h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .scrum-row {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.45;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .scrum-row:last-child {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    .scrum-empty {
      font-size: 12px;
      color: var(--text-muted);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 8px;
      background: var(--bg-tertiary);
    }

    .scrum-connections {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .escalation-route {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--warning)40;
      border-radius: var(--radius);
      background: var(--warning)10;
      color: var(--text-secondary);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .escalation-route strong {
      color: var(--warning);
      margin-right: 4px;
    }

    .orchestration-popup-stack {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 2400;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(420px, calc(100vw - 24px));
      pointer-events: none;
    }

    .orchestration-popup {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      animation: popupSlideIn 0.25s ease;
    }

    .orchestration-popup .label {
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .orchestration-popup .message {
      font-size: 12px;
      color: var(--text-primary);
      line-height: 1.45;
    }

    .orchestration-popup .time {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .popup-task_start { border-left: 3px solid var(--info); }
    .popup-task_complete { border-left: 3px solid var(--success); }
    .popup-handoff { border-left: 3px solid var(--accent); }
    .popup-escalation { border-left: 3px solid var(--warning); }

    .testcase-bridge-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .testcase-column {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
    }

    .testcase-list {
      max-height: 190px;
      overflow-y: auto;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .testcase-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      padding: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .testcase-flow-strip {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      padding: 8px;
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--text-secondary);
    }

    @keyframes popupSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1100px) {
      .execution-meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .arch-split-grid,
      .dev-stage-grid,
      .dev-grid,
      .ai-task-grid,
      .scrum-grid {
        grid-template-columns: 1fr;
      }

      .testcase-bridge-grid {
        grid-template-columns: 1fr;
      }

      .handoff-strip {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">System Flow</h1>
        <p class="page-subtitle">End-to-end AI operating pipeline from requirements to release</p>
      </div>
      <div class="page-actions">
        <div style="display:flex; gap:12px; align-items:center;">
          <div id="projectSelector"></div>
          <button class="btn btn-outline btn-sm" onclick="handleRestartPipeline()" id="restartPipelineBtn" style="display:none;">Restart Pipeline</button>
        </div>
      </div>
    </div>

    <div class="grid grid-4" id="flowStats" style="margin-bottom:20px;"></div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">BA → AI Pipeline → PO → (Test Case Generator + Chief Architect + Scrum) → Module Architects → Developers → QA → Release</h3>
        <span class="tag">Connected System Flow</span>
      </div>
      <div id="systemFlowStack" class="flow-stack"></div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/orchestration-runtime.js"></script>
  <script>
    seedNexusData();
    createNavigation('system-flow');
    let currentProjectId = createProjectSelector('projectSelector', renderSystemFlow);
    let flowTicker = null;

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatTimer(seconds) {
      const safe = Math.max(0, Math.floor(seconds || 0));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function toPresenceBadge(status) {
      return statusBadge(status === 'ACTIVE' ? 'ACTIVE' : 'IDLE');
    }

    function flowStatus(snapshot, index) {
      if (index < snapshot.phaseIndex) return 'COMPLETED';
      if (index === snapshot.phaseIndex) return 'EXECUTING';
      return 'PENDING';
    }

    function flowCardClass(status) {
      if (status === 'COMPLETED') return 'phase-completed';
      if (status === 'EXECUTING') return 'phase-running';
      return 'phase-pending';
    }

    function renderAgentPanel(agent) {
      const stateTone = agent.status === 'ACTIVE' ? 'active' : 'inactive';
      return `
        <div class="stage-panel runtime-agent ${stateTone}">
          <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;">
            <strong>${escapeHtml(agent.name)}</strong>
            ${toPresenceBadge(agent.status)}
          </div>
          <div class="task-title-live">Task: ${escapeHtml(agent.currentTaskName || 'Awaiting assignment')}</div>
          <div class="task-action-live">Action: ${escapeHtml(agent.currentAction || 'Awaiting assignment')}</div>
          <div class="execution-meta">
            <div class="execution-cell">
              <div class="execution-cell-label">Task ID</div>
              <div class="execution-cell-value" style="font-family:var(--mono)">${escapeHtml(agent.currentTaskId || 'N/A')}</div>
            </div>
            <div class="execution-cell">
              <div class="execution-cell-label">Status</div>
              <div class="execution-cell-value">${statusBadge(agent.stageStatus || 'PENDING')}</div>
            </div>
            <div class="execution-cell">
              <div class="execution-cell-label">Timer</div>
              <div class="execution-cell-value">${formatTimer(agent.timerSec)}</div>
            </div>
            <div class="execution-cell">
              <div class="execution-cell-label">Tokens</div>
              <div class="execution-cell-value">${agent.tokens}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAiPipelinePanel(snapshot) {
      const tasks = snapshot.aiPipelineTasks || [];
      return `
        <div class="ai-task-grid">
          ${tasks.map((task) => `
            <div class="ai-task-card">
              <div class="ai-task-title">${escapeHtml(task.name)}</div>
              ${statusBadge(task.status)}
              <div class="ai-task-meta">
                <span>Timer ${formatTimer(task.timerSec)}</span>
                <span>Tokens ${task.tokens}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderScrumDashboard(snapshot) {
      const scrum = snapshot.scrum || { activeTasks: [], escalations: [], monitoring: [] };

      return `
        <div class="scrum-dashboard">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <strong>Scrum Master Controller Dashboard</strong>
            ${statusBadge('ACTIVE')}
          </div>
          <div class="scrum-connections">
            <span class="tag">Connected: Module Architect - Auth</span>
            <span class="tag">Connected: Module Architect - Payments</span>
            <span class="tag">Connected: Module Architect - Orders</span>
            <span class="tag">Connected: Dev Auth 01</span>
            <span class="tag">Connected: Dev Auth 02</span>
            <span class="tag">Connected: Dev Pay 01</span>
          </div>
          <div class="scrum-grid">
            <div class="scrum-card">
              <h4>Active Tasks</h4>
              ${scrum.activeTasks.length ? scrum.activeTasks.map((item) => `
                <div class="scrum-row">
                  <strong>${escapeHtml(item.agent)}</strong><br>
                  ${escapeHtml(item.taskId)} - ${escapeHtml(item.task)}<br>
                  Target: ${escapeHtml(item.completionTarget)}
                </div>
              `).join('') : '<div class="scrum-empty">No active tasks in this slice</div>'}
            </div>
            <div class="scrum-card">
              <h4>Escalations</h4>
              ${scrum.escalations.length ? scrum.escalations.map((esc) => `
                <div class="scrum-row">
                  <strong>${escapeHtml(esc.id)}</strong><br>
                  ${escapeHtml(esc.summary)}<br>
                  Route: ${escapeHtml(esc.route.join(' -> '))}
                </div>
              `).join('') : '<div class="scrum-empty">No open escalation</div>'}
            </div>
            <div class="scrum-card">
              <h4>Monitoring Panel</h4>
              ${scrum.monitoring.slice(0, 5).map((row) => `
                <div class="scrum-row">
                  <strong>${escapeHtml(row.agent)}</strong><br>
                  ${escapeHtml(row.taskId)}<br>
                  ${escapeHtml(row.status)}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderTestCaseBridge(snapshot) {
      const flow = snapshot.testCaseFlow || {
        status: 'IDLE',
        acceptanceCriteria: [],
        cases: [],
        generatedCount: 0
      };
      const acceptance = flow.acceptanceCriteria || [];
      const testCases = flow.cases || [];

      return `
        <div class="stage-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <strong>Product Owner -> Test Case Generator -> Test Case Page -> QA Agent</strong>
            ${statusBadge(flow.status || 'IDLE')}
          </div>

          <div class="testcase-flow-strip">
            <span class="tag">Product Owner</span>
            <span>-></span>
            <span class="tag">Test Case Generator</span>
            <span>-></span>
            <span class="tag">Test Case Page</span>
            <span>-></span>
            <span class="tag">QA Agent</span>
            <span class="tag">Generated: ${testCases.length || flow.generatedCount || 0}</span>
          </div>

          <div class="testcase-bridge-grid">
            <div class="testcase-column">
              <div class="flow-io-title">Input: Acceptance Criteria</div>
              ${acceptance.length ? `
                <div class="testcase-list">
                  ${acceptance.slice(0, 10).map((item) => `
                    <div class="testcase-row">
                      <strong>${escapeHtml(item.storyId || 'Story')}</strong><br>
                      ${escapeHtml(item.criterion || 'Acceptance criteria')}
                    </div>
                  `).join('')}
                </div>
              ` : '<div class="subtle-empty">Acceptance criteria will appear here after Product Owner approval.</div>'}
            </div>
            <div class="testcase-column">
              <div class="flow-io-title">Output: Generated Test Cases</div>
              ${testCases.length ? `
                <div class="testcase-list">
                  ${testCases.slice(0, 10).map((testCase) => `
                    <div class="testcase-row">
                      <strong>${escapeHtml(testCase.id)}</strong> · ${escapeHtml(testCase.type)}<br>
                      ${escapeHtml(testCase.story || 'User Story')}<br>
                      ${statusBadge(testCase.status || 'PENDING')}
                    </div>
                  `).join('')}
                </div>
              ` : '<div class="subtle-empty">Generated test cases will appear here.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderDevelopersPhase(snapshot) {
      const devAuth01 = snapshot.agents.devAuth01;
      const devAuth02 = snapshot.agents.devAuth02;
      const devPay01 = snapshot.agents.devPay01;

      const route = (snapshot.escalationRoute && snapshot.escalationRoute.length)
        ? snapshot.escalationRoute.join(' -> ')
        : 'Developer -> Module Architect -> Scrum Master -> Chief Architect';

      return `
        <div class="dev-stage-grid" style="margin-top:12px;">
          <div class="dev-module-group">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <strong>Auth Developers</strong>
              <span class="tag">Parallel</span>
            </div>
            <div class="dev-grid">
              ${renderAgentPanel(devAuth01)}
              ${renderAgentPanel(devAuth02)}
            </div>
          </div>
          <div class="dev-module-group">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <strong>Payments Developers</strong>
              <span class="tag">Parallel</span>
            </div>
            <div class="dev-grid" style="grid-template-columns:1fr;">
              ${renderAgentPanel(devPay01)}
            </div>
          </div>
          <div class="dev-module-group">
            <strong>Escalation Route</strong>
            <div class="escalation-route">
              <strong>Flow:</strong> ${escapeHtml(route)}
            </div>
          </div>
        </div>
      `;
    }

    function renderPhaseDetails(snapshot, phase) {
      if (phase.id === 'ai_pipeline') {
        return renderAiPipelinePanel(snapshot);
      }

      if (phase.id === 'chief_scrum_parallel') {
        const testCaseGenerator = snapshot.agents.testCaseGenerator;
        const chief = snapshot.agents.chiefArchitect;
        const scrum = snapshot.agents.scrumMaster;
        return `
          ${testCaseGenerator ? renderAgentPanel(testCaseGenerator) : ''}
          ${renderTestCaseBridge(snapshot)}
          ${renderAgentPanel(chief)}
          <div class="stage-output">
            <span class="tag">Test Case Output: Positive</span>
            <span class="tag">Test Case Output: Negative</span>
            <span class="tag">Test Case Output: Edge</span>
            <span class="tag">Task: Extract acceptance criteria</span>
            <span class="tag">Task: Generate test cases</span>
            <span class="tag">Task: Publish to Test Case page</span>
            <span class="tag">Chief Output: Schema</span>
            <span class="tag">Chief Output: APIs</span>
            <span class="tag">Chief Output: Module breakdown</span>
            <span class="tag">Task: Designing DB Schema</span>
            <span class="tag">Task: Creating Use Case Diagram</span>
            <span class="tag">Task: Creating Class Diagram</span>
            <span class="tag">Task: Designing APIs</span>
            <span class="tag">Task: Defining system workflow</span>
          </div>
          ${renderAgentPanel(scrum)}
          ${renderScrumDashboard(snapshot)}
        `;
      }

      if (phase.id === 'module_architects_parallel') {
        return `
          <div class="arch-split-grid">
            ${renderAgentPanel(snapshot.agents.moduleArchitectAuth)}
            ${renderAgentPanel(snapshot.agents.moduleArchitectPayments)}
            ${renderAgentPanel(snapshot.agents.moduleArchitectOrders)}
          </div>
        `;
      }

      if (phase.id === 'developers_parallel') {
        return renderDevelopersPhase(snapshot);
      }

      return phase.members
        .map((memberKey) => snapshot.agents[memberKey])
        .filter(Boolean)
        .map((agent) => renderAgentPanel(agent))
        .join('');
    }

    function renderPhaseCard(snapshot, phase, index, total) {
      const status = flowStatus(snapshot, index);
      return `
        <div>
          <div class="flow-card ${flowCardClass(status)}">
            <div class="card-header" style="margin-bottom:8px;">
              <div>
                <h3 class="card-title">${escapeHtml(phase.title)}</h3>
                <span class="card-subtitle">${phase.parallel ? 'Parallel execution active' : 'Sequential execution stage'}</span>
              </div>
              ${statusBadge(status)}
            </div>

            <div class="handoff-strip">
              <span><strong>From:</strong> ${escapeHtml(phase.from)}</span>
              <span class="handoff-arrow">-></span>
              <span><strong>To:</strong> ${escapeHtml(phase.to)}</span>
            </div>

            <div class="flow-io-grid">
              <div class="flow-io-box">
                <div class="flow-io-title">Input Data</div>
                <div class="flow-io-list">${phase.input.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>
              </div>
              <div class="flow-io-box">
                <div class="flow-io-title">Output Data</div>
                <div class="flow-io-list">${phase.output.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>
              </div>
            </div>

            ${renderPhaseDetails(snapshot, phase)}
          </div>
          ${index < total - 1 ? '<div class="flow-arrow">↓</div>' : ''}
        </div>
      `;
    }

    function renderStats(snapshot) {
      const agents = Object.values(snapshot.agents);
      const activeAgents = agents.filter((agent) => agent.status === 'ACTIVE').length;
      const inactiveAgents = agents.length - activeAgents;
      const openEscalations = (snapshot.scrum && snapshot.scrum.escalations)
        ? snapshot.scrum.escalations.filter((esc) => esc.status === 'OPEN').length
        : 0;
      const totalTokens = agents.reduce((acc, agent) => acc + (agent.tokens || 0), 0);

      document.getElementById('flowStats').innerHTML = `
        <div class="stat-card">
          <span class="stat-label">Project</span>
          <span class="stat-value" style="font-size:18px;">${escapeHtml(currentProjectId)}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Active Agents</span>
          <span class="stat-value">${activeAgents}</span>
          <span class="stat-change up">orchestrated</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Inactive Agents</span>
          <span class="stat-value">${inactiveAgents}</span>
          <span class="stat-change">sleep mode</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Open Escalations</span>
          <span class="stat-value" style="color:${openEscalations ? 'var(--warning)' : 'var(--text-primary)'}">${openEscalations}</span>
          <span class="stat-change up">tokens ${totalTokens}</span>
        </div>
      `;
    }

    function ensurePopupStack() {
      let stack = document.getElementById('orchestrationPopupStack');
      if (!stack) {
        stack = document.createElement('div');
        stack.id = 'orchestrationPopupStack';
        stack.className = 'orchestration-popup-stack';
        document.body.appendChild(stack);
      }
      return stack;
    }

    function mapEventType(type) {
      if (!type) return 'TASK_START';
      return String(type).toUpperCase();
    }

    function renderPopups(snapshot) {
      const stack = ensurePopupStack();
      const notification = snapshot.activeNotification;

      if (!notification) {
        stack.innerHTML = '';
        return;
      }

      const eventType = mapEventType(notification.type);
      const klass = 'popup-' + eventType.toLowerCase();
      stack.innerHTML = `
        <div class="orchestration-popup ${klass}">
          <div class="label">${escapeHtml(eventType.replace('_', ' '))}</div>
          <div class="message">${escapeHtml(notification.message)}</div>
          <div class="time">${formatTime(notification.timestamp)}</div>
        </div>
      `;
    }

    function renderSystemFlow() {
      currentProjectId = getSelectedProject();
      const snapshot = NexusOrchestration.getSnapshot();
      const phases = NexusOrchestration.getPhases();

      const currentPhase = phases[snapshot.phaseIndex];
      const project = NexusStore.getProject(currentProjectId);
      const isDone = project && project.status === 'DONE';

      if (currentPhase && currentPhase.id === 'ai_pipeline' && !isDone) {
        window.location.href = 'pipeline.html';
        return;
      }

      const restartBtn = document.getElementById('restartPipelineBtn');
      if (restartBtn) {
        restartBtn.style.display = isDone ? 'block' : 'none';
      }

      renderStats(snapshot);
      document.getElementById('systemFlowStack').innerHTML = phases
        .map((phase, index) => renderPhaseCard(snapshot, phase, index, phases.length))
        .join('');
      renderPopups(snapshot);
    }

    function startFlowTicker() {
      if (!flowTicker) {
        flowTicker = setInterval(() => {
          renderSystemFlow();
        }, 1000);
      }
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'nexus_orchestration_runtime_v1') {
        renderSystemFlow();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (flowTicker) clearInterval(flowTicker);
    });

    function handleRestartPipeline() {
      if (confirm('Are you sure you want to restart the pipeline for this project?')) {
        NexusOrchestration.restartPipeline();
        renderSystemFlow();
      }
    }

    renderSystemFlow();
    startFlowTicker();
  </script>
</body>
</html>
