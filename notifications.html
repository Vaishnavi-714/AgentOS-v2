<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Notifications</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content" id="app">
    <div class="page-header">
      <div>
        <h1 class="page-title">Notification Center</h1>
        <p class="page-subtitle">All platform alerts, approvals, deployment events, and system notifications</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" onclick="markAllRead()">✓ Mark All Read</button>
        <button class="btn btn-outline btn-sm" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card" style="margin-bottom:16px;padding:12px 16px;">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <select id="filterType" class="form-select" style="width:auto" onchange="render()">
          <option value="">All Types</option>
          <option value="deployment">🚀 Deployment</option>
          <option value="incident">🚨 Incident</option>
          <option value="review">🔍 Code Review</option>
          <option value="safety">🛡️ AI Safety</option>
          <option value="escalation">⚠️ Escalation</option>
          <option value="integration">🔗 Integration</option>
          <option value="system">⚙️ System</option>
        </select>
        <select id="filterRead" class="form-select" style="width:auto" onchange="render()">
          <option value="">All</option>
          <option value="unread">Unread Only</option>
          <option value="read">Read Only</option>
        </select>
        <div style="margin-left:auto;font-size:13px;color:var(--text-muted);" id="notifCount"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="notifStats" style="margin-bottom:20px"></div>

    <!-- Notification List -->
    <div id="notifList"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/event-bus.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('notifications');
    NexusPermissions.enforcePageAccess('notifications');
    injectTenantInfoCard();

    function seedNotifications() {
      if (NexusStore.getNotifications().length > 0) return;
      const now = Date.now();
      NexusStore.setNotifications([
        { id: 'NOTIF-001', type: 'deployment', title: '🚀 Deployment Complete', message: 'v2.5.0-dev.42 deployed to development environment', timestamp: new Date(now - 3600000*2).toISOString(), read: false, link: 'devops.html', priority: 'normal' },
        { id: 'NOTIF-002', type: 'incident', title: '🚨 P1 Incident Active', message: 'Payment Service — 502 errors spike. 1,250 users affected. Support Agent investigating.', timestamp: new Date(now - 3600000*2.5).toISOString(), read: false, link: 'incidents.html', priority: 'critical' },
        { id: 'NOTIF-003', type: 'review', title: '🔍 PR Review Complete', message: 'PR-001: JWT authentication flow — APPROVED by Security Agent & Reviewer Agent', timestamp: new Date(now - 86400000*1).toISOString(), read: false, link: 'code-review.html', priority: 'normal' },
        { id: 'NOTIF-004', type: 'review', title: '🔍 Changes Requested', message: 'PR-002: Stripe payment processing — CRITICAL security finding: API key exposed', timestamp: new Date(now - 3600000*4).toISOString(), read: false, link: 'code-review.html', priority: 'high' },
        { id: 'NOTIF-005', type: 'safety', title: '🛡️ Prompt Injection Blocked', message: 'Attempted prompt injection detected and blocked. User input sanitized.', timestamp: new Date(now - 3600000*8).toISOString(), read: true, link: 'ai-safety.html', priority: 'high' },
        { id: 'NOTIF-006', type: 'escalation', title: '⚠️ New Escalation', message: 'ESC-2024-0052: Developer Agent exceeded ceiling — payment gateway decision requires human approval', timestamp: new Date(now - 86400000*2).toISOString(), read: true, link: 'escalations.html', priority: 'high' },
        { id: 'NOTIF-007', type: 'deployment', title: '🚀 Staging Deploy', message: 'v2.5.0-rc.3 deployed to staging. All smoke tests passed.', timestamp: new Date(now - 86400000*1).toISOString(), read: true, link: 'devops.html', priority: 'normal' },
        { id: 'NOTIF-008', type: 'integration', title: '🔗 SonarQube Degraded', message: 'SonarQube integration health degraded — last sync 2 hours ago. API timeout errors.', timestamp: new Date(now - 3600000*3).toISOString(), read: false, link: 'integrations.html', priority: 'medium' },
        { id: 'NOTIF-009', type: 'system', title: '⚙️ Quality Gate Passed', message: 'Gate L2 PASSED for task TK-001: JWT Token Service. Coverage: 92%', timestamp: new Date(now - 86400000*2).toISOString(), read: true, link: 'quality-gates.html', priority: 'normal' },
        { id: 'NOTIF-010', type: 'safety', title: '🛡️ Hallucination Detected', message: 'Developer Agent (Auth) referenced nonexistent API endpoint. Output flagged for review.', timestamp: new Date(now - 3600000*4).toISOString(), read: false, link: 'ai-safety.html', priority: 'medium' },
        { id: 'NOTIF-011', type: 'incident', title: '🚨 Incident Mitigated', message: 'INC-2026-002: Auth Service JWT validation failures mitigated. NTP sync applied.', timestamp: new Date(now - 3600000*6).toISOString(), read: true, link: 'incidents.html', priority: 'normal' },
        { id: 'NOTIF-012', type: 'system', title: '⚙️ Pipeline Complete', message: 'AI Pipeline (13/13 stages) completed for E-Commerce Platform project', timestamp: new Date(now - 86400000*3).toISOString(), read: true, link: 'pipeline.html', priority: 'normal' }
      ]);
    }

    seedNotifications();

    function render() {
      const notifications = NexusStore.getNotifications();
      const filterType = document.getElementById('filterType').value;
      const filterRead = document.getElementById('filterRead').value;

      let filtered = notifications;
      if (filterType) filtered = filtered.filter(n => n.type === filterType);
      if (filterRead === 'unread') filtered = filtered.filter(n => !n.read);
      if (filterRead === 'read') filtered = filtered.filter(n => n.read);

      // Sort by timestamp descending
      filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      const unread = notifications.filter(n => !n.read).length;
      const critical = notifications.filter(n => n.priority === 'critical' && !n.read).length;

      document.getElementById('notifStats').innerHTML = `
        <div class="card stat-card"><div class="stat-value">${notifications.length}</div><div class="stat-label">Total Notifications</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:${unread > 0 ? '#3b82f6' : '#10b981'}">${unread}</div><div class="stat-label">Unread</div></div>
        <div class="card stat-card"><div class="stat-value" style="color:${critical > 0 ? '#ef4444' : '#10b981'}">${critical}</div><div class="stat-label">Critical</div></div>
        <div class="card stat-card"><div class="stat-value">${new Set(notifications.map(n => n.type)).size}</div><div class="stat-label">Categories</div></div>
      `;

      document.getElementById('notifCount').textContent = `Showing ${filtered.length} of ${notifications.length}`;

      const priorityColors = { critical: '#ef4444', high: '#f97316', medium: '#f59e0b', normal: '#6b7280' };
      const typeIcons = { deployment: '🚀', incident: '🚨', review: '🔍', safety: '🛡️', escalation: '⚠️', integration: '🔗', system: '⚙️' };

      // Group by date
      const groups = {};
      filtered.forEach(n => {
        const date = new Date(n.timestamp);
        const today = new Date();
        const yesterday = new Date(today - 86400000);
        let label;
        if (date.toDateString() === today.toDateString()) label = 'Today';
        else if (date.toDateString() === yesterday.toDateString()) label = 'Yesterday';
        else label = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        (groups[label] = groups[label] || []).push(n);
      });

      document.getElementById('notifList').innerHTML = Object.entries(groups).map(([date, items]) => `
        <div style="margin-bottom:20px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:4px;">${date}</div>
          ${items.map(n => `
            <div class="card" style="margin-bottom:6px;padding:12px 16px;cursor:pointer;transition:all 0.2s;${!n.read ? 'border-left:3px solid var(--accent);background:var(--accent)05;' : 'opacity:0.75;'}" onclick="handleNotifClick('${n.id}')">
              <div style="display:flex;align-items:flex-start;gap:12px;">
                <span style="font-size:18px;flex-shrink:0;margin-top:2px;">${typeIcons[n.type] || '📌'}</span>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                    <span style="font-weight:${n.read ? '400' : '600'};font-size:14px;">${n.title}</span>
                    <span style="font-size:11px;color:var(--text-muted);flex-shrink:0;margin-left:8px;">${timeAgo(n.timestamp)}</span>
                  </div>
                  <div style="font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.message}</div>
                  <div style="display:flex;gap:6px;margin-top:4px;">
                    <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:var(--bg-tertiary);color:var(--text-muted);">${n.type}</span>
                    ${n.priority !== 'normal' ? `<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${priorityColors[n.priority]}15;color:${priorityColors[n.priority]};font-weight:600;">${n.priority}</span>` : ''}
                  </div>
                </div>
                ${!n.read ? `<span style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:8px;"></span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function timeAgo(timestamp) {
      const diff = Date.now() - new Date(timestamp).getTime();
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return Math.floor(diff / 86400000) + 'd ago';
    }

    function handleNotifClick(notifId) {
      const notifs = NexusStore.getNotifications();
      const notif = notifs.find(n => n.id === notifId);
      if (notif) {
        notif.read = true;
        NexusStore.setNotifications(notifs);
        if (notif.link) window.location.href = notif.link;
        else render();
      }
    }

    function markAllRead() {
      NexusStore.markAllNotificationsRead();
      render();
      showToast('All notifications marked as read', 'success');
    }

    function clearAll() {
      if (!confirm('Clear all notifications?')) return;
      NexusStore.setNotifications([]);
      render();
      showToast('Notifications cleared', 'info');
    }

    render();

    // Listen for new notifications
    NexusEventBus.on('notification:deployment', () => render());
    NexusEventBus.on('notification:incident', () => render());
    NexusEventBus.on('notification:review', () => render());
    NexusEventBus.on('notification:safety', () => render());
  </script>
</body>
</html>
