<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Agent Management</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Agent Management</h1>
        <p class="page-subtitle">Create, configure, and monitor AI agents in the governed hierarchy</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openCreateAgent()">+ Create Agent</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="agentStats" style="margin-bottom:24px;"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orgchart', event)">Org Structure</button>
      <button class="tab" onclick="switchTab('flow', event)">Agent Flow</button>
      <button class="tab" onclick="switchTab('live', event)">Live Activity</button>
      <button class="tab" onclick="switchTab('list', event)">Agent List</button>
      <button class="tab" onclick="switchTab('performance', event)">Performance</button>
    </div>

    <div id="tab-orgchart" class="tab-content active"></div>
    <div id="tab-flow" class="tab-content"></div>
    <div id="tab-live" class="tab-content"></div>
    <div id="tab-list" class="tab-content"></div>
    <div id="tab-performance" class="tab-content"></div>
  </div>

  <!-- Create Agent Modal -->
  <div class="modal-overlay" id="createAgentModal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h3 class="modal-title">Create New Agent</h3>
        <button class="modal-close" onclick="closeModal('createAgentModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Agent Name</label>
            <input type="text" id="agentName" class="form-input" placeholder="e.g., Module Architect - Inventory">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select id="agentRole" class="form-select">
              <option value="business_analyst">Business Analyst</option>
              <option value="product_manager">Product Manager</option>
              <option value="product_owner">Product Owner</option>
              <option value="scrum_master">Scrum Master</option>
              <option value="chief_architect">Chief / Solution Architect</option>
              <option value="module_architect">Module Architect</option>
              <option value="developer">Developer</option>
              <option value="integration_architect">Integration Architect</option>
              <option value="qa">QA Agent</option>
              <option value="security_devops">Security / DevOps</option>
            </select>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Model Provider</label>
            <select id="agentProvider" class="form-select" onchange="updateModelVariants()">
              <option value="anthropic_claude">Anthropic Claude</option>
              <option value="openai_gpt">OpenAI GPT</option>
              <option value="google_gemini">Google Gemini</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Model Variant</label>
            <select id="agentVariant" class="form-select">
              <option value="claude-3-opus">claude-3-opus</option>
              <option value="claude-3-sonnet">claude-3-sonnet</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Module Scope</label>
          <select id="agentScope" class="form-select">
            <option value="global">Global</option>
            <option value="auth">Auth</option>
            <option value="payments">Payments</option>
            <option value="orders">Orders</option>
            <option value="inventory">Inventory</option>
            <option value="notifications">Notifications</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Capabilities (select multiple)</label>
          <div class="checkbox-group" id="capabilitiesGroup">
            <label class="checkbox-label"><input type="checkbox" value="write_code"> Write Code</label>
            <label class="checkbox-label"><input type="checkbox" value="run_unit_tests"> Run Tests</label>
            <label class="checkbox-label"><input type="checkbox" value="create_mock_apis"> Mock APIs</label>
            <label class="checkbox-label"><input type="checkbox" value="design_module_architecture"> Design Architecture</label>
            <label class="checkbox-label"><input type="checkbox" value="create_task_breakdown"> Task Breakdown</label>
            <label class="checkbox-label"><input type="checkbox" value="review_dev_output"> Code Review</label>
            <label class="checkbox-label"><input type="checkbox" value="generate_tests"> Generate Tests</label>
            <label class="checkbox-label"><input type="checkbox" value="vulnerability_scanning"> Security Scan</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Risk Sensitivity</label>
          <select id="agentRisk" class="form-select">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ceiling — Must Escalate (comma-separated)</label>
          <input type="text" id="agentEscalate" class="form-input" placeholder="e.g., modify_data_model, change_api_contract">
        </div>
        <div class="form-group">
          <label class="form-label">Ceiling — Strictly Forbidden (comma-separated)</label>
          <input type="text" id="agentForbidden" class="form-input" placeholder="e.g., cross_module_writes, production_db_access">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('createAgentModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createAgent()">Create & Register Agent</button>
      </div>
    </div>
  </div>

  <!-- Agent Detail Modal -->
  <div class="modal-overlay" id="agentDetailModal">
    <div class="modal" style="max-width:800px;">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Agent Details</h3>
        <button class="modal-close" onclick="closeModal('agentDetailModal')">&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <a id="workspaceLink" class="btn btn-primary" href="#">Open Workspace →</a>
        <button class="btn btn-outline" onclick="closeModal('agentDetailModal')">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay side" id="workspacePanel">
    <div class="modal side-modal">
      <div class="modal-header">
        <h3 class="modal-title" id="workspacePanelTitle">Agent Workspace</h3>
        <button class="modal-close" onclick="closeModal('workspacePanel')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="workspaceAgentMeta" style="margin-bottom:12px;"></div>
        <div class="workspace-tabs" id="workspacePanelTabs"></div>
        <div class="workspace-pane" id="workspacePanelContent"></div>
      </div>
      <div class="modal-footer">
        <a id="workspacePanelOpenFull" class="btn btn-primary" href="#">Open Full Workspace →</a>
        <button class="btn btn-outline" onclick="closeModal('workspacePanel')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    seedNexusData();
    createNavigation('agents');

    const WORKSPACE_FILES = ['skills', 'tools', 'heartbeat', 'souls'];
    const WORKSPACE_LABELS = {
      skills: 'skills.md',
      tools: 'tools.md',
      heartbeat: 'heartbeat.md',
      souls: 'souls.md'
    };
    const flowExpanded = {};
    const liveActivityState = {};
    let activeWorkspaceAgentId = null;
    let activeWorkspaceFile = 'heartbeat';
    let liveTicker = null;

    const FLOW_DEFINITION = [
      {
        agentId: 'agent_ba_001',
        fallbackName: 'Business Analyst',
        taskId: 'TASK-AUTH-101',
        inputs: ['Raw requirements', 'Stakeholder notes'],
        outputs: ['Refined backlog', 'Clarified constraints'],
        actions: ['Refining requirements', 'Clarifying domain language', 'Eliminating ambiguity'],
        tokenStart: 1200
      },
      {
        agentId: 'agent_po_001',
        fallbackName: 'Product Owner',
        taskId: 'TASK-AUTH-101',
        inputs: ['Refined backlog', 'Priority matrix'],
        outputs: ['Approved acceptance criteria', 'Ready-for-architecture PBI'],
        actions: ['Validating acceptance', 'Prioritizing backlog', 'Aligning business goals'],
        tokenStart: 1260
      },
      {
        agentId: 'agent_chief_arch_001',
        fallbackName: 'Chief Architect',
        taskId: 'TASK-AUTH-101',
        inputs: ['Approved backlog', 'Epics'],
        outputs: ['DB Schema', 'API Contracts'],
        actions: ['Designing system architecture', 'Defining API contracts', 'Reviewing risk boundaries'],
        tokenStart: 1500
      },
      {
        agentId: 'agent_mod_arch_auth',
        fallbackName: 'Module Architect - Auth',
        taskId: 'TASK-AUTH-101',
        inputs: ['DB schema', 'API contracts'],
        outputs: ['Module blueprint', 'Task breakdown'],
        actions: ['Breaking down tasks', 'Designing module APIs', 'Preparing implementation guide'],
        tokenStart: 1320
      },
      {
        agentId: 'agent_dev_auth_01',
        fallbackName: 'Developer Agent - Auth 01',
        taskId: 'TASK-AUTH-101',
        inputs: ['Task breakdown', 'Module contracts'],
        outputs: ['Code changes', 'Unit tests'],
        actions: ['Writing login API', 'Implementing auth handlers', 'Refactoring token service'],
        tokenStart: 1240
      },
      {
        agentId: 'agent_qa_001',
        fallbackName: 'QA Agent',
        taskId: 'TASK-AUTH-102',
        inputs: ['Code build', 'Acceptance criteria'],
        outputs: ['Test evidence', 'Defect report'],
        actions: ['Executing test suites', 'Validating acceptance scenarios', 'Running regression checks'],
        tokenStart: 1180
      },
      {
        agentId: 'agent_secdevops_001',
        fallbackName: 'DevOps Agent',
        taskId: 'TASK-AUTH-102',
        inputs: ['QA-approved build', 'Release checklist'],
        outputs: ['Deployment package', 'Release telemetry'],
        actions: ['Preparing deployment bundle', 'Running security gates', 'Publishing release candidate'],
        tokenStart: 1300
      }
    ];

    function switchTab(tab, evt) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    function updateModelVariants() {
      const provider = document.getElementById('agentProvider').value;
      const variants = {
        anthropic_claude: ['claude-3-opus', 'claude-3-sonnet', 'claude-3-haiku'],
        openai_gpt: ['gpt-4o', 'gpt-4-turbo', 'gpt-3.5-turbo'],
        google_gemini: ['gemini-1.5-pro', 'gemini-1.5-flash', 'gemini-1.0-pro']
      };
      const sel = document.getElementById('agentVariant');
      sel.innerHTML = (variants[provider] || []).map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function render() {
      const agents = NexusStore.getAgents();
      initLiveActivity(agents);
      const active = agents.filter(a => a.status === 'ACTIVE').length;
      const blocked = agents.filter(a => a.status === 'BLOCKED').length;
      const totalTasks = agents.reduce((a, ag) => a + ag.metrics.tasks_completed, 0);
      const avgGate = agents.length ? (agents.reduce((a, ag) => a + ag.metrics.gate_pass_rate, 0) / agents.length).toFixed(0) : 0;

      document.getElementById('agentStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Total Agents</span><span class="stat-value">${agents.length}</span><span class="stat-change up">${active} active</span></div>
        <div class="stat-card"><span class="stat-label">Blocked</span><span class="stat-value" style="color:${blocked>0?'var(--danger)':'var(--text-primary)'}">${blocked}</span></div>
        <div class="stat-card"><span class="stat-label">Tasks Completed</span><span class="stat-value">${totalTasks}</span></div>
        <div class="stat-card"><span class="stat-label">Avg Gate Pass Rate</span><span class="stat-value">${avgGate}%</span></div>
      `;

      renderOrgChart(agents);
      renderAgentFlow(agents);
      renderLiveActivity(agents);
      renderAgentList(agents);
      renderPerformance(agents);
    }

    function renderOrgChart(agents) {
      const byRole = (role) => agents.filter(a => a.role === role);
      const modArchs = byRole('module_architect');
      const devs = byRole('developer');

      document.getElementById('tab-orgchart').innerHTML = `
        <div class="org-chart">
          <div class="org-level">
            <div class="org-node" style="border-color:var(--warning)" onclick="showAgent(null)">
              <div class="org-node-name">👤 Human Orchestrator</div>
              <div class="org-node-role">Final Authority</div>
            </div>
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('business_analyst').map(a => agentNode(a)).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('product_manager').map(a => agentNode(a)).join('')}
            ${byRole('product_owner').map(a => agentNode(a)).join('')}
            ${byRole('scrum_master').map(a => agentNode(a)).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('chief_architect').map(a => agentNode(a)).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${modArchs.map(a => `
              <div class="org-branch">
                ${agentNode(a)}
                <div class="org-connector"></div>
                <div class="org-level">
                  ${devs.filter(d => d.module_scope === a.module_scope).map(d => agentNode(d)).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('integration_architect').map(a => agentNode(a)).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('qa').map(a => agentNode(a)).join('')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${byRole('security_devops').map(a => agentNode(a)).join('')}
          </div>
        </div>
      `;
    }

    function agentNode(agent) {
      const status = getLiveStatus(agent.agent_id, agent.status);
      const colors = { ACTIVE: 'var(--success)', BLOCKED: 'var(--danger)', IDLE: 'var(--text-muted)' };
      return `
        <div class="org-node" onclick="openAgentWorkspacePanel('${agent.agent_id}')" style="border-color:${colors[status]||'var(--border)'}">
          <div class="org-node-name">${escapeHtml(agent.agent_name)}</div>
          <div class="org-node-role">${agent.model_provider.split('_')[1] || agent.model_provider} · ${agent.module_scope}</div>
          <div class="org-node-status">${statusBadge(status)}</div>
        </div>
      `;
    }

    function renderAgentFlow(agents) {
      document.getElementById('tab-flow').innerHTML = `
        <div class="flow-stack">
          ${FLOW_DEFINITION.map((stage, idx) => {
            const agent = agents.find(a => a.agent_id === stage.agentId);
            const state = liveActivityState[stage.agentId];
            const name = agent ? agent.agent_name : stage.fallbackName;
            const status = getLiveStatus(stage.agentId, agent ? agent.status : 'ACTIVE');
            const payload = {
              agentId: stage.agentId,
              agentName: name,
              currentTask: state ? state.taskId : stage.taskId,
              status,
              input: stage.inputs,
              output: stage.outputs,
              lastAction: state ? state.action : stage.actions[0],
              tokensUsed: state ? state.tokens : stage.tokenStart,
              generatedAt: new Date().toISOString()
            };

            return `
              <div>
                <div class="flow-card clickable" onclick="toggleFlowBlock('${stage.agentId}')">
                  <div class="card-header" style="margin-bottom:8px;">
                    <div>
                      <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openAgentWorkspacePanel('${stage.agentId}')">${escapeHtml(name)}</button>
                      <span class="card-subtitle" style="display:block; margin-top:6px;">Task ${state ? state.taskId : stage.taskId}</span>
                    </div>
                    ${statusBadge(status)}
                  </div>

                  <div class="flow-io-grid">
                    <div class="flow-io-box">
                      <div class="flow-io-title">Input</div>
                      <div class="flow-io-list">${stage.inputs.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('')}</div>
                    </div>
                    <div class="flow-io-box">
                      <div class="flow-io-title">Output</div>
                      <div class="flow-io-list">${stage.outputs.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('')}</div>
                    </div>
                  </div>

                  <div class="json-panel ${flowExpanded[stage.agentId] ? 'show' : ''}">
                    <div class="code-block">${escapeHtml(JSON.stringify(payload, null, 2))}</div>
                  </div>
                </div>
                ${idx < FLOW_DEFINITION.length - 1 ? '<div class="flow-arrow">↓</div>' : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function toggleFlowBlock(agentId) {
      flowExpanded[agentId] = !flowExpanded[agentId];
      renderAgentFlow(NexusStore.getAgents());
    }

    function renderLiveActivity(agents) {
      document.getElementById('tab-live').innerHTML = `
        <div class="grid grid-3">
          ${FLOW_DEFINITION.map(stage => {
            const agent = agents.find(a => a.agent_id === stage.agentId);
            const state = liveActivityState[stage.agentId];
            const name = agent ? agent.agent_name : stage.fallbackName;
            const status = state ? state.status : 'ACTIVE';
            return `
              <div class="activity-card" onclick="openAgentWorkspacePanel('${stage.agentId}')">
                <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
                  <div>
                    <h3 class="card-title">${escapeHtml(name)}</h3>
                    <span class="tag" style="font-family:var(--mono); margin-top:6px;">${state ? state.taskId : stage.taskId}</span>
                  </div>
                  ${statusBadge(status)}
                </div>

                <div style="margin-top:10px; font-size:13px; color:var(--text-secondary);">
                  <span style="color:var(--text-muted);">Current Action:</span> ${escapeHtml(state ? state.action : stage.actions[0])}
                </div>

                <div class="activity-meta">
                  <div class="activity-kv"><span>Tokens Used</span>${state ? state.tokens : stage.tokenStart}</div>
                  <div class="activity-kv"><span>Timer</span>${state ? formatDuration(Date.now() - state.startedAt) : '00:00'}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderAgentList(agents) {
      document.getElementById('tab-list').innerHTML = `
        <div class="table-container">
          <table>
            <thead><tr><th>Agent</th><th>Role</th><th>Module</th><th>Model</th><th>Lifecycle</th><th>Status</th><th>Tasks</th><th>Gate %</th><th>Actions</th></tr></thead>
            <tbody>
              ${agents.map(a => `
                <tr>
                  <td style="font-weight:600;">${escapeHtml(a.agent_name)}</td>
                  <td><span class="tag">${a.role.replace(/_/g,' ')}</span></td>
                  <td><span class="tag">${a.module_scope}</span></td>
                  <td style="font-size:12px; color:var(--text-muted)">${a.model_variant}</td>
                  <td>${statusBadge(a.lifecycle)}</td>
                  <td>${statusBadge(getLiveStatus(a.agent_id, a.status))}</td>
                  <td style="font-weight:600;">${a.metrics.tasks_completed}</td>
                  <td>${a.metrics.gate_pass_rate}%</td>
                  <td>
                    <button class="btn btn-outline btn-sm" onclick="openAgentWorkspacePanel('${a.agent_id}')">Workspace Panel</button>
                    <a class="btn btn-outline btn-sm" href="agent-workspace.html?id=${a.agent_id}">Workspace</a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPerformance(agents) {
      document.getElementById('tab-performance').innerHTML = `
        <div class="grid grid-2">
          ${agents.map(a => `
            <div class="card" onclick="openAgentWorkspacePanel('${a.agent_id}')" style="cursor:pointer;">
              <div class="card-header">
                <div><h3 class="card-title">${escapeHtml(a.agent_name)}</h3><span class="card-subtitle">${a.role.replace(/_/g,' ')} · ${a.module_scope}</span></div>
                ${statusBadge(getLiveStatus(a.agent_id, a.status))}
              </div>
              <div class="metric-bar">
                <span class="metric-label">Tasks Completed</span>
                <div class="metric-track"><div class="metric-fill" style="width:${Math.min(a.metrics.tasks_completed*3,100)}%;background:var(--success)"></div></div>
                <span class="metric-value">${a.metrics.tasks_completed}</span>
              </div>
              <div class="metric-bar">
                <span class="metric-label">Escalations</span>
                <div class="metric-track"><div class="metric-fill" style="width:${Math.min(a.metrics.escalations_raised*15,100)}%;background:var(--warning)"></div></div>
                <span class="metric-value">${a.metrics.escalations_raised}</span>
              </div>
              <div class="metric-bar">
                <span class="metric-label">Gate Pass Rate</span>
                <div class="metric-track"><div class="metric-fill" style="width:${a.metrics.gate_pass_rate}%;background:${a.metrics.gate_pass_rate>=90?'var(--success)':a.metrics.gate_pass_rate>=70?'var(--warning)':'var(--danger)'}"></div></div>
                <span class="metric-value">${a.metrics.gate_pass_rate}%</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function showAgent(id) {
      if (!id) return;
      openAgentWorkspacePanel(id);
    }

    function getLiveStatus(agentId, fallback) {
      return liveActivityState[agentId]?.status || fallback;
    }

    function initLiveActivity(agents) {
      FLOW_DEFINITION.forEach(stage => {
        const agent = agents.find(a => a.agent_id === stage.agentId);
        if (!liveActivityState[stage.agentId]) {
          const startedAt = Date.now() - (Math.floor(Math.random() * 120) + 30) * 1000;
          liveActivityState[stage.agentId] = {
            taskId: stage.taskId,
            action: stage.actions[0],
            status: agent ? agent.status : 'ACTIVE',
            tokens: stage.tokenStart,
            startedAt,
            milestoneIndex: stage.tokenStart >= 2100 ? 2 : stage.tokenStart >= 1500 ? 1 : 0,
            milestones: [1200, 1500, 2100]
          };
        }
      });

      if (!liveTicker) {
        liveTicker = setInterval(stepLiveActivity, 2000);
      }
    }

    function stepLiveActivity() {
      FLOW_DEFINITION.forEach(stage => {
        const state = liveActivityState[stage.agentId];
        if (!state) return;

        const roll = Math.random();
        state.status = roll < 0.72 ? 'ACTIVE' : roll < 0.9 ? 'IDLE' : 'BLOCKED';

        if (state.status === 'ACTIVE') {
          state.action = stage.actions[Math.floor(Math.random() * stage.actions.length)];
        } else if (state.status === 'BLOCKED') {
          state.action = 'Waiting on escalation approval';
        } else {
          state.action = 'Awaiting next assignment';
        }

        if (state.milestoneIndex < state.milestones.length - 1) {
          state.milestoneIndex += 1;
          state.tokens = state.milestones[state.milestoneIndex];
        } else {
          state.tokens += 40 + Math.floor(Math.random() * 120);
        }

        if (Math.random() > 0.78) {
          state.taskId = state.taskId === 'TASK-AUTH-101' ? 'TASK-AUTH-102' : 'TASK-AUTH-101';
          state.startedAt = Date.now();
        }

        syncHeartbeatFile(stage.agentId);
      });

      renderLiveActivity(NexusStore.getAgents());
      renderAgentFlow(NexusStore.getAgents());
      if (activeWorkspaceAgentId) renderWorkspacePanel();
    }

    function syncHeartbeatFile(agentId) {
      const agent = NexusStore.getAgent(agentId);
      const state = liveActivityState[agentId];
      if (!agent || !state) return;
      NexusStore.setWorkspaceFile(agentId, 'heartbeat', buildHeartbeatMarkdown(agent, state));
    }

    function buildHeartbeatMarkdown(agent, state) {
      return `# HEARTBEAT\n\n## Current Task\n- ${state.taskId}\n\n## Current Action\n- ${state.action}\n\n## Status\n${state.status}\n\n## Tokens Used\n${state.tokens}\n\n## Active Timer\n${formatDuration(Date.now() - state.startedAt)}\n\n## Agent\n${agent.agent_name}`;
    }

    function ensureWorkspaceDefaults(agentId, agentName) {
      const defaults = {
        skills: `# SKILLS\n\n## Core Responsibilities\n- Execute ${agentName} role actions\n- Produce structured outputs\n- Follow governance and escalation boundaries\n`,
        tools: '# TOOLS\n\n## Available Tools\n- code_generator\n- test_runner\n- quality_gate_checker\n\n## Rules\n- No production writes\n- Trace all changes\n',
        souls: '# SOUL\n\n## Behavioral Traits\n- Quality-first decisions\n- Explicit risk communication\n- Evidence-backed outputs\n'
      };
      ['skills', 'tools', 'souls'].forEach(file => {
        if (!NexusStore.getWorkspaceFile(agentId, file)) {
          NexusStore.setWorkspaceFile(agentId, file, defaults[file]);
        }
      });
      if (!NexusStore.getWorkspaceFile(agentId, 'heartbeat')) {
        const state = liveActivityState[agentId] || {
          taskId: 'TASK-AUTH-101',
          action: 'Awaiting simulation update',
          status: 'IDLE',
          tokens: 1200,
          startedAt: Date.now()
        };
        NexusStore.setWorkspaceFile(agentId, 'heartbeat', buildHeartbeatMarkdown({ agent_name: agentName }, state));
      }
    }

    function openAgentWorkspacePanel(agentId) {
      const agent = NexusStore.getAgent(agentId);
      if (!agent) return;

      activeWorkspaceAgentId = agentId;
      activeWorkspaceFile = 'heartbeat';
      ensureWorkspaceDefaults(agentId, agent.agent_name);
      renderWorkspacePanel();
      document.getElementById('workspacePanel').classList.add('show');
    }

    function switchWorkspaceFile(fileName) {
      activeWorkspaceFile = fileName;
      renderWorkspacePanel();
    }

    function renderWorkspacePanel() {
      if (!activeWorkspaceAgentId) return;
      const agent = NexusStore.getAgent(activeWorkspaceAgentId);
      if (!agent) return;

      const state = liveActivityState[activeWorkspaceAgentId];
      document.getElementById('workspacePanelTitle').textContent = agent.agent_name + ' Workspace';
      document.getElementById('workspacePanelOpenFull').href = 'agent-workspace.html?id=' + agent.agent_id;
      document.getElementById('workspaceAgentMeta').innerHTML = `
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span class="tag">${agent.agent_id}</span>
          <span class="tag">${agent.role.replace(/_/g, ' ')}</span>
          ${statusBadge(getLiveStatus(agent.agent_id, agent.status))}
          ${state ? `<span class="tag" style="font-family:var(--mono);">${state.taskId}</span>` : ''}
          ${state ? `<span class="tag">Tokens ${state.tokens}</span>` : ''}
        </div>
      `;

      document.getElementById('workspacePanelTabs').innerHTML = WORKSPACE_FILES.map(file =>
        `<div class="workspace-tab ${activeWorkspaceFile === file ? 'active' : ''}" onclick="switchWorkspaceFile('${file}')">${WORKSPACE_LABELS[file]}</div>`
      ).join('');

      let content = NexusStore.getWorkspaceFile(activeWorkspaceAgentId, activeWorkspaceFile);
      if (activeWorkspaceFile === 'heartbeat' && state) {
        content = buildHeartbeatMarkdown(agent, state);
      }

      document.getElementById('workspacePanelContent').innerHTML = `<pre>${escapeHtml(content)}</pre>`;
    }

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const hours = Math.floor(minutes / 60);
      if (hours > 0) {
        return String(hours).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }
      return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    function openCreateAgent() { document.getElementById('createAgentModal').classList.add('show'); }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
      if (id === 'workspacePanel') activeWorkspaceAgentId = null;
    }

    async function createAgent() {
      const name = document.getElementById('agentName').value.trim();
      if (!name) { showToast('Agent name required', 'error'); return; }

      const caps = Array.from(document.querySelectorAll('#capabilitiesGroup input:checked')).map(c => c.value);
      showLoading('Creating agent...');

      const result = await MockAPI.createAgent({
        agent_name: name,
        role: document.getElementById('agentRole').value,
        module_scope: document.getElementById('agentScope').value,
        model_provider: document.getElementById('agentProvider').value,
        model_variant: document.getElementById('agentVariant').value,
        capabilities: caps,
        ceiling_profile: {
          can_autonomously: caps,
          must_escalate: document.getElementById('agentEscalate').value.split(',').map(s=>s.trim()).filter(Boolean),
          strictly_forbidden: document.getElementById('agentForbidden').value.split(',').map(s=>s.trim()).filter(Boolean),
          risk_sensitivity: document.getElementById('agentRisk').value
        }
      });

      hideLoading();
      closeModal('createAgentModal');
      if (result.success) {
        showToast(`Agent "${name}" created and registered`, 'success');
        render();
      }
    }

    window.addEventListener('beforeunload', () => {
      if (liveTicker) clearInterval(liveTicker);
    });

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    render();
  </script>
</body>
</html>
