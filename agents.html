<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Agent Management</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .runtime-org-node.active {
      border-color: var(--success)70;
      box-shadow: 0 0 0 1px var(--success)35, 0 0 18px var(--success)18;
    }

    .runtime-org-node.inactive {
      opacity: 0.68;
      border-style: dashed;
      filter: grayscale(0.25);
    }

    .org-flow-note {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .flow-route-strip {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .flow-route-strip strong {
      color: var(--accent);
      margin-right: 4px;
    }

    .flow-status-completed {
      border-left: 3px solid var(--success);
    }

    .flow-status-active {
      border-left: 3px solid var(--info);
      box-shadow: 0 0 0 1px var(--info)25;
    }

    .flow-status-pending {
      border-left: 3px solid var(--border);
    }

    .runtime-agent-chip {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .ai-task-list {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .ai-task-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      padding: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .activity-card.active {
      border-color: var(--success)55;
      box-shadow: 0 0 0 1px var(--success)22;
    }

    .activity-card.inactive {
      opacity: 0.72;
      border-style: dashed;
    }

    .orchestration-popup-stack {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 2400;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(420px, calc(100vw - 24px));
      pointer-events: none;
    }

    .orchestration-popup {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      animation: popupSlideIn 0.25s ease;
    }

    .orchestration-popup .label {
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .orchestration-popup .message {
      font-size: 12px;
      color: var(--text-primary);
      line-height: 1.45;
    }

    .orchestration-popup .time {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .popup-task_start { border-left: 3px solid var(--info); }
    .popup-task_complete { border-left: 3px solid var(--success); }
    .popup-handoff { border-left: 3px solid var(--accent); }
    .popup-escalation { border-left: 3px solid var(--warning); }

    @keyframes popupSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1100px) {
      .ai-task-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Agent Management</h1>
        <p class="page-subtitle">Create, configure, and monitor AI agents in the governed hierarchy</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openCreateAgent()">+ Create Agent</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-4" id="agentStats" style="margin-bottom:24px;"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orgchart', event)">Org Structure</button>
      <button class="tab" onclick="switchTab('flow', event)">Agent Flow</button>
      <button class="tab" onclick="switchTab('live', event)">Live Activity</button>
      <button class="tab" onclick="switchTab('list', event)">Agent List</button>
      <button class="tab" onclick="switchTab('performance', event)">Performance</button>
    </div>

    <div id="tab-orgchart" class="tab-content active"></div>
    <div id="tab-flow" class="tab-content"></div>
    <div id="tab-live" class="tab-content"></div>
    <div id="tab-list" class="tab-content"></div>
    <div id="tab-performance" class="tab-content"></div>
  </div>

  <!-- Create Agent Modal -->
  <div class="modal-overlay" id="createAgentModal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h3 class="modal-title">Create New Agent</h3>
        <button class="modal-close" onclick="closeModal('createAgentModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Agent Name</label>
            <input type="text" id="agentName" class="form-input" placeholder="e.g., Module Architect - Inventory">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select id="agentRole" class="form-select">
              <option value="business_analyst">Business Analyst</option>
              <option value="product_manager">Product Manager</option>
              <option value="product_owner">Product Owner</option>
              <option value="scrum_master">Scrum Master</option>
              <option value="chief_architect">Chief / Solution Architect</option>
              <option value="module_architect">Module Architect</option>
              <option value="developer">Developer</option>
              <option value="integration_architect">Integration Architect</option>
              <option value="qa">QA Agent</option>
              <option value="security_devops">Security / DevOps</option>
            </select>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Model Provider</label>
            <select id="agentProvider" class="form-select" onchange="updateModelVariants()">
              <option value="anthropic_claude">Anthropic Claude</option>
              <option value="openai_gpt">OpenAI GPT</option>
              <option value="google_gemini">Google Gemini</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Model Variant</label>
            <select id="agentVariant" class="form-select">
              <option value="claude-3-opus">claude-3-opus</option>
              <option value="claude-3-sonnet">claude-3-sonnet</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Module Scope</label>
          <select id="agentScope" class="form-select">
            <option value="global">Global</option>
            <option value="auth">Auth</option>
            <option value="payments">Payments</option>
            <option value="orders">Orders</option>
            <option value="inventory">Inventory</option>
            <option value="notifications">Notifications</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Capabilities (select multiple)</label>
          <div class="checkbox-group" id="capabilitiesGroup">
            <label class="checkbox-label"><input type="checkbox" value="write_code"> Write Code</label>
            <label class="checkbox-label"><input type="checkbox" value="run_unit_tests"> Run Tests</label>
            <label class="checkbox-label"><input type="checkbox" value="create_mock_apis"> Mock APIs</label>
            <label class="checkbox-label"><input type="checkbox" value="design_module_architecture"> Design Architecture</label>
            <label class="checkbox-label"><input type="checkbox" value="create_task_breakdown"> Task Breakdown</label>
            <label class="checkbox-label"><input type="checkbox" value="review_dev_output"> Code Review</label>
            <label class="checkbox-label"><input type="checkbox" value="generate_tests"> Generate Tests</label>
            <label class="checkbox-label"><input type="checkbox" value="vulnerability_scanning"> Security Scan</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Risk Sensitivity</label>
          <select id="agentRisk" class="form-select">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ceiling — Must Escalate (comma-separated)</label>
          <input type="text" id="agentEscalate" class="form-input" placeholder="e.g., modify_data_model, change_api_contract">
        </div>
        <div class="form-group">
          <label class="form-label">Ceiling — Strictly Forbidden (comma-separated)</label>
          <input type="text" id="agentForbidden" class="form-input" placeholder="e.g., cross_module_writes, production_db_access">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('createAgentModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createAgent()">Create & Register Agent</button>
      </div>
    </div>
  </div>

  <!-- Agent Detail Modal -->
  <div class="modal-overlay" id="agentDetailModal">
    <div class="modal" style="max-width:800px;">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Agent Details</h3>
        <button class="modal-close" onclick="closeModal('agentDetailModal')">&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <a id="workspaceLink" class="btn btn-primary" href="#">Open Workspace →</a>
        <button class="btn btn-outline" onclick="closeModal('agentDetailModal')">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay side" id="workspacePanel">
    <div class="modal side-modal">
      <div class="modal-header">
        <h3 class="modal-title" id="workspacePanelTitle">Agent Workspace</h3>
        <button class="modal-close" onclick="closeModal('workspacePanel')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="workspaceAgentMeta" style="margin-bottom:12px;"></div>
        <div class="workspace-tabs" id="workspacePanelTabs"></div>
        <div class="workspace-pane" id="workspacePanelContent"></div>
      </div>
      <div class="modal-footer">
        <a id="workspacePanelOpenFull" class="btn btn-primary" href="#">Open Full Workspace →</a>
        <button class="btn btn-outline" onclick="closeModal('workspacePanel')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/orchestration-runtime.js"></script>
  <script>
    seedNexusData();
    createNavigation('agents');

    const WORKSPACE_FILES = ['skills', 'tools', 'heartbeat', 'souls'];
    const WORKSPACE_LABELS = {
      skills: 'skills.md',
      tools: 'tools.md',
      heartbeat: 'heartbeat.md',
      souls: 'souls.md'
    };
    let activeWorkspaceAgentId = null;
    let activeWorkspaceFile = 'heartbeat';
    let liveTicker = null;

    function switchTab(tab, evt) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    function updateModelVariants() {
      const provider = document.getElementById('agentProvider').value;
      const variants = {
        anthropic_claude: ['claude-3-opus', 'claude-3-sonnet', 'claude-3-haiku'],
        openai_gpt: ['gpt-4o', 'gpt-4-turbo', 'gpt-3.5-turbo'],
        google_gemini: ['gemini-1.5-pro', 'gemini-1.5-flash', 'gemini-1.0-pro']
      };
      const sel = document.getElementById('agentVariant');
      sel.innerHTML = (variants[provider] || []).map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const hours = Math.floor(minutes / 60);
      if (hours > 0) {
        return String(hours).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }
      return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    function formatTimer(seconds) {
      return formatDuration((seconds || 0) * 1000);
    }

    function runtimePresence(status) {
      return statusBadge(status === 'ACTIVE' ? 'ACTIVE' : 'IDLE');
    }

    function getRuntimeAgent(snapshot, agentId) {
      return NexusOrchestration.getAgentById(snapshot, agentId);
    }

    function runtimeNode(snapshot, key) {
      const agent = snapshot.agents[key];
      if (!agent) return '';

      const statusClass = agent.status === 'ACTIVE' ? 'active' : 'inactive';
      const hasWorkspace = !!NexusStore.getAgent(agent.agentId);
      const click = hasWorkspace
        ? `openAgentWorkspacePanel('${agent.agentId}')`
        : `showToast('Runtime-only simulated agent: workspace unavailable', 'info')`;

      return `
        <div class="org-node runtime-org-node ${statusClass} ${agent.status === 'ACTIVE' ? 'active-glow' : ''}" data-agent="${key}" onclick="${click}">
          <div class="org-node-name">${escapeHtml(agent.name)}</div>
          <div class="org-node-role">${escapeHtml(agent.role.replace(/_/g, ' '))} · ${escapeHtml(agent.module)}</div>
          <div class="org-node-status status" data-status="${agent.status}">${runtimePresence(agent.status)}</div>
        </div>
      `;
    }

    function flowStatus(snapshot, index) {
      if (index < snapshot.phaseIndex) return 'COMPLETED';
      if (index === snapshot.phaseIndex) return 'EXECUTING';
      return 'PENDING';
    }

    function flowClass(status) {
      if (status === 'COMPLETED') return 'flow-status-completed';
      if (status === 'EXECUTING') return 'flow-status-active';
      return 'flow-status-pending';
    }

    function runtimeChip(agent) {
      return `
        <div class="runtime-agent-chip">
          <strong>${escapeHtml(agent.name)}</strong><br>
          ${runtimePresence(agent.status)} ${statusBadge(agent.stageStatus || 'PENDING')}<br>
          ${escapeHtml(agent.currentTaskId || 'N/A')} - ${escapeHtml(agent.currentTaskName || 'Awaiting assignment')}<br>
          Timer ${formatTimer(agent.timerSec)} · Tokens ${agent.tokens}
        </div>
      `;
    }

    function renderFlowStageDetails(snapshot, phase) {
      if (phase.id === 'ai_pipeline') {
        return `
          <div class="ai-task-list">
            ${(snapshot.aiPipelineTasks || []).map(task => `
              <div class="ai-task-item">
                <strong>${escapeHtml(task.name)}</strong><br>
                ${statusBadge(task.status)}<br>
                Timer ${formatTimer(task.timerSec)} · Tokens ${task.tokens}
              </div>
            `).join('')}
          </div>
        `;
      }

      return phase.members
        .map(memberKey => snapshot.agents[memberKey])
        .filter(Boolean)
        .map(runtimeChip)
        .join('');
    }

    function render() {
      const snapshot = NexusOrchestration.getSnapshot();
      const agents = NexusStore.getAgents() || [];
      const runtimeAgents = Object.values(snapshot.agents || {});
      const active = runtimeAgents.filter(a => a.status === 'ACTIVE').length;
      const inactive = runtimeAgents.length - active;
      const totalTokens = runtimeAgents.reduce((acc, item) => acc + (item.tokens || 0), 0);
      const escalations = snapshot.scrum && snapshot.scrum.escalations
        ? snapshot.scrum.escalations.filter(e => e.status === 'OPEN').length
        : 0;
      const avgGate = agents.length ? (agents.reduce((a, ag) => a + (ag.metrics ? ag.metrics.gate_pass_rate : 0), 0) / agents.length).toFixed(0) : 0;

      document.getElementById('agentStats').innerHTML = `
        <div class="stat-card"><span class="stat-label">Runtime Agents</span><span class="stat-value">${runtimeAgents.length}</span><span class="stat-change up">${active} active</span></div>
        <div class="stat-card"><span class="stat-label">Inactive</span><span class="stat-value">${inactive}</span></div>
        <div class="stat-card"><span class="stat-label">Open Escalations</span><span class="stat-value" style="color:${escalations>0?'var(--warning)':'var(--text-primary)'}">${escalations}</span></div>
        <div class="stat-card"><span class="stat-label">Total Tokens</span><span class="stat-value">${totalTokens}</span></div>
        <div class="stat-card"><span class="stat-label">Avg Gate Pass Rate</span><span class="stat-value">${avgGate}%</span></div>
      `;
      renderOrgChart(snapshot);
      renderAgentFlow(snapshot);
      renderLiveActivity(snapshot);
      renderAgentList(agents, snapshot);
      renderPerformance(agents, snapshot);
      syncHeartbeatFiles(snapshot, agents);
      if (activeWorkspaceAgentId) renderWorkspacePanel(snapshot);
      renderPopups(snapshot);
    }

    function renderOrgChart(snapshot) {
      document.getElementById('tab-orgchart').innerHTML = `
        <div class="org-chart">
          <div class="org-level">
            <div class="org-node" style="border-color:var(--warning)" onclick="showAgent(null)">
              <div class="org-node-name">👤 Human Orchestrator</div>
              <div class="org-node-role">Final Authority</div>
            </div>
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'businessAnalyst')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'aiPipeline')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'productOwner')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'testCaseGenerator')}
            ${runtimeNode(snapshot, 'chiefArchitect')}
            ${runtimeNode(snapshot, 'scrumMaster')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            <div class="org-branch">
              ${runtimeNode(snapshot, 'moduleArchitectAuth')}
              <div class="org-connector"></div>
              <div class="org-level">
                ${runtimeNode(snapshot, 'devAuth01')}
                ${runtimeNode(snapshot, 'devAuth02')}
              </div>
            </div>
            <div class="org-branch">
              ${runtimeNode(snapshot, 'moduleArchitectPayments')}
              <div class="org-connector"></div>
              <div class="org-level">
                ${runtimeNode(snapshot, 'devPay01')}
              </div>
            </div>
            <div class="org-branch">
              ${runtimeNode(snapshot, 'moduleArchitectOrders')}
              <div class="org-connector"></div>
              <div class="org-level">
                <div class="org-node runtime-org-node inactive">
                  <div class="org-node-name">No developer assigned</div>
                  <div class="org-node-role">orders</div>
                  <div class="org-node-status">${statusBadge('PENDING')}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'qaAgent')}
          </div>
          <div class="org-connector"></div>
          <div class="org-level">
            ${runtimeNode(snapshot, 'releaseAgent')}
          </div>
        </div>
        <div class="org-flow-note">ACTIVE agents glow. INACTIVE agents are dimmed. Scrum Master is connected to all module architects and developers.</div>
      `;
    }

    function renderAgentFlow(snapshot) {
      const phases = NexusOrchestration.getPhases();
      document.getElementById('tab-flow').innerHTML = `
        <div class="flow-route-strip">
          <strong>Flow:</strong>
          <span>BA</span><span>-></span>
          <span>AI Pipeline</span><span>-></span>
          <span>PO</span><span>-></span>
          <span>Test Case Generator</span><span>-></span>
          <span>CA</span><span>-></span>
          <span>Scrum</span><span>-></span>
          <span>Module</span><span>-></span>
          <span>Dev</span><span>-></span>
          <span>QA</span><span>-></span>
          <span>Release</span>
        </div>
        <div class="flow-stack">
          ${phases.map((phase, idx) => {
            const status = flowStatus(snapshot, idx);
            return `
                <div class="flow-card ${flowClass(status)}">
                  <div class="card-header" style="margin-bottom:8px;">
                    <div>
                      <h3 class="card-title">${escapeHtml(phase.title)}</h3>
                      <span class="card-subtitle">${phase.parallel ? 'Parallel stage' : 'Sequential stage'}</span>
                    </div>
                    ${statusBadge(status)}
                  </div>

                  <div class="flow-route-strip" style="margin-bottom:0;">
                    <span><strong>From:</strong> ${escapeHtml(phase.from)}</span>
                    <span>-></span>
                    <span><strong>To:</strong> ${escapeHtml(phase.to)}</span>
                  </div>

                  <div class="flow-io-grid">
                    <div class="flow-io-box">
                      <div class="flow-io-title">Input</div>
                      <div class="flow-io-list">${phase.input.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>
                    </div>
                    <div class="flow-io-box">
                      <div class="flow-io-title">Output</div>
                      <div class="flow-io-list">${phase.output.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>
                    </div>
                  </div>

                  ${renderFlowStageDetails(snapshot, phase)}
              </div>
              ${idx < phases.length - 1 ? '<div class="flow-arrow">↓</div>' : ''}
            `;
          }).join('')}
        </div>
      `;
    }


    function renderLiveActivity(snapshot) {
      const runtimeAgents = NexusOrchestration.getAgentOrder()
        .map(key => snapshot.agents[key])
        .filter(Boolean);

      document.getElementById('tab-live').innerHTML = `
        <div class="grid grid-3">
          ${runtimeAgents.map(agent => {
            const hasWorkspace = !!NexusStore.getAgent(agent.agentId);
            const click = hasWorkspace
              ? `openAgentWorkspacePanel('${agent.agentId}')`
              : `showToast('Runtime-only simulated agent: workspace unavailable', 'info')`;
            return `
              <div class="activity-card ${agent.status === 'ACTIVE' ? 'active' : 'inactive'}" onclick="${click}">
                <div class="card-header" style="margin-bottom:8px;">
                  <div>
                    <h3 class="card-title">${escapeHtml(agent.name)}</h3>
                    <span class="tag" style="font-family:var(--mono); margin-top:6px;">${escapeHtml(agent.currentTaskId || 'N/A')}</span>
                  </div>
                  ${runtimePresence(agent.status)}
                </div>

                <div style="margin-top:10px; font-size:13px; color:var(--text-secondary);">
                  <span style="color:var(--text-muted);">Current Action:</span> ${escapeHtml(agent.currentAction || 'Awaiting assignment')}
                </div>

                <div class="activity-meta">
                  <div class="activity-kv"><span>Tokens Used</span>${agent.tokens}</div>
                  <div class="activity-kv"><span>Timer</span>${formatTimer(agent.timerSec)}</div>
                  <div class="activity-kv"><span>Status</span>${escapeHtml(agent.stageStatus || 'PENDING')}</div>
                  <div class="activity-kv"><span>Task</span>${escapeHtml(agent.currentTaskName || 'Awaiting assignment')}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderAgentList(agents, snapshot) {
      document.getElementById('tab-list').innerHTML = `
        <div class="table-container">
          <table>
            <thead><tr><th>Agent</th><th>Role</th><th>Module</th><th>Model</th><th>Lifecycle</th><th>Runtime</th><th>Task</th><th>Timer</th><th>Tokens</th><th>Actions</th></tr></thead>
            <tbody>
              ${agents.map(a => {
                  const runtime = getRuntimeAgent(snapshot, a.agent_id);
                  const runtimeStatus = runtime ? runtime.status : 'INACTIVE';
                  const taskId = runtime ? runtime.currentTaskId : 'N/A';
                  const timer = runtime ? formatTimer(runtime.timerSec) : '00:00';
                  const tokens = runtime ? runtime.tokens : '-';
                  return `
                <tr>
                  <td style="font-weight:600;">${escapeHtml(a.agent_name)}</td>
                  <td><span class="tag">${a.role.replace(/_/g,' ')}</span></td>
                  <td><span class="tag">${a.module_scope}</span></td>
                  <td style="font-size:12px; color:var(--text-muted)">${a.model_variant}</td>
                  <td>${statusBadge(a.lifecycle)}</td>
                  <td>${runtimePresence(runtimeStatus)}</td>
                  <td style="font-family:var(--mono); font-size:12px;">${escapeHtml(taskId)}</td>
                  <td>${timer}</td>
                  <td>${tokens}</td>
                  <td>
                    <button class="btn btn-outline btn-sm" onclick="openAgentWorkspacePanel('${a.agent_id}')">Workspace Panel</button>
                    <a class="btn btn-outline btn-sm" href="agent-workspace.html?id=${a.agent_id}">Workspace</a>
                  </td>
                </tr>
                  `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPerformance(agents, snapshot) {
      document.getElementById('tab-performance').innerHTML = `
        <div class="grid grid-2">
          ${agents.map(a => {
              const runtime = getRuntimeAgent(snapshot, a.agent_id);
              const runtimeStatus = runtime ? runtime.status : 'INACTIVE';
              const runtimeTimer = runtime ? formatTimer(runtime.timerSec) : '00:00';
              const gatePassRate = a.metrics ? a.metrics.gate_pass_rate : 0;
              const tasksCompleted = a.metrics ? a.metrics.tasks_completed : 0;
              const escalationsRaised = a.metrics ? a.metrics.escalations_raised : 0;
              return `
            <div class="card" onclick="openAgentWorkspacePanel('${a.agent_id}')" style="cursor:pointer;">
              <div class="card-header">
                <div><h3 class="card-title">${escapeHtml(a.agent_name)}</h3><span class="card-subtitle">${a.role.replace(/_/g,' ')} · ${a.module_scope}</span></div>
                ${runtimePresence(runtimeStatus)}
              </div>
              <div style="margin-bottom:10px; font-size:12px; color:var(--text-muted);">Runtime Timer: ${runtimeTimer}</div>
              <div class="metric-bar">
                <span class="metric-label">Tasks Completed</span>
                <div class="metric-track"><div class="metric-fill" style="width:${Math.min(tasksCompleted*3,100)}%;background:var(--success)"></div></div>
                <span class="metric-value">${tasksCompleted}</span>
              </div>
              <div class="metric-bar">
                <span class="metric-label">Escalations</span>
                <div class="metric-track"><div class="metric-fill" style="width:${Math.min(escalationsRaised*15,100)}%;background:var(--warning)"></div></div>
                <span class="metric-value">${escalationsRaised}</span>
              </div>
              <div class="metric-bar">
                <span class="metric-label">Gate Pass Rate</span>
                <div class="metric-track"><div class="metric-fill" style="width:${gatePassRate}%;background:${gatePassRate>=90?'var(--success)':gatePassRate>=70?'var(--warning)':'var(--danger)'}"></div></div>
                <span class="metric-value">${gatePassRate}%</span>
              </div>
            </div>
              `;
          }).join('')}
        </div>
      `;
    }

    function showAgent(id) {
      if (!id) return;
      openAgentWorkspacePanel(id);
    }

    function buildHeartbeatMarkdown(agent, runtime) {
      return `# HEARTBEAT\n\n## Current Task\n- ${runtime ? runtime.currentTaskId : 'N/A'}\n\n## Current Action\n- ${runtime ? runtime.currentAction : 'Awaiting assignment'}\n\n## Status\n${runtime ? runtime.status : 'INACTIVE'}\n\n## Tokens Used\n${runtime ? runtime.tokens : 0}\n\n## Active Timer\n${runtime ? formatTimer(runtime.timerSec) : '00:00'}\n\n## Agent\n${agent.agent_name}`;
    }

    function syncHeartbeatFiles(snapshot, agents) {
      agents.forEach(agent => {
        const runtime = getRuntimeAgent(snapshot, agent.agent_id);
        if (!runtime) return;
        const heartbeat = buildHeartbeatMarkdown(agent, runtime);
        if (NexusStore.getWorkspaceFile(agent.agent_id, 'heartbeat') !== heartbeat) {
          NexusStore.setWorkspaceFile(agent.agent_id, 'heartbeat', heartbeat);
        }
      });
    }

    function ensureWorkspaceDefaults(agentId, agentName) {
      const defaults = {
        skills: `# SKILLS\n\n## Core Responsibilities\n- Execute ${agentName} role actions\n- Produce structured outputs\n- Follow governance and escalation boundaries\n`,
        tools: '# TOOLS\n\n## Available Tools\n- code_generator\n- test_runner\n- quality_gate_checker\n\n## Rules\n- No production writes\n- Trace all changes\n',
        souls: '# SOUL\n\n## Behavioral Traits\n- Quality-first decisions\n- Explicit risk communication\n- Evidence-backed outputs\n'
      };
      ['skills', 'tools', 'souls'].forEach(file => {
        if (!NexusStore.getWorkspaceFile(agentId, file)) {
          NexusStore.setWorkspaceFile(agentId, file, defaults[file]);
        }
      });
      if (!NexusStore.getWorkspaceFile(agentId, 'heartbeat')) {
        NexusStore.setWorkspaceFile(agentId, 'heartbeat', buildHeartbeatMarkdown({ agent_name: agentName }, null));
      }
    }

    function openAgentWorkspacePanel(agentId) {
      const agent = NexusStore.getAgent(agentId);
      if (!agent) return;

      activeWorkspaceAgentId = agentId;
      activeWorkspaceFile = 'heartbeat';
      ensureWorkspaceDefaults(agentId, agent.agent_name);
      renderWorkspacePanel(NexusOrchestration.getSnapshot());
      document.getElementById('workspacePanel').classList.add('show');
    }

    function switchWorkspaceFile(fileName) {
      activeWorkspaceFile = fileName;
      renderWorkspacePanel(NexusOrchestration.getSnapshot());
    }

    function renderWorkspacePanel(snapshot) {
      if (!activeWorkspaceAgentId) return;
      const agent = NexusStore.getAgent(activeWorkspaceAgentId);
      if (!agent) return;

      const runtime = getRuntimeAgent(snapshot, activeWorkspaceAgentId);
      document.getElementById('workspacePanelTitle').textContent = agent.agent_name + ' Workspace';
      document.getElementById('workspacePanelOpenFull').href = 'agent-workspace.html?id=' + agent.agent_id;
      document.getElementById('workspaceAgentMeta').innerHTML = `
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span class="tag">${agent.agent_id}</span>
          <span class="tag">${agent.role.replace(/_/g, ' ')}</span>
          ${runtimePresence(runtime ? runtime.status : 'INACTIVE')}
          ${runtime ? `<span class="tag" style="font-family:var(--mono);">${runtime.currentTaskId}</span>` : ''}
          ${runtime ? `<span class="tag">Tokens ${runtime.tokens}</span>` : ''}
        </div>
      `;

      document.getElementById('workspacePanelTabs').innerHTML = WORKSPACE_FILES.map(file =>
        `<div class="workspace-tab ${activeWorkspaceFile === file ? 'active' : ''}" onclick="switchWorkspaceFile('${file}')">${WORKSPACE_LABELS[file]}</div>`
      ).join('');

      let content = NexusStore.getWorkspaceFile(activeWorkspaceAgentId, activeWorkspaceFile);
      if (activeWorkspaceFile === 'heartbeat') {
        content = buildHeartbeatMarkdown(agent, runtime);
      }

      document.getElementById('workspacePanelContent').innerHTML = `<pre>${escapeHtml(content)}</pre>`;
    }

    function ensurePopupStack() {
      let stack = document.getElementById('orchestrationPopupStack');
      if (!stack) {
        stack = document.createElement('div');
        stack.id = 'orchestrationPopupStack';
        stack.className = 'orchestration-popup-stack';
        document.body.appendChild(stack);
      }
      return stack;
    }

    function renderPopups(snapshot) {
      const stack = ensurePopupStack();
      const notification = snapshot.activeNotification;

      if (!notification) {
        stack.innerHTML = '';
        return;
      }

      const type = String(notification.type || 'TASK_START').toUpperCase();
      stack.innerHTML = `
        <div class="orchestration-popup popup-${type.toLowerCase()}">
          <div class="label">${escapeHtml(type.replace('_', ' '))}</div>
          <div class="message">${escapeHtml(notification.message)}</div>
          <div class="time">${formatTime(notification.timestamp)}</div>
        </div>
      `;
    }

    function openCreateAgent() { document.getElementById('createAgentModal').classList.add('show'); }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
      if (id === 'workspacePanel') activeWorkspaceAgentId = null;
    }

    async function createAgent() {
      const name = document.getElementById('agentName').value.trim();
      if (!name) { showToast('Agent name required', 'error'); return; }

      const caps = Array.from(document.querySelectorAll('#capabilitiesGroup input:checked')).map(c => c.value);
      showLoading('Creating agent...');

      const result = await MockAPI.createAgent({
        agent_name: name,
        role: document.getElementById('agentRole').value,
        module_scope: document.getElementById('agentScope').value,
        model_provider: document.getElementById('agentProvider').value,
        model_variant: document.getElementById('agentVariant').value,
        capabilities: caps,
        ceiling_profile: {
          can_autonomously: caps,
          must_escalate: document.getElementById('agentEscalate').value.split(',').map(s=>s.trim()).filter(Boolean),
          strictly_forbidden: document.getElementById('agentForbidden').value.split(',').map(s=>s.trim()).filter(Boolean),
          risk_sensitivity: document.getElementById('agentRisk').value
        }
      });

      hideLoading();
      closeModal('createAgentModal');
      if (result.success) {
        showToast(`Agent "${name}" created and registered`, 'success');
        render();
      }
    }

    function startRuntimeTicker() {
      if (!liveTicker) {
        liveTicker = setInterval(() => {
          render();
        }, 1000);
      }
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'nexus_orchestration_runtime_v1') {
        render();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (liveTicker) clearInterval(liveTicker);
    });

    render();
    startRuntimeTicker();
  </script>
</body>
</html>
