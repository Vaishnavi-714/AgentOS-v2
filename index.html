<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Login</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container fade-in">
      <div class="login-brand">
        <span class="login-brand-icon">🧠</span>
        <span class="login-brand-text">NEXUS</span>
        <span class="login-brand-sub" id="loginWorkspaceTitle">Use your organization email to sign in</span>
      </div>
      <div id="loginError" class="login-error"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Organization Email</label>
          <input type="email" id="username" class="form-input" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content: center; margin-top: 8px;">
          Sign In to NEXUS
        </button>
      </form>
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Demo Credentials</p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <button class="btn btn-outline btn-sm" onclick="fillDemo('admin@infosys.com','admin123')">Infosys Admin</button>
          <button class="btn btn-outline btn-sm" onclick="fillDemo('admin@tcs.com','admin123')">TCS Admin</button>
          <button class="btn btn-outline btn-sm" onclick="fillDemo('admin@nexus.com','admin123')">System Admin</button>
        </div>
        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);">
          <a href="landing.html" style="color: var(--accent); font-size: 13px; text-decoration: none;">← Back to Home</a>
          <span style="color: var(--text-muted); margin: 0 8px;">·</span>
          <a href="register-tenant.html" style="color: var(--text-secondary); font-size: 13px; text-decoration: none;">Register Tenant</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/state.js"></script>
  <script>
    // Seed data on first load
    seedNexusData();

    // If already logged in, redirect
    if (TenantState.isLoggedIn()) {
      if (localStorage.getItem("role") === "admin" || TenantState.isSystemAdmin()) {
        localStorage.setItem("role", "admin");
        window.location.href = 'admin/admin-console.html';
      } else {
        localStorage.setItem("role", "tenant");
        window.location.href = 'workspace/dashboard.html';
      }
    }

    function fillDemo(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.classList.remove('show');

      if (!email.includes('@')) {
        errorEl.textContent = 'Please enter a valid organization email';
        errorEl.classList.add('show');
        return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      // Simulate auth delay
      await new Promise(r => setTimeout(r, 600));

      const domain = email.split('@')[1];

      // SYSTEM ADMIN LOGIN
      if (domain === 'nexus.com') {
        TenantState.loginAsSystemAdmin(email);
        localStorage.setItem("role", "admin");
        // Also set NexusStore user for nav/permissions
        NexusStore.setUser({ id: 'sys_admin', name: 'System Admin', role: 'Human Orchestrator', avatar: '🛡️', loginAt: new Date().toISOString() });
        NexusStore.addLog({ type: 'AUTH', message: `System Admin (${email}) logged in`, agent: 'system' });
        window.location.href = 'admin/admin-console.html';
        return;
      }

      // TENANT USER LOGIN
      const tenant = TenantState.findTenantByDomain(domain);
      if (!tenant) {
        errorEl.textContent = 'Invalid organization email. No tenant found for this domain.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In to NEXUS';
        return;
      }

      if (tenant.status === 'SUSPENDED') {
        errorEl.textContent = 'This tenant has been suspended. Contact your administrator.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In to NEXUS';
        return;
      }

      TenantState.loginAsTenantUser(email, tenant);
      localStorage.setItem("role", "tenant");
      // Set NexusStore user for nav/permissions
      const userName = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      NexusStore.setUser({ id: 'tenant_user_' + Date.now(), name: userName, role: 'Human Orchestrator', avatar: '👤', loginAt: new Date().toISOString() });
      NexusStore.addLog({ type: 'AUTH', message: `${userName} logged into ${tenant.name}`, agent: 'system' });
      window.location.href = 'workspace/dashboard.html';
    }
  </script>
</body>
</html>
