<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Login</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container fade-in">
      <div class="login-brand">
        <span class="login-brand-icon">🧠</span>
        <span class="login-brand-text">NEXUS</span>
        <span class="login-brand-sub">Multi-Agent Governed Software Development OS</span>
      </div>
      <div id="loginError" class="login-error"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content: center; margin-top: 8px;">
          Sign In to NEXUS
        </button>
      </form>
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Demo Credentials</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button class="btn btn-outline btn-sm" onclick="fillDemo('admin','admin123')">Admin / admin123</button>
          <button class="btn btn-outline btn-sm" onclick="fillDemo('pm','pm123')">PM / pm123</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mock-api.js"></script>
  <script>
    // Seed data on first load
    seedNexusData();

    // If already logged in, redirect
    if (NexusStore.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    function fillDemo(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.classList.remove('show');

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const result = await MockAPI.login(username, password);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In to NEXUS';
      }
    }
  </script>
</body>
</html>
